name: Post to Instagram

# Fires automatically whenever new post images land under social/posts/
# (pushed by the daily Instagram content job), and publishes each new
# image straight to @wordfaithnetwork via the Instagram Graph API.
# Can also be run by hand from the Actions tab to post a specific file.
on:
  push:
    branches: [main]
    paths:
      - "social/posts/**/*.png"
  workflow_dispatch:
    inputs:
      file:
        description: "Path (under social/posts/) of a specific image to post"
        required: false
      graph_host:
        description: "Graph API host to use (debugging only)"
        required: false
        default: "graph.instagram.com"
      debug:
        description: "Set to 1 to print /me and /me/accounts instead of posting (debugging only)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find new images from this push, grouped into one post per day/type
        id: files
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILES="${{ github.event.inputs.file }}"
          else
            FILES=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'social/posts/**/*.png' || true)
            if [ -z "$FILES" ]; then
              # Fall back to any changed (not just added) png, in case a
              # post was re-generated rather than newly created.
              FILES=$(git diff --name-only HEAD^ HEAD -- 'social/posts/**/*.png' || true)
            fi
          fi
          echo "Changed files:"
          echo "$FILES"

          # A long prayer/sermon spills onto extra cards named
          # <base>-2.png, <base>-3.png, ... alongside the first card
          # <base>.png (base always ends in -YYYY-MM-DD). Group every
          # changed file by that base, then pick up ALL matching parts
          # on disk (not just the ones git reports as changed) so a
          # multi-card day always posts as one carousel.
          declare -A seen_bases
          GROUPS=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(echo "$f" | sed -E 's/^(.*-[0-9]{4}-[0-9]{2}-[0-9]{2})(-[0-9]+)?\.png$/\1/')
            if [ -n "${seen_bases[$base]:-}" ]; then continue; fi
            seen_bases[$base]=1
            parts=$(ls "${base}.png" "${base}-"[0-9]*.png 2>/dev/null | sort -V | tr '\n' ' ')
            echo "Group for $base: $parts"
            GROUPS="${GROUPS}${parts}"$'\n'
          done <<< "$FILES"

          {
            echo "groups<<EOF"
            echo "$GROUPS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post each day's card(s) to Instagram
        if: steps.files.outputs.groups != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ github.event.inputs.graph_host }}
          IG_DEBUG: ${{ github.event.inputs.debug }}
        run: |
          set -euo pipefail
          while IFS= read -r group; do
            [ -z "$group" ] && continue
            echo "::group::Posting $group"
            node social/post-to-instagram.js $group
            echo "::endgroup::"
            sleep 5
          done <<< "${{ steps.files.outputs.groups }}"
