name: Exchange Instagram auth code for a token

# One-off manual tool: takes the ?code=... from the Instagram Business
# Login redirect and exchanges it for a short-lived token, then
# immediately exchanges that for a 60-day long-lived token. Prints the
# result so it can be copied into the IG_ACCESS_TOKEN repo secret.
# Not triggered automatically.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "The ?code=... value from the redirect URL after authorizing"
        required: true
      redirect_uri:
        description: "The exact redirect URI registered in the Login Configuration"
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code for short-lived token, then for a long-lived one
        env:
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          CODE: ${{ github.event.inputs.code }}
          REDIRECT_URI: ${{ github.event.inputs.redirect_uri }}
        run: |
          set -euo pipefail
          echo "Exchanging code for a short-lived token..."
          SHORT_RESPONSE=$(curl -s -X POST https://api.instagram.com/oauth/access_token \
            -F "client_id=$IG_APP_ID" \
            -F "client_secret=$IG_APP_SECRET" \
            -F "grant_type=authorization_code" \
            -F "redirect_uri=$REDIRECT_URI" \
            -F "code=$CODE")
          echo "Short-lived response: $SHORT_RESPONSE"

          SHORT_TOKEN=$(echo "$SHORT_RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).access_token||'')}catch(e){console.log('')}})")
          USER_ID=$(echo "$SHORT_RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).user_id||'')}catch(e){console.log('')}})")

          if [ -z "$SHORT_TOKEN" ]; then
            echo "::error::No access_token in response above — check the code/redirect_uri and try again (codes expire fast, ~1 minute)."
            exit 1
          fi

          echo "Instagram user_id from this token: $USER_ID"
          echo "Exchanging for a long-lived (60 day) token..."
          LONG_RESPONSE=$(curl -s "https://graph.instagram.com/access_token?grant_type=ig_exchange_token&client_secret=$IG_APP_SECRET&access_token=$SHORT_TOKEN")
          echo "Long-lived response: $LONG_RESPONSE"
