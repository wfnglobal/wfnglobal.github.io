name: Render Instagram Reel

# Fires when a new Reel content file lands under social/reels/ (pushed
# by the daily Instagram content job - it writes only the TEXT content
# there, since it has no access to the ElevenLabs key). This Action
# does the actual rendering: calls ElevenLabs for the voiceover,
# renders the branded video with Playwright, muxes it with ffmpeg, and
# commits the finished .mp4/.cover.png to social/posts/.
#
# By design this does NOT auto-post to Instagram - Oladapo asked for
# the daily Reel to come to him to post himself, not go out
# automatically like the prayer/sermon image cards do. The posting
# script (social/post-reel-to-instagram.js) is still in the repo and
# this workflow can still call it, but only as an explicit opt-in: run
# workflow_dispatch by hand with post: "1" if auto-posting is wanted
# for a specific run. A plain push, or a dispatch without that input,
# only renders and commits - it never posts on its own.
on:
  push:
    branches: [main]
    paths:
      - "social/reels/**/*.json"
  workflow_dispatch:
    inputs:
      content_file:
        description: "Path to a specific content.json under social/reels/ to render"
        required: false
      post:
        description: "Set to 1 to ALSO post this specific run straight to Instagram (default: render + commit only, never auto-posts)"
        required: false
        default: ""

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies (Playwright + Chromium)
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Find new reel content file(s) from this push
        id: find
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.content_file }}" ]; then
            FILES="${{ github.event.inputs.content_file }}"
          else
            # NOTE: git's pathspec `**` needs the :(glob) magic prefix to
            # match cross-directory the way the `paths:` trigger above
            # does - see the commit that fixed the same bug in
            # instagram-post.yml for the full explanation.
            FILES=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- ':(glob)social/reels/**/*.json' || true)
            if [ -z "$FILES" ]; then
              FILES=$(git diff --name-only HEAD^ HEAD -- ':(glob)social/reels/**/*.json' || true)
            fi
          fi
          echo "Changed files:"
          echo "$FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render video(s) and commit them
        id: generate
        if: steps.find.outputs.files != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          set -euo pipefail
          BASES=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base="social/posts/$(basename "$f" .json)"
            echo "::group::Rendering $f"
            node social/generate-reel.js "$f" "$base"
            echo "::endgroup::"
            BASES="${BASES}${base}"$'\n'
          done <<< "${{ steps.find.outputs.files }}"

          if [ -z "$BASES" ]; then
            echo "Nothing rendered."
            {
              echo "bases<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/posts/*.mp4 social/posts/*.cover.png
          git commit -m "$(printf 'Render Instagram Reel video(s)\n\nCo-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>')"
          git push

          NEW_SHA=$(git rev-parse HEAD)
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "bases<<EOF"
            echo "$BASES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post Reel(s) to Instagram (only when explicitly requested)
        if: steps.generate.outputs.bases != '' && github.event.inputs.post == '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ github.event.inputs.graph_host }}
          # Override the default GITHUB_SHA (the commit that triggered
          # this run, which does NOT contain the newly-rendered video)
          # with the commit the "Render" step just pushed, which does -
          # post-reel-to-instagram.js needs a SHA whose
          # raw.githubusercontent.com URL actually serves the file.
          GITHUB_SHA: ${{ steps.generate.outputs.new_sha }}
        run: |
          set -euo pipefail
          while IFS= read -r base; do
            [ -z "$base" ] && continue
            video="${base}.mp4"
            cover="${base}.cover.png"
            if [ ! -f "$video" ]; then
              echo "::warning::Skipping - video not found: $video"
              continue
            fi
            echo "::group::Posting $video"
            node social/post-reel-to-instagram.js "$video" "$cover"
            echo "::endgroup::"
            sleep 5
          done <<< "${{ steps.generate.outputs.bases }}"

      - name: Rendered - ready for you to post
        if: steps.generate.outputs.bases != '' && github.event.inputs.post != '1'
        run: |
          echo "Video(s) rendered and committed to social/posts/ - NOT posted to Instagram."
          echo "This pipeline only auto-renders; posting is always a manual/opt-in step so Oladapo can post these himself:"
          echo "${{ steps.generate.outputs.bases }}"
