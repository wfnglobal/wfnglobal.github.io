<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="covTitle covDesc">
        <title id="covTitle">Another Jesus — Word and Faith Network, by Oladapo Olaleye</title>
        <desc id="covDesc">Book cover: deep indigo-to-midnight gradient background with two overlapping crosses inside a circle — one faint and ghosted, one solid gold and sharp — the bold title Another Jesus, a tagline, and the author's name.</desc>
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#241B4A"/>
            <stop offset="55%" stop-color="#140F30"/>
            <stop offset="100%" stop-color="#070512"/>
          </linearGradient>
          <radialGradient id="glow" cx="50%" cy="24%" r="60%">
            <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.38"/>
            <stop offset="55%" stop-color="#E8A33D" stop-opacity="0.09"/>
            <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FBE3B8"/>
            <stop offset="100%" stop-color="#E8A33D"/>
          </linearGradient>
          <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F2C97A"/>
            <stop offset="100%" stop-color="#C9344A"/>
          </linearGradient>
        </defs>
        <rect width="600" height="900" fill="url(#bgGrad)"/>
        <rect width="600" height="900" fill="url(#glow)"/>
        <g fill="#E8A33D">
          <circle cx="68" cy="100" r="3" opacity="0.4"/>
          <circle cx="524" cy="88" r="3.5" opacity="0.35"/>
          <circle cx="50" cy="210" r="2.2" opacity="0.25"/>
          <circle cx="548" cy="225" r="2.6" opacity="0.25"/>
        </g>
        <rect x="28" y="28" width="544" height="844" fill="none" stroke="#E8A33D" stroke-width="1" opacity="0.5"/>
        <rect x="38" y="38" width="524" height="824" fill="none" stroke="#E8A33D" stroke-width="0.5" opacity="0.25"/>
        <g transform="translate(300,165)">
          <circle cx="0" cy="0" r="52" fill="none" stroke="#9C87D9" stroke-width="1.4" opacity="0.75"/>
          <g transform="translate(-10,-6)" opacity="0.45">
            <line x1="0" y1="-38" x2="0" y2="38" stroke="#C9B6F0" stroke-width="5" stroke-linecap="round"/>
            <line x1="-18" y1="-14" x2="18" y2="-14" stroke="#C9B6F0" stroke-width="5" stroke-linecap="round"/>
          </g>
          <g transform="translate(6,4)">
            <line x1="0" y1="-40" x2="0" y2="40" stroke="url(#crossGrad)" stroke-width="7" stroke-linecap="round"/>
            <line x1="-19" y1="-14" x2="19" y2="-14" stroke="url(#crossGrad)" stroke-width="7" stroke-linecap="round"/>
            <circle cx="0" cy="-14" r="3.4" fill="#FBE3B8"/>
          </g>
        </g>
        <text x="300" y="330" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#E8A33D">WORD &amp; FAITH NETWORK</text>
        <line x1="255" y1="352" x2="345" y2="352" stroke="#E8A33D" stroke-width="1" opacity="0.6"/>
        <text x="300" y="460" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="92" font-weight="900" fill="url(#goldText)" letter-spacing="1">ANOTHER</text>
        <text x="300" y="558" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="92" font-weight="900" fill="url(#goldText)" letter-spacing="1">JESUS</text>
        <line x1="200" y1="590" x2="400" y2="590" stroke="#E8A33D" stroke-width="1" opacity="0.7"/>
        <text x="300" y="622" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="21" fill="#D9C9F0">Learning to Recognize the Real One</text>
        <text x="300" y="652" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="21" fill="#F4D9A9">in an Age of Prophets, Visions, and Claims</text>
        <text x="300" y="700" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#A996C9" font-style="italic">Not everyone who says "Lord, Lord" is speaking to the One who saves.</text>
        <text x="300" y="800" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#F4E3C4">OLADAPO OLALEYE</text>
        <text x="300" y="822" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10.5" letter-spacing="2" fill="#8C7AB3">BOOK FOUR &#183; THE LIBRARY</text>
      </svg>
