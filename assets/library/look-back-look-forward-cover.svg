<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="covTitle covDesc">
  <title id="covTitle">Look Back, Look Forward — Word and Faith Network, by Oladapo Olaleye</title>
  <desc id="covDesc">Book cover: deep night-sky background with scattered golden bokeh light, radiating rays from the Word and Faith Network mark, and the title Look Back, Look Forward.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332B1C"/>
      <stop offset="50%" stop-color="#1D1810"/>
      <stop offset="100%" stop-color="#100C08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="24%" r="60%">
      <stop offset="0%" stop-color="#C9A968" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#C9A968" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C9A968" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6E8BE"/>
      <stop offset="100%" stop-color="#C9A968"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6E8BE"/>
      <stop offset="100%" stop-color="#C9A968"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bgGrad)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <g fill="#C9A968">
    <circle cx="70" cy="110" r="4" opacity="0.5"/>
    <circle cx="130" cy="70" r="2.5" opacity="0.35"/>
    <circle cx="520" cy="95" r="5" opacity="0.4"/>
    <circle cx="470" cy="150" r="2.5" opacity="0.3"/>
    <circle cx="60" cy="230" r="3" opacity="0.3"/>
    <circle cx="545" cy="240" r="3.5" opacity="0.35"/>
    <circle cx="40" cy="340" r="2.5" opacity="0.25"/>
    <circle cx="560" cy="360" r="2.5" opacity="0.25"/>
  </g>
  <g stroke="#C9A968" stroke-width="1" opacity="0.4">
    <line x1="300" y1="220" x2="95" y2="35"/>
    <line x1="300" y1="220" x2="300" y2="-10"/>
    <line x1="300" y1="220" x2="505" y2="35"/>
    <line x1="300" y1="220" x2="45" y2="150"/>
    <line x1="300" y1="220" x2="555" y2="150"/>
  </g>
  <rect x="28" y="28" width="544" height="844" fill="none" stroke="#C9A968" stroke-width="1" opacity="0.55"/>
  <rect x="38" y="38" width="524" height="824" fill="none" stroke="#C9A968" stroke-width="0.5" opacity="0.3"/>
  <g transform="translate(300,165)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#C9A968" stroke-width="1.2" opacity="0.85"/>
    <path d="M-42 18 L-31 -33 L-18.5 6.25 L0 -21 L18.5 6.25 L31 -33 L42 18" fill="none" stroke="url(#flameGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -21 C-5.2 -30 -4 -40 0 -50 C4 -40 5.2 -30 0 -21 Z" fill="#F6E8BE"/>
  </g>
  <text x="300" y="312" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#C9A968">WORD &amp; FAITH NETWORK</text>
  <line x1="255" y1="334" x2="345" y2="334" stroke="#C9A968" stroke-width="1" opacity="0.6"/>
  <text x="300" y="438" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="52" font-weight="900" fill="url(#goldText)" letter-spacing="0.5">LOOK BACK,</text>
  <text x="300" y="502" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="52" font-weight="900" fill="url(#goldText)" letter-spacing="0.5">LOOK FORWARD</text>
  <line x1="200" y1="570" x2="400" y2="570" stroke="#9C7A34" stroke-width="1" opacity="0.7"/>
  <text x="300" y="604" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="22" fill="#E3D3A4">Thank God for the Past.</text>
  <text x="300" y="634" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="22" fill="#E3D3A4">Trust Him for What's Next.</text>
  <text x="300" y="682" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.2" fill="#9C8A5E" font-style="italic">Every mile behind you is a reason to trust the miles ahead.</text>
  <text x="300" y="800" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#F0DFAE">OLADAPO OLALEYE</text>
  <text x="300" y="822" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10.5" letter-spacing="2" fill="#8C8370">BOOK TWO &#183; THE LIBRARY</text>
</svg>
