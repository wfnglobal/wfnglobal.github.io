<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Give to</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#2A6766}a:hover{color:#1E4E4D}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F6F5F2; color: #1F1D1B; font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased;">
  <div aria-hidden="true" style="padding: 66px 16px 0; display: flex; justify-content: center;"><span style="font-family: Literata, Georgia, serif; font-size: 64px; line-height: 70px;">$50</span></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,19,18,0.42);"></div>
  <section role="dialog" aria-labelledby="gtH" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 18px; padding: 10px 18px 34px; border-radius: 28px 28px 0 0; background: #FFFFFF; box-shadow: 0 -10px 40px rgba(31,29,27,0.18);">
    <span style="align-self: center; width: 38px; height: 5px; border-radius: 12px; background: #ECEAE5;"></span>
    <div style="display: flex; align-items: center;">
      <h2 id="gtH" style="margin: 0; flex-grow: 1; font-family: Literata, Georgia, serif; font-size: 23px; font-weight: 400;">Give to</h2>
      <a href="Give.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #ECEAE5; color: #1F1D1B; display: flex; align-items: center; font-size: 13.5px; font-weight: 600; text-decoration: none;">Done</a>
    </div>
    <div role="radiogroup" aria-labelledby="gtH" style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{funds}}" as="f" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{f.on}}" style="display: flex; gap: 14px; padding: 16px; border-radius: 22px; border: {{f.border}}; background: {{f.bg}}; text-align: left; color: #1F1D1B;">
          <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 16px; background: {{f.soft}}; color: {{f.color}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;"><span style="font: 600 16px 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;">{{f.name}}</span><span style="font: 400 13.5px/20px 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; color: #55514B;">{{f.text}}</span></span>
          <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; border: {{f.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{f.dot}};"></span></span>
        </button>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const funds = [
      { name: 'Where it’s needed most', text: 'Keeps WFN free every day and lets the ministry put your gift where it will do the most good right now.', color: '#435C82', soft: '#E4E8F0', icon: 'M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6zM9 12l2 2 4-4' },
      { name: 'Spread the Word', text: 'Sermons, Bible studies, films, books and translations that carry the gospel to new people and new nations.', color: '#985F1E', soft: '#F5EAD9', icon: 'M2 5.5c3-1.5 6.5-1.5 10 1 3.5-2.5 7-2.5 10-1V19c-3-1.5-6.5-1.5-10 1-3.5-2.5-7-2.5-10-1zM12 6.5V20' },
      { name: 'Care for the needy', text: 'Food, school fees, medical help and practical care for families and communities in hardship, given in Jesus’ name.', color: '#2A6766', soft: '#DFEAE6', icon: 'M12 10.6c-1.2-2.4-5-2.2-5 .6 0 2 2.6 3.6 5 5.4 2.4-1.8 5-3.4 5-5.4 0-2.8-3.8-3-5-.6zM2 15h3l3 3h7a2 2 0 0 0 0-4M2 21h13l6.5-4.5a1.8 1.8 0 0 0-2.3-2.7L15 16.5' }
    ].map((f, i) => ({ ...f, on: i === 0 ? 'true' : 'false', bg: i === 0 ? '#F6F5F2' : '#FFFFFF', border: i === 0 ? '2px solid #2A6766' : '1px solid rgba(31,29,27,0.10)', ring: i === 0 ? '2px solid #2A6766' : '1.5px solid #CFC9C0', dot: i === 0 ? '#2A6766' : 'transparent' }));
    return { funds };
  }
}
</script>
</body>
</html>
