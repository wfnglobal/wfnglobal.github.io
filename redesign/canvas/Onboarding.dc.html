<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#2A6766}a:hover{color:#1E4E4D}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px; padding: 40px 24px 30px; background: #F4F2EE; color: #1F1D1B; font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased;"><svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.05; mix-blend-mode: multiply;"><filter id="paperGrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.22  0 0 0 0 0.18  0 0 0 0.7 0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#paperGrain)"></rect></svg>
  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="40" height="40" viewBox="0 0 48 48" role="img" aria-label="Word and Faith Network"><circle cx="24" cy="24" r="23" fill="#1F1D1B"></circle><path d="M24 7 C 31 14, 33 21, 24 25 C 15 21, 17 14, 24 7 Z" fill="#E2A85A"></path><path transform="rotate(120 24 25)" d="M24 7 C 31 14, 33 21, 24 25 C 15 21, 17 14, 24 7 Z" fill="#7CC4C0"></path><path transform="rotate(240 24 25)" d="M24 7 C 31 14, 33 21, 24 25 C 15 21, 17 14, 24 7 Z" fill="#9DB3D9"></path><circle cx="24" cy="25" r="4.5" fill="#1F1D1B"></circle><circle cx="24" cy="25" r="2.1" fill="#F4F2EE"></circle></svg>
    <span style="flex-grow: 1; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;">Word &amp; Faith Network</span>
    <span style="display: flex; gap: 6px;" aria-label="Step 1 of 3"><span style="width: 18px; height: 6px; border-radius: 12px; background: #2A6766;"></span><span style="width: 6px; height: 6px; border-radius: 12px; background: #D8D3CB;"></span><span style="width: 6px; height: 6px; border-radius: 12px; background: #D8D3CB;"></span></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 34px; line-height: 41px; font-weight: 400; letter-spacing: -0.01em;">The Word produces faith, and faith prays.</h1>
    <p style="margin: 0; font-size: 13px; font-weight: 500; color: #985F1E;">Romans 10:17 · So then faith cometh by hearing, and hearing by the word of God.</p>
  </div>

  <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{pillars}}" as="p" hint-placeholder-count="3">
      <li style="display: flex; gap: 14px; padding: 16px; border-radius: 24px; background: #FFFDFA; border: 1px solid rgba(31,29,27,0.05); box-shadow: 0 1px 2px rgba(31,29,27,0.04), 0 14px 34px -18px rgba(31,29,27,0.16);">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 16px; background: {{p.soft}}; color: {{p.color}}; display: flex; align-items: center; justify-content: center; font: 600 15px 'Instrument Sans', sans-serif;">{{p.n}}</span>
        <span style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: {{p.color}};">{{p.name}}</span>
          <span style="font-size: 15px; line-height: 21px; color: #1F1D1B;">{{p.text}}</span>
        </span>
      </li>
    </sc-for>
  </ol>

  <span style="flex-grow: 1;"></span>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 18px; background: #2A6766; color: #FFFDFA; font: 600 16px 'Instrument Sans', sans-serif; text-decoration: none;">Begin today’s Word</a>
    <p style="margin: 0; text-align: center; font-size: 13px; line-height: 19px; color: #55514B;">Next: your name, your reminder times, and adding WFN to your home screen. It works offline.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { pillars: [
      { n: 1, name: 'The Word', text: 'Scripture every day, not just read but declared. A full offline Bible in your pocket.', color: '#985F1E', soft: '#F5EAD9' },
      { n: 2, name: 'Prayer', text: 'Declarations and prayers grounded in Scripture, morning and night.', color: '#2A6766', soft: '#DFEAE6' },
      { n: 3, name: 'Faith', text: 'Studies, sermons and books that move you from knowing about God to walking in His promises.', color: '#435C82', soft: '#E4E8F0' }
    ] };
  }
}
</script>
</body>
</html>
