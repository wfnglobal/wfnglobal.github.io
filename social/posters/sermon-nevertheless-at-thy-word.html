<!doctype html>
<html><head><meta charset="utf-8">
<!-- WFN sermon poster - Nevertheless at Thy Word (Luke 5:4-6), Nov 18, 2026 -->
<style>
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-400-italic.woff2); font-weight:400; font-style:italic;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-500-italic.woff2); font-weight:500; font-style:italic;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-400-normal.woff2); font-weight:400;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-500-normal.woff2); font-weight:500;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-700-normal.woff2); font-weight:700;}
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1350px; overflow:hidden; background:#070B1F;}
  .poster{position:relative; width:1080px; height:1350px; overflow:hidden; background:#070B1F;}
  svg.art{position:absolute; left:0; top:0; width:1080px; height:1350px;}
  .top{position:absolute; top:62px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between;}
  .lock{display:flex; align-items:center; gap:14px;}
  .lock svg{width:50px; height:50px;}
  .lock .rule{width:1px; height:38px; background:linear-gradient(to bottom, rgba(255,190,170,0), rgba(255,190,170,0.8), rgba(255,190,170,0));}
  .abbr{display:block; font-family:'CG'; font-weight:600; font-size:29px; line-height:1; letter-spacing:0.34em; color:#E9D7A0;}
  .full{display:block; margin-top:7px; font-family:'IN'; font-weight:500; font-size:10.5px; letter-spacing:0.38em; text-transform:uppercase; color:rgba(240,226,196,0.78);}
  .chip{font-family:'IN'; font-weight:600; font-size:14px; letter-spacing:0.22em; text-transform:uppercase; color:#F3EBDD; padding:12px 20px 12px 18px; border-radius:100px; border:1px solid rgba(255,180,160,0.45); background:rgba(8,10,32,0.55); display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px);}
  .chip i{width:9px; height:9px; border-radius:50%; background:#FFD3C2; box-shadow:0 0 12px 3px #FF9C86;}
  .copy{position:absolute; left:0; right:0; top:800px; text-align:center; padding:0 70px;}
  .kicker{font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.32em; text-transform:uppercase; color:rgba(255,170,150,0.95);}
  h1{margin-top:18px; font-family:'FR'; font-weight:600; font-size:94px; line-height:0.94; letter-spacing:-0.035em; color:#FBF3E4; text-shadow:0 6px 40px rgba(0,0,0,0.5);}
  h1 em{display:block; font-style:italic; font-weight:400; letter-spacing:-0.025em; background:linear-gradient(180deg,#FFF4EC 0%,#FFD0BC 30%,#FF9A86 62%,#E2648A 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 24px rgba(255,160,140,0.38)); padding:0 14px 10px;}
  .sub{margin:16px auto 0; max-width:830px; font-family:'IN'; font-size:22px; line-height:1.45; color:rgba(240,232,220,0.88);}
  .sub b{color:#FFC4B2; font-weight:600;}
  .cta{position:absolute; left:64px; right:64px; bottom:62px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 26px 22px 30px; border-radius:26px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.13); backdrop-filter:blur(10px);}
  .verse{font-family:'CG'; font-style:italic; font-weight:500; font-size:23px; line-height:1.3; color:rgba(246,236,214,0.92); max-width:540px;}
  .verse span{display:block; margin-top:6px; font-family:'IN'; font-style:normal; font-weight:600; font-size:12.5px; letter-spacing:0.24em; text-transform:uppercase; color:#FFAA96;}
  .btn{flex:none; text-align:right;}
  .btn .l1{display:inline-block; font-family:'IN'; font-weight:700; font-size:19px; color:#14110A; background:linear-gradient(180deg,#FFE6DA,#FF9C86); padding:15px 24px; border-radius:100px; box-shadow:0 10px 30px -8px rgba(255,140,120,0.5);}
  .btn .l2{display:block; margin-top:10px; font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.02em; color:#FBF3E4;}
</style></head>
<body><div class="poster">
<svg class="art" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B1F"/><stop offset="0.35" stop-color="#1C2156"/><stop offset="0.62" stop-color="#6A3F78"/><stop offset="0.85" stop-color="#E07C7A"/><stop offset="1" stop-color="#FFC09A"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF6EC"/><stop offset="0.25" stop-color="#FFD7B8" stop-opacity="0.9"/><stop offset="0.6" stop-color="#FF9A86" stop-opacity="0.32"/><stop offset="1" stop-color="#E2648A" stop-opacity="0"/></radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A6C9E"/><stop offset="0.12" stop-color="#3E4A8C"/><stop offset="0.5" stop-color="#18235C"/><stop offset="1" stop-color="#070B1F"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F3A7A" stop-opacity="0.55"/><stop offset="1" stop-color="#070B1F" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A3A34"/><stop offset="1" stop-color="#1A1018"/></linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7FF"/><stop offset="1" stop-color="#9AB0D8"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B1F" stop-opacity="0"/><stop offset="1" stop-color="#070B1F"/></linearGradient>
    <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b20"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1080" height="830" fill="url(#sky)"/>
  <g id="stars"></g>
  <!-- dawn sun rising over the far Galilee hills -->
  <circle cx="300" cy="455" r="280" fill="url(#sun)" opacity="0.8"/>
  <circle cx="300" cy="462" r="54" fill="#FFF0E2"/>
  <!-- far shore hills -->
  <path d="M0 470 C80 440 150 430 230 452 C300 470 360 440 450 424 C540 410 620 446 700 456 C800 468 880 420 980 430 C1030 434 1060 446 1080 452 L1080 482 L0 482Z" fill="#3A2550" opacity="0.92"/>
  <path d="M0 482 C140 470 300 486 480 476 C700 466 900 480 1080 474 L1080 488 L0 488Z" fill="#2A1B42"/>
  <!-- the lake -->
  <rect y="486" width="1080" height="344" fill="url(#lake)"/>
  <!-- sun glitter path on the water -->
  <g id="glitter"></g>
  <!-- partner boat coming alongside, left -->
  <g transform="translate(150 560) scale(0.55)">
    <path d="M-150 0 L150 0 C130 34 90 50 0 50 C-90 50 -130 34 -150 0Z" fill="url(#hull)"/>
    <path d="M-150 0 L150 0" stroke="#FFC4A8" stroke-width="3" opacity="0.7"/>
    <path d="M10 0 L10 -170" stroke="#1A1018" stroke-width="7"/>
    <path d="M14 -160 C70 -120 84 -60 70 -8 L14 -8Z" fill="#E9C9B8" opacity="0.55"/>
    <g fill="#140C14"><circle cx="-70" cy="-48" r="13"/><path d="M-86 0 L-82 -36 C-80 -46 -60 -46 -58 -36 L-54 0Z"/><path d="M-62 -38 L-34 -84" stroke="#140C14" stroke-width="9" stroke-linecap="round"/></g>
  </g>
  <!-- the deep under Peter's boat: the net bag full of fish -->
  <ellipse cx="695" cy="720" rx="260" ry="110" fill="#1F3A7A" opacity="0.45" filter="url(#b20)"/>
  <g id="net"></g>
  <!-- Peter's boat -->
  <g transform="translate(720 618)">
    <ellipse cx="0" cy="22" rx="250" ry="14" fill="#000" opacity="0.35" filter="url(#b4)"/>
    <path d="M-240 -16 L240 -26 C220 18 160 40 10 40 C-140 40 -210 22 -240 -16Z" fill="url(#hull)"/>
    <path d="M-240 -16 L240 -26" stroke="#FFC4A8" stroke-width="3.5" opacity="0.8"/>
    <path d="M-200 -6 L210 -14" stroke="#2A1820" stroke-width="2" opacity="0.7"/>
    <path d="M40 -20 L40 -300" stroke="#140C14" stroke-width="9"/>
    <path d="M46 -290 C130 -230 150 -120 128 -30 L46 -30Z" fill="#F2D4C2" opacity="0.6"/>
    <path d="M46 -290 L-60 -40" stroke="#140C14" stroke-width="2" opacity="0.7"/>
    <!-- Peter leaning over the side, hauling the net -->
    <g fill="#140C14">
      <path d="M-150 -18 C-150 -60 -140 -96 -118 -112 C-104 -122 -86 -118 -80 -104 C-74 -86 -86 -50 -96 -18Z"/>
      <circle cx="-74" cy="-122" r="16"/>
      <path d="M-104 -96 C-86 -70 -70 -44 -60 -20" stroke="#140C14" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M-120 -92 C-108 -60 -96 -36 -84 -18" stroke="#140C14" stroke-width="11" stroke-linecap="round" fill="none"/>
    </g>
    <path d="M-88 -134 C-80 -142 -66 -142 -60 -132" stroke="#FFB49A" stroke-width="2.5" fill="none"/>
  </g>
  <g id="ripples"></g>
  <g id="spray"></g>
  <rect y="760" width="1080" height="72" fill="url(#fade)"/>
  <rect y="828" width="1080" height="522" fill="#070B1F"/>
</svg>
<div class="top">
  <div class="lock"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A8"/><stop offset="0.5" stop-color="#D4AE5E"/><stop offset="1" stop-color="#A9823F"/></linearGradient></defs>
      <circle cx="24" cy="24" r="22.8" fill="none" stroke="url(#lg)" stroke-width="0.7" opacity="0.5"/>
      <circle cx="24" cy="24" r="20.4" fill="rgba(0,0,0,0.35)" stroke="url(#lg)" stroke-width="1.2"/>
      <path d="M15 31.5 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 31.5" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="url(#lg)"/>
      <path d="M16.5 35.2 L31.5 35.2" stroke="url(#lg)" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/></svg><div class="rule"></div><div><span class="abbr">WFN</span><span class="full">Word &amp; Faith Network</span></div></div>
  <div class="chip"><i></i>Today's Sermon</div>
</div>
<div class="copy">
  <div class="kicker">Luke 5:4-6 &middot; Obedience</div>
  <h1>Toiled all night?<em>Let down the net.</em></h1>
  <p class="sub">Peter caught nothing all night &mdash; then one word from Jesus filled two boats until <b>their net brake</b>.</p>
</div>
<div class="cta">
  <div class="verse">&ldquo;Nevertheless at thy word I will let down the net.&rdquo;<span>Luke 5:5</span></div>
  <div class="btn"><span class="l1">Read the sermon &rarr;</span><span class="l2">wfnglobal.org</span></div>
</div>
</div>
<script>
  let s = 5118; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
  const st = document.getElementById("stars");
  for (let i = 0; i < 80; i++) el("circle", { cx: (r() * 1080).toFixed(1), cy: (r() * 280).toFixed(1), r: (r() * 1.2 + 0.3).toFixed(2), fill: "#F3E8FF", opacity: (0.15 + r() * 0.55).toFixed(2) }, st);
  const gl = document.getElementById("glitter");
  for (let i = 0; i < 70; i++) { const y = 492 + Math.pow(r(), 1.4) * 220, spread = 20 + (y - 490) * 0.9, x = 300 + (r() - 0.5) * spread * 2;
    el("rect", { x: x.toFixed(1), y: y.toFixed(1), width: (8 + r() * 30).toFixed(1), height: (1.2 + r() * 2).toFixed(1), rx: 1, fill: "#FFE2CC", opacity: (0.25 + r() * 0.6).toFixed(2) }, gl); }
  // net bag: from the gunwale (x 560..820, y 612) hanging and bulging down into the deep
  const net = document.getElementById("net");
  const L = 560, R = 830, T0 = 612, bot = 770;
  const outline = `M${L} ${T0} C${L - 40} 680 ${L + 10} ${bot} 690 ${bot} C${R + 10} ${bot} ${R + 50} 690 ${R} ${T0}`;
  el("path", { d: outline + "Z", fill: "#0C1640", opacity: 0.55 }, net);
  // fish inside the net
  for (let i = 0; i < 120; i++) { const t = r(), u = r();
    const y = T0 + 30 + u * (bot - T0 - 40), half = (R - L) / 2 * (0.75 + 0.35 * Math.sin(Math.PI * (y - T0) / (bot - T0))) * (1 - Math.pow((y - T0) / (bot - T0), 6));
    const x = 695 + (t - 0.5) * 2 * half * 0.9, a = (r() - 0.5) * 70, len = 16 + r() * 14;
    const g = el("g", { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})`, opacity: (0.6 + r() * 0.4).toFixed(2) }, net);
    el("ellipse", { cx: 0, cy: 0, rx: len / 2, ry: len / 5.5, fill: "url(#fish)" }, g);
    el("path", { d: `M${len / 2 - 2} 0 L${len / 2 + 7} -5 L${len / 2 + 7} 5Z`, fill: "#B8C8EA" }, g); }
  // mesh
  for (let k = 1; k < 12; k++) { const f = k / 12, x = L + (R - L) * f;
    el("path", { d: `M${x} ${T0} C${x + (f - 0.5) * 120} 690 ${690 + (f - 0.5) * 200} ${bot - 6} 690 ${bot}`, stroke: "#C9D4F2", "stroke-width": 1.1, opacity: 0.35, fill: "none" }, net); }
  for (let k = 1; k < 7; k++) { const y = T0 + (bot - T0) * k / 7, w = (R - L) / 2 * (1.05 + 0.25 * Math.sin(Math.PI * k / 7)) * (1 - Math.pow(k / 7, 4));
    el("path", { d: `M${695 - w} ${y} Q695 ${y + 14} ${695 + w} ${y}`, stroke: "#C9D4F2", "stroke-width": 1.1, opacity: 0.35, fill: "none" }, net); }
  el("path", { d: outline, stroke: "#E4ECFF", "stroke-width": 2.4, opacity: 0.7, fill: "none" }, net);
  // the tear: net breaking at the lower right, fish slipping out
  el("path", { d: "M800 700 C812 708 806 720 818 730 C808 738 798 726 792 716Z", fill: "#0C1640", opacity: 0.85 }, net);
  for (let i = 0; i < 6; i++) { const g = el("g", { transform: `translate(${(822 + i * 14 + r() * 10).toFixed(0)} ${(712 + r() * 40).toFixed(0)}) rotate(${(-30 + r() * 60).toFixed(0)})`, opacity: 0.8 }, net);
    el("ellipse", { cx: 0, cy: 0, rx: 11, ry: 3.6, fill: "url(#fish)" }, g); }
  // ropes up to Peter's hands
  el("path", { d: "M600 614 C620 590 640 600 660 598", stroke: "#E9D0C0", "stroke-width": 2.4, fill: "none", opacity: 0.8 }, net);
  el("path", { d: "M640 614 C650 600 650 600 636 598", stroke: "#E9D0C0", "stroke-width": 2.4, fill: "none", opacity: 0.8 }, net);
  const rp = document.getElementById("ripples");
  for (let i = 0; i < 5; i++) el("ellipse", { cx: 690, cy: 616 + i * 2, rx: 280 + i * 40, ry: 10 + i * 4, fill: "none", stroke: "#FFD3C2", "stroke-width": 1.2, opacity: (0.28 - i * 0.05).toFixed(2) }, rp);
  const sp = document.getElementById("spray");
  for (let i = 0; i < 40; i++) el("circle", { cx: (560 + r() * 280).toFixed(1), cy: (580 + r() * 36).toFixed(1), r: (0.8 + r() * 2).toFixed(1), fill: "#FFF0E6", opacity: (0.3 + r() * 0.5).toFixed(2) }, sp);
</script>
</body></html>
