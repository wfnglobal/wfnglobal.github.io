<!doctype html>
<html><head><meta charset="utf-8">
<!-- WFN sermon poster - Thou Shalt Eat Bread at My Table (2 Samuel 9:7-8), Nov 27, 2026 -->
<style>
  
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-400-italic.woff2); font-weight:400; font-style:italic;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-500-italic.woff2); font-weight:500; font-style:italic;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-400-normal.woff2); font-weight:400;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-500-normal.woff2); font-weight:500;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-700-normal.woff2); font-weight:700;}
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1350px; overflow:hidden; background:#140A14;}
  .poster{position:relative; width:1080px; height:1350px; overflow:hidden; background:#140A14;}
  svg.art{position:absolute; left:0; top:0; width:1080px; height:1350px;}
  .top{position:absolute; top:62px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between;}
  .lock{display:flex; align-items:center; gap:14px;}
  .lock svg{width:50px; height:50px;}
  .lock .rule{width:1px; height:38px; background:linear-gradient(to bottom, rgba(246,206,140,0), rgba(246,206,140,0.85), rgba(246,206,140,0));}
  .abbr{display:block; font-family:'CG'; font-weight:600; font-size:29px; line-height:1; letter-spacing:0.34em; color:#FCEFD8;}
  .full{display:block; margin-top:7px; font-family:'IN'; font-weight:500; font-size:10.5px; letter-spacing:0.38em; text-transform:uppercase; color:rgba(250,230,200,0.8);}
  .chip{font-family:'IN'; font-weight:600; font-size:14px; letter-spacing:0.22em; text-transform:uppercase; color:#FBEFDD; padding:12px 20px 12px 18px; border-radius:100px; border:1px solid rgba(246,200,120,0.5); background:rgba(30,10,26,0.55); display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px);}
  .chip i{width:9px; height:9px; border-radius:50%; background:#FFF3D6; box-shadow:0 0 12px 3px #F6C96E;}
  .copy{position:absolute; left:0; right:0; top:806px; text-align:center; padding:0 70px;}
  .kicker{font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.32em; text-transform:uppercase; color:#F2C46C;}
  h1{margin-top:18px; font-family:'FR'; font-weight:600; font-size:100px; line-height:0.94; letter-spacing:-0.035em; color:#FCF1E0; text-shadow:0 6px 40px rgba(0,0,0,0.5);}
  h1 em{display:block; font-style:italic; font-weight:400; letter-spacing:-0.025em; background:linear-gradient(180deg,#FFFDF4 0%,#FBE3A6 32%,#EDB563 62%,#C98AB8 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 24px rgba(240,190,110,0.38)); padding:0 14px 10px;}
  .sub{margin:16px auto 0; max-width:840px; font-family:'IN'; font-size:22px; line-height:1.45; color:rgba(248,234,214,0.88); text-wrap:balance;}
  .sub b{white-space:nowrap; color:#FBDDA0; font-weight:600;}
  .cta{position:absolute; left:64px; right:64px; bottom:62px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 26px 22px 30px; border-radius:26px; background:rgba(255,236,210,0.07); border:1px solid rgba(255,220,170,0.15); backdrop-filter:blur(10px);}
  .verse{font-family:'CG'; font-style:italic; font-weight:500; font-size:24px; line-height:1.3; color:rgba(250,236,212,0.94); max-width:540px;}
  .verse span{display:block; margin-top:6px; font-family:'IN'; font-style:normal; font-weight:600; font-size:12.5px; letter-spacing:0.24em; text-transform:uppercase; color:#F2C46C;}
  .btn{flex:none; text-align:right;}
  .btn .l1{display:inline-block; font-family:'IN'; font-weight:700; font-size:19px; color:#1A0E06; background:linear-gradient(180deg,#FFF4DC,#EDB75E); padding:15px 24px; border-radius:100px; box-shadow:0 10px 30px -8px rgba(236,184,94,0.55);}
  .btn .l2{display:block; margin-top:10px; font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.02em; color:#FCF1E0;}
</style></head>
<body><div class="poster">
<svg class="art" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C0D1C"/><stop offset="0.55" stop-color="#3E1832"/><stop offset="1" stop-color="#5A2438"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1230"/><stop offset="0.7" stop-color="#26325E"/><stop offset="1" stop-color="#5A4A78"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE3A0" stop-opacity="0.9"/><stop offset="0.4" stop-color="#F6B85E" stop-opacity="0.35"/><stop offset="1" stop-color="#F6B85E" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFBEA"/><stop offset="0.5" stop-color="#F4EBC8" stop-opacity="0.5"/><stop offset="1" stop-color="#F4EBC8" stop-opacity="0"/></radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D2AE"/><stop offset="1" stop-color="#FFF4DE"/></linearGradient>
    <linearGradient id="drape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E0BE"/><stop offset="1" stop-color="#B98E6A"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1020"/><stop offset="1" stop-color="#4A1C30"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A3E22"/><stop offset="0.5" stop-color="#C98A4A"/><stop offset="1" stop-color="#6A3420"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140A14" stop-opacity="0"/><stop offset="1" stop-color="#140A14"/></linearGradient>
    <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1080" height="830" fill="url(#wall)"/>
  <path d="M0 500 L1080 500 L1080 830 L0 830Z" fill="url(#floor)"/>
  <g id="win"></g>
  <g id="hall"></g>
  <g id="chairs"></g>
  <g id="table"></g>
  <g id="lamps"></g>
  <g id="seat"></g>
  <g id="sparks"></g>
  <rect y="756" width="1080" height="76" fill="url(#fade)"/>
  <rect y="828" width="1080" height="522" fill="#140A14"/>
</svg>
<div class="top">
  <div class="lock"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A8"/><stop offset="0.5" stop-color="#D4AE5E"/><stop offset="1" stop-color="#A9823F"/></linearGradient></defs>
      <circle cx="24" cy="24" r="22.8" fill="none" stroke="url(#lg)" stroke-width="0.7" opacity="0.5"/>
      <circle cx="24" cy="24" r="20.4" fill="rgba(0,0,0,0.35)" stroke="url(#lg)" stroke-width="1.2"/>
      <path d="M15 31.5 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 31.5" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="url(#lg)"/>
      <path d="M16.5 35.2 L31.5 35.2" stroke="url(#lg)" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/></svg><div class="rule"></div><div><span class="abbr">WFN</span><span class="full">Word &amp; Faith Network</span></div></div>
  <div class="chip"><i></i>Today's Sermon</div>
</div>
<div class="copy">
  <div class="kicker">2 Samuel 9:7-8 &middot; Grace</div>
  <h1>You were hiding.<em>The King set a place.</em></h1>
  <p class="sub">He called himself a dead dog. David called him by name &mdash; and <b>sat him at the table</b>.</p>
</div>
<div class="cta">
  <div class="verse">&ldquo;Fear not&hellip; thou shalt eat bread at my table continually.&rdquo;<span>2 Samuel 9:7</span></div>
  <div class="btn"><span class="l1">Read the sermon &rarr;</span><span class="l2">wfnglobal.org</span></div>
</div>
</div>
<script>
  let s = 27112; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
  // arched window over the night city
  const w = document.getElementById("win");
  const arch = "M410 500 L410 270 C410 170 670 170 670 270 L670 500Z";
  el("path", { d: arch, fill: "url(#night)" }, w);
  for (let i = 0; i < 40; i++) el("circle", { cx: (420 + r() * 240).toFixed(1), cy: (200 + r() * 170).toFixed(1), r: (0.6 + r() * 1.2).toFixed(1), fill: "#F2F0FF", opacity: (0.3 + r() * 0.6).toFixed(2) }, w);
  el("circle", { cx: 600, cy: 255, r: 60, fill: "url(#moon)" }, w);
  el("circle", { cx: 600, cy: 255, r: 18, fill: "#FFF8DE" }, w);
  // Jerusalem rooftops and towers
  let d = "M410 500 L410 430";
  [[430,410],[452,420],[470,396],[492,404],[505,372],[520,372],[522,404],[548,412],[566,388],[590,392],[604,410],[628,398],[650,418],[670,412]].forEach(([x,y]) => d += ` L${x} ${y}`);
  d += " L670 500Z"; el("path", { d, fill: "#1A1430" }, w);
  el("path", { d: "M505 372 C505 352 520 352 520 372Z", fill: "#1A1430" }, w);
  [[440,440],[476,426],[512,410],[556,436],[598,424],[640,446],[460,462],[620,470],[530,452]].forEach(([x,y]) => el("rect", { x, y, width: 4, height: 6, fill: "#FFD98C", opacity: 0.9 }, w));
  el("path", { d: arch, fill: "none", stroke: "#C99A52", "stroke-width": 10 }, w);
  el("path", { d: "M540 182 L540 500 M410 340 L670 340", stroke: "#C99A52", "stroke-width": 4, opacity: 0.7 }, w);
  // pillars and wall hangings
  const h = document.getElementById("hall");
  [[120,70],[960,70]].forEach(([x,wd]) => {
    el("rect", { x: x - wd/2, y: 170, width: wd, height: 660, fill: "#2A0F22" }, h);
    el("rect", { x: x - wd/2 + 8, y: 170, width: 10, height: 660, fill: "#6A2C46", opacity: 0.6 }, h);
    el("rect", { x: x - wd/2 - 14, y: 156, width: wd + 28, height: 24, fill: "#B88A48" }, h);
  });
  [[270,"#6A1E3A"],[810,"#6A1E3A"]].forEach(([x,c]) => {
    el("path", { d: `M${x-58} 140 L${x+58} 140 L${x+58} 400 L${x} 440 L${x-58} 400Z`, fill: c }, h);
    el("path", { d: `M${x-58} 140 L${x+58} 140 L${x+58} 400 L${x} 440 L${x-58} 400Z`, fill: "none", stroke: "#D2A25A", "stroke-width": 3 }, h);
    el("path", { d: `M${x} 210 l12 26 l-12 22 l-12 -22Z M${x-22} 300 L${x+22} 300`, fill: "#D9AE62", stroke: "#D9AE62", "stroke-width": 3 }, h);
  });
  // the table in perspective
  const P = t => ({ y: 520 + 240 * t, hw: 60 + 330 * t });
  // the king, standing at the far end, arm toward the empty chair
  const k = document.getElementById("chairs");
  el("ellipse", { cx: 540, cy: 470, rx: 70, ry: 90, fill: "url(#glow)", opacity: 0.55 }, k);
  el("path", { d: "M522 520 L526 452 C526 440 554 440 554 452 L558 520Z", fill: "#2A0E20" }, k);
  el("path", { d: "M552 456 C566 462 578 470 590 470", stroke: "#2A0E20", "stroke-width": 8, "stroke-linecap": "round", fill: "none" }, k);
  el("circle", { cx: 540, cy: 438, r: 10, fill: "#2A0E20" }, k);
  el("path", { d: "M530 430 L532 420 L536 426 L540 418 L544 426 L548 420 L550 430Z", fill: "#F2C46C" }, k);
  // guests' chairs along both sides (silhouettes)
  [0.12, 0.3, 0.5, 0.72].forEach(t => {
    const { y, hw } = P(t); const sc = 0.35 + 0.8 * t;
    [-1, 1].forEach(side => {
      if (side === 1 && t > 0.6) return; // leave room for the empty chair
      const x = 540 + side * (hw + 18 * sc);
      el("path", { d: `M${x - 22*sc} ${y + 10*sc} L${x - 22*sc} ${y - 110*sc} C${x - 22*sc} ${y - 140*sc} ${x + 22*sc} ${y - 140*sc} ${x + 22*sc} ${y - 110*sc} L${x + 22*sc} ${y + 10*sc}Z`, fill: "#240B1C" }, k);
      el("path", { d: `M${x - 14*sc} ${y - 104*sc} C${x - 14*sc} ${y - 124*sc} ${x + 14*sc} ${y - 124*sc} ${x + 14*sc} ${y - 104*sc}`, fill: "none", stroke: "#8A5A36", "stroke-width": 2 * sc, opacity: 0.8 }, k);
    });
  });
  const tb = document.getElementById("table");
  const far = P(0), near = P(1);
  el("path", { d: `M${540 - far.hw} ${far.y} L${540 + far.hw} ${far.y} L${540 + near.hw} ${near.y} L${540 - near.hw} ${near.y}Z`, fill: "url(#cloth)" }, tb);
  el("path", { d: `M${540 - near.hw} ${near.y} L${540 + near.hw} ${near.y} L${540 + near.hw + 10} 830 L${540 - near.hw - 10} 830Z`, fill: "url(#drape)" }, tb);
  for (let x = 540 - near.hw + 40; x < 540 + near.hw; x += 64) el("path", { d: `M${x} ${near.y + 4} C${x + 6} 790 ${x - 4} 810 ${x + 2} 830`, stroke: "#9A6E52", "stroke-width": 2, opacity: 0.35, fill: "none" }, tb);
  el("path", { d: `M${540 - near.hw} ${near.y} L${540 + near.hw} ${near.y}`, stroke: "#D2A25A", "stroke-width": 4 }, tb);
  // gold runner down the middle
  el("path", { d: `M${528} ${far.y} L${552} ${far.y} L${600} ${near.y} L${480} ${near.y}Z`, fill: "#C99A52", opacity: 0.55 }, tb);
  // bread, cups and candles along the table
  [0.08, 0.22, 0.38, 0.56, 0.76, 0.94].forEach((t, i) => {
    const { y, hw } = P(t); const sc = 0.4 + 0.9 * t;
    [-1, 1].forEach(side => {
      const x = 540 + side * hw * 0.62;
      el("ellipse", { cx: x, cy: y, rx: 20 * sc, ry: 6 * sc, fill: "#E8D8C0", stroke: "#B89A70", "stroke-width": 1 }, tb);
      el("ellipse", { cx: x, cy: y - 5 * sc, rx: 14 * sc, ry: 8 * sc, fill: "#C9853E" }, tb);
      el("path", { d: `M${x - 8*sc} ${y - 8*sc} l5 -3 M${x} ${y - 10*sc} l5 -3`, stroke: "#F2C98A", "stroke-width": 1.5 * sc }, tb);
      const cx = x + side * -26 * sc;
      el("path", { d: `M${cx - 6*sc} ${y - 26*sc} L${cx + 6*sc} ${y - 26*sc} L${cx + 2*sc} ${y - 12*sc} L${cx + 2*sc} ${y - 2*sc} L${cx + 6*sc} ${y} L${cx - 6*sc} ${y} L${cx - 2*sc} ${y - 2*sc} L${cx - 2*sc} ${y - 12*sc}Z`, fill: "#D9AE62" }, tb);
      el("rect", { x: cx - 5*sc, y: y - 25*sc, width: 10*sc, height: 5*sc, fill: "#7A1E34" }, tb);
    });
    if (i % 2 === 0) { const sc2 = sc * 1.1;
      el("circle", { cx: 540, cy: y - 60 * sc2, r: 46 * sc2, fill: "url(#glow)" }, tb);
      el("rect", { x: 540 - 5*sc2, y: y - 44*sc2, width: 10*sc2, height: 44*sc2, fill: "#FFF1D6" }, tb);
      el("path", { d: `M540 ${y - 62*sc2} C${540 + 6*sc2} ${y - 52*sc2} ${540 + 4*sc2} ${y - 46*sc2} 540 ${y - 44*sc2} C${540 - 4*sc2} ${y - 46*sc2} ${540 - 6*sc2} ${y - 52*sc2} 540 ${y - 62*sc2}Z`, fill: "#FFE08A" }, tb);
      el("rect", { x: 540 - 12*sc2, y: y - 4*sc2, width: 24*sc2, height: 5*sc2, fill: "#C99A52" }, tb);
    }
  });
  // hanging oil lamps
  const lp = document.getElementById("lamps");
  [[366,236],[714,236],[200,330],[880,330]].forEach(([x,y]) => {
    el("line", { x1: x, y1: (x < 300 || x > 800) ? 140 : 0, x2: x, y2: y - 20, stroke: "#8A6236", "stroke-width": 2 }, lp);
    el("circle", { cx: x, cy: y, r: 70, fill: "url(#glow)", opacity: 0.8 }, lp);
    el("path", { d: `M${x - 24} ${y - 8} L${x + 24} ${y - 8} L${x + 14} ${y + 10} L${x - 14} ${y + 10}Z`, fill: "#C99A52" }, lp);
    el("path", { d: `M${x} ${y - 32} C${x + 8} ${y - 20} ${x + 6} ${y - 12} ${x} ${y - 10} C${x - 6} ${y - 12} ${x - 8} ${y - 20} ${x} ${y - 32}Z`, fill: "#FFE6A0" }, lp);
  });
  // the empty chair, pulled out and waiting, crutches leaning on it
  const st = document.getElementById("seat");
  el("ellipse", { cx: 900, cy: 690, rx: 170, ry: 200, fill: "url(#glow)", opacity: 0.55 }, st);
  el("ellipse", { cx: 905, cy: 826, rx: 110, ry: 10, fill: "#0A0408", opacity: 0.6, filter: "url(#b3)" }, st);
  // back legs
  el("rect", { x: 846, y: 700, width: 12, height: 126, fill: "#5A2A18" }, st);
  el("rect", { x: 958, y: 700, width: 12, height: 126, fill: "#5A2A18" }, st);
  // high carved back
  el("path", { d: "M838 740 L838 560 C838 500 978 500 978 560 L978 740Z", fill: "url(#wood)" }, st);
  el("path", { d: "M856 724 L856 570 C856 526 960 526 960 570 L960 724Z", fill: "#7A1E34" }, st);
  el("path", { d: "M856 724 L856 570 C856 526 960 526 960 570 L960 724Z", fill: "none", stroke: "#E2B462", "stroke-width": 3 }, st);
  el("path", { d: "M908 512 L914 498 L920 512Z M908 512 L896 506 L902 518Z M920 512 L932 506 L926 518Z", fill: "#F2C46C" }, st);
  el("path", { d: "M908 600 l14 26 l-14 24 l-14 -24Z", fill: "#E2B462", opacity: 0.85 }, st);
  // seat and front legs
  el("path", { d: "M816 740 L996 740 L1010 770 L802 770Z", fill: "#A8642E" }, st);
  el("path", { d: "M816 740 L996 740", stroke: "#F2C98A", "stroke-width": 2, opacity: 0.7 }, st);
  el("rect", { x: 806, y: 768, width: 14, height: 60, fill: "#6A3420" }, st);
  el("rect", { x: 990, y: 768, width: 14, height: 60, fill: "#6A3420" }, st);
  // a folded napkin and bread set before it
  el("path", { d: "M780 758 L800 748 L812 762 L792 770Z", fill: "#FFF4DE" }, st);
  // crutches leaning against the chair back
  [[1046, 828, 968, 552], [1062, 828, 996, 560]].forEach(([x1,y1,x2,y2]) => {
    el("line", { x1, y1, x2, y2, stroke: "#B9824A", "stroke-width": 7, "stroke-linecap": "round" }, st);
    el("line", { x1: x1 - 6, y1, x2: x2 - 6, y2: y2 + 4, stroke: "#8A5A30", "stroke-width": 3, opacity: 0.6 }, st);
    el("path", { d: `M${x2 - 18} ${y2 - 2} C${x2 - 8} ${y2 - 12} ${x2 + 10} ${y2 - 12} ${x2 + 20} ${y2 - 4}`, stroke: "#6A3A20", "stroke-width": 10, "stroke-linecap": "round", fill: "none" }, st);
    const mx = x1 + (x2 - x1) * 0.42, my = y1 + (y2 - y1) * 0.42;
    el("line", { x1: mx - 12, y1: my, x2: mx + 12, y2: my + 2, stroke: "#6A3A20", "stroke-width": 6, "stroke-linecap": "round" }, st);
  });
  // floating candle-sparks
  const sp = document.getElementById("sparks");
  for (let i = 0; i < 55; i++) { const x = 140 + r() * 800, y = 180 + r() * 560;
    el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (0.6 + r() * 1.7).toFixed(1), fill: r() > 0.5 ? "#FFE8B0" : "#F2C46C", opacity: (0.2 + r() * 0.5).toFixed(2) }, sp); }
</script>
</body></html>
