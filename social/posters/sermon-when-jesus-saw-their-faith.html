<!doctype html>
<html><head><meta charset="utf-8">
<!-- WFN sermon poster - When Jesus Saw Their Faith (Mark 2:3-5), Nov 28, 2026 -->
<style>
  
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-400-italic.woff2); font-weight:400; font-style:italic;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-500-italic.woff2); font-weight:500; font-style:italic;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-400-normal.woff2); font-weight:400;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-500-normal.woff2); font-weight:500;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-700-normal.woff2); font-weight:700;}
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1350px; overflow:hidden; background:#0D191B;}
  .poster{position:relative; width:1080px; height:1350px; overflow:hidden; background:#0D191B;}
  svg.art{position:absolute; left:0; top:0; width:1080px; height:1350px;}
  .top{position:absolute; top:62px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between;}
  .lock{display:flex; align-items:center; gap:14px;}
  .lock svg{width:50px; height:50px;}
  .lock .rule{width:1px; height:38px; background:linear-gradient(to bottom, rgba(246,206,140,0), rgba(246,206,140,0.85), rgba(246,206,140,0));}
  .abbr{display:block; font-family:'CG'; font-weight:600; font-size:29px; line-height:1; letter-spacing:0.34em; color:#FCEFD8;}
  .full{display:block; margin-top:7px; font-family:'IN'; font-weight:500; font-size:10.5px; letter-spacing:0.38em; text-transform:uppercase; color:rgba(250,230,200,0.8);}
  .chip{font-family:'IN'; font-weight:600; font-size:14px; letter-spacing:0.22em; text-transform:uppercase; color:#FBEFDD; padding:12px 20px 12px 18px; border-radius:100px; border:1px solid rgba(246,200,120,0.5); background:rgba(8,26,28,0.6); display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px);}
  .chip i{width:9px; height:9px; border-radius:50%; background:#FFF3D6; box-shadow:0 0 12px 3px #F6C96E;}
  .copy{position:absolute; left:0; right:0; top:806px; text-align:center; padding:0 70px;}
  .kicker{font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.32em; text-transform:uppercase; color:#F4B877;}
  h1{margin-top:18px; font-family:'FR'; font-weight:600; font-size:100px; line-height:0.94; letter-spacing:-0.035em; color:#FCF1E0; text-shadow:0 6px 40px rgba(0,0,0,0.5);}
  h1 em{display:block; font-style:italic; font-weight:400; letter-spacing:-0.025em; background:linear-gradient(180deg,#FFF9EE 0%,#FFD9A4 30%,#F29A5E 62%,#6FC9BC 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 24px rgba(242,154,94,0.35)); padding:0 14px 10px;}
  .sub{margin:16px auto 0; max-width:840px; font-family:'IN'; font-size:22px; line-height:1.45; color:rgba(248,234,214,0.88); text-wrap:balance;}
  .sub b{white-space:nowrap; color:#FFD3A0; font-weight:600;}
  .cta{position:absolute; left:64px; right:64px; bottom:62px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 26px 22px 30px; border-radius:26px; background:rgba(200,240,232,0.06); border:1px solid rgba(160,225,214,0.18); backdrop-filter:blur(10px);}
  .verse{font-family:'CG'; font-style:italic; font-weight:500; font-size:24px; line-height:1.3; color:rgba(250,236,212,0.94); max-width:600px;}
  .verse span{display:block; margin-top:6px; font-family:'IN'; font-style:normal; font-weight:600; font-size:12.5px; letter-spacing:0.24em; text-transform:uppercase; color:#F4B877;}
  .btn{flex:none; text-align:right;}
  .btn .l1{display:inline-block; font-family:'IN'; font-weight:700; font-size:19px; color:#1A0E06; background:linear-gradient(180deg,#FFF1DE,#F2A465); padding:15px 24px; border-radius:100px; box-shadow:0 10px 30px -8px rgba(236,184,94,0.55);}
  .btn .l2{display:block; margin-top:10px; font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.02em; color:#FCF1E0;}
</style></head>
<body><div class="poster">
<svg class="art" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123A44"/><stop offset="0.45" stop-color="#3E7A7A"/><stop offset="0.78" stop-color="#E8955A"/><stop offset="1" stop-color="#FAD08E"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF6DC"/><stop offset="0.35" stop-color="#FFD58C" stop-opacity="0.75"/><stop offset="1" stop-color="#F29A5E" stop-opacity="0"/></radialGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1812"/><stop offset="1" stop-color="#3A2218"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE2A8" stop-opacity="0.75"/><stop offset="0.6" stop-color="#FFC27A" stop-opacity="0.28"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0.05"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE7B8" stop-opacity="0.85"/><stop offset="0.45" stop-color="#F6B070" stop-opacity="0.3"/><stop offset="1" stop-color="#F6B070" stop-opacity="0"/></radialGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98A58"/><stop offset="1" stop-color="#6E4026"/></linearGradient>
    <linearGradient id="wallg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9784A"/><stop offset="1" stop-color="#7E4A2C"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4E2"/><stop offset="1" stop-color="#D9C3A2"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D191B" stop-opacity="0"/><stop offset="1" stop-color="#0D191B"/></linearGradient>
    <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1080" height="830" fill="url(#sky)"/>
  <circle cx="900" cy="250" r="150" fill="url(#sun)"/>
  <circle cx="900" cy="250" r="34" fill="#FFF3D4"/>
  <g id="town"></g>
  <g id="house"></g>
  <g id="crowd"></g>
  <g id="mat"></g>
  <g id="lord"></g>
  <g id="roofmen"></g>
  <g id="dust"></g>
  <rect y="756" width="1080" height="76" fill="url(#fade)"/>
  <rect y="828" width="1080" height="522" fill="#0D191B"/>
</svg>
<div class="top">
  <div class="lock"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A8"/><stop offset="0.5" stop-color="#D4AE5E"/><stop offset="1" stop-color="#A9823F"/></linearGradient></defs>
      <circle cx="24" cy="24" r="22.8" fill="none" stroke="url(#lg)" stroke-width="0.7" opacity="0.5"/>
      <circle cx="24" cy="24" r="20.4" fill="rgba(0,0,0,0.35)" stroke="url(#lg)" stroke-width="1.2"/>
      <path d="M15 31.5 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 31.5" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="url(#lg)"/>
      <path d="M16.5 35.2 L31.5 35.2" stroke="url(#lg)" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/></svg><div class="rule"></div><div><span class="abbr">WFN</span><span class="full">Word &amp; Faith Network</span></div></div>
  <div class="chip"><i></i>Today's Sermon</div>
</div>
<div class="copy">
  <div class="kicker">Mark 2:3-5 &middot; Intercession</div>
  <h1>No room inside?<em>Go through the roof.</em></h1>
  <p class="sub">Four friends broke open a roof &mdash; and Jesus moved on <b>what He saw in them</b>.</p>
</div>
<div class="cta">
  <div class="verse">&ldquo;When Jesus saw their faith, he said&hellip; Son, thy sins be forgiven thee.&rdquo;<span>Mark 2:5</span></div>
  <div class="btn"><span class="l1">Read the sermon &rarr;</span><span class="l2">wfnglobal.org</span></div>
</div>
</div>
<script>
  let s = 28112; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
  const DARK = "#14100F";
  // distant Capernaum rooftops, palms and the lake glint
  const tw = document.getElementById("town");
  el("rect", { x: 0, y: 268, width: 1080, height: 40, fill: "#F7C37E", opacity: 0.5 }, tw);
  let d = "M0 300 L0 262"; let x = 0;
  while (x < 1080) { const w = 40 + r() * 60, h = 236 + r() * 30; d += ` L${x} ${h.toFixed(0)} L${(x + w).toFixed(0)} ${h.toFixed(0)}`; x += w; }
  d += " L1080 300Z"; el("path", { d, fill: "#7A4A3A", opacity: 0.55 }, tw);
  [[60,250],[1010,244],[88,262]].forEach(([px,py]) => {
    el("path", { d: `M${px} 300 C${px+4} ${py+20} ${px+2} ${py-10} ${px+6} ${py-60}`, stroke: "#3A2A2A", "stroke-width": 6, fill: "none" }, tw);
    for (let i = 0; i < 6; i++) { const a = -2.6 + i * 0.5; el("path", { d: `M${px+6} ${py-60} q${(Math.cos(a)*30).toFixed(0)} ${(Math.sin(a)*30-6).toFixed(0)} ${(Math.cos(a)*58).toFixed(0)} ${(Math.sin(a)*40+14).toFixed(0)}`, stroke: "#3A2A2A", "stroke-width": 5, fill: "none", "stroke-linecap": "round" }, tw); }
  });
  // the house, in cutaway
  const hs = document.getElementById("house");
  el("rect", { x: 120, y: 330, width: 840, height: 500, fill: "url(#room)" }, hs);
  // walls
  el("rect", { x: 104, y: 300, width: 34, height: 530, fill: "url(#wallg)" }, hs);
  el("rect", { x: 942, y: 300, width: 34, height: 530, fill: "url(#wallg)" }, hs);
  // doorway in the left wall, jammed
  el("rect", { x: 104, y: 600, width: 34, height: 230, fill: "#1A100C" }, hs);
  el("rect", { x: 98, y: 590, width: 46, height: 12, fill: "#6E4026" }, hs);
  // wall niche with a lamp
  el("path", { d: "M800 470 L800 430 C800 410 840 410 840 430 L840 470Z", fill: "#1E120C" }, hs);
  el("circle", { cx: 820, cy: 455, r: 40, fill: "url(#glow)", opacity: 0.6 }, hs);
  el("path", { d: "M810 462 L830 462 L826 468 L814 468Z", fill: "#C98A58" }, hs);
  el("path", { d: "M820 446 C824 452 823 458 820 460 C817 458 816 452 820 446Z", fill: "#FFE3A0" }, hs);
  // shelves and jars on the back wall
  el("rect", { x: 200, y: 450, width: 150, height: 6, fill: "#5A3420" }, hs);
  [[214,26],[246,34],[284,22],[318,30]].forEach(([jx,jh]) => el("path", { d: `M${jx} 450 C${jx-6} ${450-jh*0.4} ${jx-4} ${450-jh} ${jx+8} ${450-jh} C${jx+20} ${450-jh} ${jx+22} ${450-jh*0.4} ${jx+16} 450Z`, fill: "#6A3E26" }, hs));
  // light shaft through the broken roof
  el("path", { d: "M472 330 L610 330 L760 830 L330 830Z", fill: "url(#shaft)" }, hs);
  // roof slab with a broken hole
  el("path", { d: "M92 300 L472 300 L478 312 L468 322 L474 332 L92 332Z", fill: "url(#slab)" }, hs);
  el("path", { d: "M612 300 L988 300 L988 332 L606 332 L614 320 L604 312Z", fill: "url(#slab)" }, hs);
  for (let bx = 120; bx < 960; bx += 46) if (bx < 460 || bx > 620) el("rect", { x: bx, y: 330, width: 16, height: 10, fill: "#5A341E" }, hs);
  el("path", { d: "M92 300 L472 300 M612 300 L988 300", stroke: "#F2C08A", "stroke-width": 2.5, opacity: 0.8 }, hs);
  // broken edges: reed and plaster chunks
  [[466,318],[476,306],[608,316],[600,306],[470,326]].forEach(([cx,cy]) => el("path", { d: `M${cx-7} ${cy} l6 -6 l8 4 l-3 7Z`, fill: "#A86E44" }, hs));
  // ground outside
  el("rect", { x: 0, y: 800, width: 104, height: 30, fill: "#3A2418" }, hs);
  el("rect", { x: 976, y: 800, width: 104, height: 30, fill: "#3A2418" }, hs);
  // the crowd: pressed at the door outside, packed inside
  const cr = document.getElementById("crowd");
  function person(px, py, sc, col) {
    el("circle", { cx: px, cy: py - 64 * sc, r: 15 * sc, fill: col }, cr);
    el("path", { d: `M${px - 26*sc} ${py} C${px - 28*sc} ${py - 40*sc} ${px - 18*sc} ${py - 50*sc} ${px} ${py - 50*sc} C${px + 18*sc} ${py - 50*sc} ${px + 28*sc} ${py - 40*sc} ${px + 26*sc} ${py}Z`, fill: col }, cr);
  }
  [[22,820,1.25],[58,812,1.15],[88,826,1.2]].forEach(([px,py,sc]) => person(px, py, sc, "#2A1C1A"));
  [[128,830,1.2]].forEach(([px,py,sc]) => person(px, py, sc, "#1C1210"));
  [[176,800,1.0],[226,808,1.05],[274,798,1.0],[318,812,1.08],[790,806,1.05],[838,798,1.0],[884,810,1.06],[924,800,1.0]].forEach(([px,py,sc]) => person(px, py, sc, "#241612"));
  [[160,836,1.35],[214,840,1.4],[268,834,1.3],[808,840,1.38],[862,836,1.3],[918,842,1.4]].forEach(([px,py,sc]) => person(px, py, sc, DARK));
  // the mat being lowered on four ropes
  const mt = document.getElementById("mat");
  el("ellipse", { cx: 545, cy: 560, rx: 140, ry: 40, fill: "url(#glow)", opacity: 0.5 }, mt);
  const ropes = [[476,296,462,536],[490,296,468,548],[600,296,628,530],[586,296,622,544]];
  ropes.forEach(([x1,y1,x2,y2]) => el("line", { x1, y1, x2, y2, stroke: "#E8C898", "stroke-width": 2.6 }, mt));
  el("path", { d: "M458 536 L632 528 L636 546 L462 556Z", fill: "#C9A27A" }, mt);
  el("path", { d: "M458 536 L632 528", stroke: "#F7DDB4", "stroke-width": 2 }, mt);
  for (let i = 0; i < 8; i++) el("line", { x1: 470 + i * 21, y1: 536 - i, x2: 473 + i * 21, y2: 555 - i, stroke: "#8E6A48", "stroke-width": 1.4, opacity: 0.7 }, mt);
  // the man lying on it
  el("circle", { cx: 486, cy: 520, r: 12, fill: "#5A3A2A" }, mt);
  el("path", { d: "M498 530 C520 516 580 512 618 520 L620 532 L498 538Z", fill: "#E9DCC6" }, mt);
  el("path", { d: "M500 532 C540 524 590 522 618 526", stroke: "#B99E80", "stroke-width": 1.5, fill: "none" }, mt);
  // Jesus, below, lit by the shaft, hand lifted toward him
  const lr = document.getElementById("lord");
  el("ellipse", { cx: 600, cy: 700, rx: 120, ry: 150, fill: "url(#glow)", opacity: 0.7 }, lr);
  el("path", { d: "M570 830 L578 690 C580 668 620 668 622 690 L632 830Z", fill: "url(#robe)" }, lr);
  el("path", { d: "M596 676 L590 830", stroke: "#B48A5A", "stroke-width": 7, opacity: 0.55 }, lr);
  el("path", { d: "M618 690 C630 668 636 640 640 612", stroke: "#F7EAD6", "stroke-width": 15, "stroke-linecap": "round", fill: "none" }, lr);
  el("circle", { cx: 641, cy: 606, r: 7, fill: "#B07A52" }, lr);
  el("path", { d: "M580 692 C572 712 572 730 578 742", stroke: "#EADBC4", "stroke-width": 13, "stroke-linecap": "round", fill: "none" }, lr);
  el("circle", { cx: 600, cy: 652, r: 17, fill: "#6A4430" }, lr);
  el("path", { d: "M583 650 C584 628 616 628 618 650 C616 660 618 672 612 680 L588 680 C582 672 584 660 583 650Z", fill: "#3A241A" }, lr);
  el("path", { d: "M592 648 C596 640 610 640 614 650", stroke: "#FFE9C4", "stroke-width": 2, fill: "none", opacity: 0.6 }, lr);
  // four friends kneeling on the roof, leaning over the hole
  const rm = document.getElementById("roofmen");
  function kneel(hx, dir, sc, handX) {
    const R = 298, X = v => hx + dir * v * sc, Y = v => R - v * sc;
    const hip = [X(-6), Y(40)], knee = [X(18), Y(2)], foot = [X(-34), Y(3)], sh = [X(16), Y(86)], hd = [X(34), Y(104)];
    el("path", { d: `M${foot[0]} ${foot[1]} L${knee[0]} ${knee[1]}`, stroke: DARK, "stroke-width": 13*sc, "stroke-linecap": "round" }, rm);
    el("path", { d: `M${hip[0]} ${hip[1]} L${knee[0]} ${knee[1]}`, stroke: DARK, "stroke-width": 20*sc, "stroke-linecap": "round" }, rm);
    el("path", { d: `M${hip[0]} ${hip[1]} C${X(-8)} ${Y(62)} ${X(2)} ${Y(80)} ${sh[0]} ${sh[1]}`, stroke: DARK, "stroke-width": 30*sc, "stroke-linecap": "round", fill: "none" }, rm);
    el("path", { d: `M${X(-14)} ${Y(30)} L${X(-24)} ${Y(4)} L${X(24)} ${Y(4)}Z`, fill: DARK }, rm);
    el("circle", { cx: hd[0], cy: hd[1], r: 14*sc, fill: DARK }, rm);
    el("path", { d: `M${sh[0]} ${sh[1]} C${X(40)} ${Y(70)} ${handX - dir*14} ${R - 30} ${handX} ${R - 4}`, stroke: DARK, "stroke-width": 9*sc, "stroke-linecap": "round", fill: "none" }, rm);
    el("path", { d: `M${X(10)} ${Y(80)} C${X(34)} ${Y(56)} ${handX - dir*26} ${R - 20} ${handX - dir*8} ${R - 2}`, stroke: DARK, "stroke-width": 9*sc, "stroke-linecap": "round", fill: "none" }, rm);
  }
  kneel(372, 1, 0.95, 474); kneel(424, 1, 1.05, 488);
  kneel(708, -1, 0.95, 602); kneel(656, -1, 1.05, 588);
  // a coil of spare rope and a cloak tossed on the roof
  el("ellipse", { cx: 300, cy: 296, rx: 18, ry: 6, fill: "none", stroke: DARK, "stroke-width": 4 }, rm);
  el("path", { d: "M770 300 C780 286 810 284 824 300Z", fill: DARK }, rm);
  // falling plaster and dust in the light
  const ds = document.getElementById("dust");
  for (let i = 0; i < 70; i++) { const t = r(), y = 335 + t * 420, spread = 70 + t * 150, x = 541 + (r() - 0.5) * 2 * spread;
    el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (0.7 + r() * 2).toFixed(1), fill: r() > 0.4 ? "#FFE6B8" : "#C98A58", opacity: (0.25 + r() * 0.55).toFixed(2) }, ds); }
  for (let i = 0; i < 9; i++) { const x = 500 + r() * 90, y = 350 + r() * 140;
    el("path", { d: `M${x.toFixed(0)} ${y.toFixed(0)} l5 -3 l4 4 l-5 3Z`, fill: "#B07A4E", opacity: 0.85 }, ds); }
</script>
</body></html>
