<!doctype html>
<html><head><meta charset="utf-8">
<!-- WFN sermon poster - Wilt Thou Be Made Whole? (John 5:6-8), Nov 24, 2026 -->
<style>
  
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-400-italic.woff2); font-weight:400; font-style:italic;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-500-italic.woff2); font-weight:500; font-style:italic;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-400-normal.woff2); font-weight:400;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-500-normal.woff2); font-weight:500;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-700-normal.woff2); font-weight:700;}
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1350px; overflow:hidden; background:#140B08;}
  .poster{position:relative; width:1080px; height:1350px; overflow:hidden; background:#140B08;}
  svg.art{position:absolute; left:0; top:0; width:1080px; height:1350px;}
  .top{position:absolute; top:62px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between;}
  .lock{display:flex; align-items:center; gap:14px;}
  .lock svg{width:50px; height:50px;}
  .lock .rule{width:1px; height:38px; background:linear-gradient(to bottom, rgba(245,200,130,0), rgba(245,200,130,0.85), rgba(245,200,130,0));}
  .abbr{display:block; font-family:'CG'; font-weight:600; font-size:29px; line-height:1; letter-spacing:0.34em; color:#FBEBD2;}
  .full{display:block; margin-top:7px; font-family:'IN'; font-weight:500; font-size:10.5px; letter-spacing:0.38em; text-transform:uppercase; color:rgba(250,228,196,0.8);}
  .chip{font-family:'IN'; font-weight:600; font-size:14px; letter-spacing:0.22em; text-transform:uppercase; color:#FBEFDD; padding:12px 20px 12px 18px; border-radius:100px; border:1px solid rgba(250,200,120,0.5); background:rgba(30,14,8,0.55); display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px);}
  .chip i{width:9px; height:9px; border-radius:50%; background:#FFF3D6; box-shadow:0 0 12px 3px #F2B45A;}
  .copy{position:absolute; left:0; right:0; top:806px; text-align:center; padding:0 70px;}
  .kicker{font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.32em; text-transform:uppercase; color:#7FD6B8;}
  h1{margin-top:18px; font-family:'FR'; font-weight:600; font-size:100px; line-height:0.94; letter-spacing:-0.035em; color:#FCF1E0; text-shadow:0 6px 40px rgba(0,0,0,0.5);}
  h1 em{display:block; font-style:italic; font-weight:400; letter-spacing:-0.025em; background:linear-gradient(180deg,#FFF8E8 0%,#FFD89A 34%,#F0A35A 66%,#86DDBE 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 24px rgba(245,170,80,0.35)); padding:0 14px 10px;}
  .sub{margin:16px auto 0; max-width:840px; font-family:'IN'; font-size:22px; line-height:1.45; color:rgba(248,234,214,0.88); text-wrap:balance;}
  .sub b{color:#FFC97E; font-weight:600;}
  .cta{position:absolute; left:64px; right:64px; bottom:62px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 26px 22px 30px; border-radius:26px; background:rgba(255,236,210,0.07); border:1px solid rgba(255,220,170,0.15); backdrop-filter:blur(10px);}
  .verse{font-family:'CG'; font-style:italic; font-weight:500; font-size:24px; line-height:1.3; color:rgba(250,236,212,0.94); max-width:540px;}
  .verse span{display:block; margin-top:6px; font-family:'IN'; font-style:normal; font-weight:600; font-size:12.5px; letter-spacing:0.24em; text-transform:uppercase; color:#7FD6B8;}
  .btn{flex:none; text-align:right;}
  .btn .l1{display:inline-block; font-family:'IN'; font-weight:700; font-size:19px; color:#1A0E06; background:linear-gradient(180deg,#FFF1D2,#F2A957); padding:15px 24px; border-radius:100px; box-shadow:0 10px 30px -8px rgba(240,160,80,0.55);}
  .btn .l2{display:block; margin-top:10px; font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.02em; color:#FCF1E0;}
</style></head>
<body><div class="poster">
<svg class="art" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A120C"/><stop offset="0.35" stop-color="#7A3518"/><stop offset="0.62" stop-color="#E08A3C"/><stop offset="0.8" stop-color="#FFD48A"/><stop offset="1" stop-color="#FFE7B8"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A2E1C"/><stop offset="1" stop-color="#2A140C"/></linearGradient>
    <linearGradient id="stoneLit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A1C10"/><stop offset="0.55" stop-color="#6E3A22"/><stop offset="1" stop-color="#B9733E"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A4C28"/><stop offset="1" stop-color="#3A1D10"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FC2A4"/><stop offset="0.45" stop-color="#1E7466"/><stop offset="1" stop-color="#0B302C"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3A8" stop-opacity="0.55"/><stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140B08" stop-opacity="0"/><stop offset="1" stop-color="#140B08"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF8E2"/><stop offset="0.25" stop-color="#FFE2A0" stop-opacity="0.9"/><stop offset="1" stop-color="#FFB060" stop-opacity="0"/></radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFD58E" stop-opacity="0.55"/><stop offset="1" stop-color="#FFD58E" stop-opacity="0"/></radialGradient>
    <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1080" height="830" fill="url(#sky)"/>
  <circle cx="740" cy="470" r="230" fill="url(#sun)"/>
  <!-- distant hills / city -->
  <path d="M0 520 C140 490 260 505 360 488 C470 470 560 500 680 482 C800 466 930 490 1080 476 L1080 560 L0 560Z" fill="#B35E2A" opacity="0.55"/>
  <!-- colonnade: back wall with arches -->
  <g id="colon"></g>
  <g id="shafts"></g>
  <!-- stone floor and pool -->
  <path d="M0 600 L1080 600 L1080 830 L0 830Z" fill="url(#floor)"/>
  <g id="steps"></g>
  <path d="M120 680 L960 680 L1040 830 L40 830Z" fill="url(#pool)"/>
  <g id="ripples"></g>
  <!-- empty worn spot where the mat lay -->
  <g id="spot"></g>
  <!-- the man, walking away carrying his bed -->
  <g id="motes"></g>
  <g id="man"></g>
  <rect y="756" width="1080" height="76" fill="url(#fade)"/>
  <rect y="828" width="1080" height="522" fill="#140B08"/>
</svg>
<div class="top">
  <div class="lock"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A8"/><stop offset="0.5" stop-color="#D4AE5E"/><stop offset="1" stop-color="#A9823F"/></linearGradient></defs>
      <circle cx="24" cy="24" r="22.8" fill="none" stroke="url(#lg)" stroke-width="0.7" opacity="0.5"/>
      <circle cx="24" cy="24" r="20.4" fill="rgba(0,0,0,0.35)" stroke="url(#lg)" stroke-width="1.2"/>
      <path d="M15 31.5 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 31.5" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="url(#lg)"/>
      <path d="M16.5 35.2 L31.5 35.2" stroke="url(#lg)" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/></svg><div class="rule"></div><div><span class="abbr">WFN</span><span class="full">Word &amp; Faith Network</span></div></div>
  <div class="chip"><i></i>Today's Sermon</div>
</div>
<div class="copy">
  <div class="kicker">John 5:6-8 &middot; Healing</div>
  <h1>Thirty-eight years.<em>One word.</em></h1>
  <p class="sub">He had no man to put him in the pool &mdash; so Jesus <b>skipped the water</b> and spoke straight to the man.</p>
</div>
<div class="cta">
  <div class="verse">&ldquo;Jesus saith unto him, Rise, take up thy bed, and walk.&rdquo;<span>John 5:8</span></div>
  <div class="btn"><span class="l1">Read the sermon &rarr;</span><span class="l2">wfnglobal.org</span></div>
</div>
</div>
<script>
  let s = 52411; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
  // the five porches: a stone colonnade with arched openings onto the sunrise
  const co = document.getElementById("colon");
  const P = 52, W = (1080 - 6 * P) / 5, R = W / 2, aTop = 330;
  let d = "M0 190 L1080 190 L1080 604 L0 604Z";
  const xs = [];
  for (let i = 0; i < 5; i++) { const x0 = P + i * (W + P); xs.push(x0); d += ` M${x0} 604 L${x0} ${aTop} A${R} ${R} 0 0 1 ${x0 + W} ${aTop} L${x0 + W} 604Z`; }
  el("path", { d, fill: "url(#stone)", "fill-rule": "evenodd" }, co);
  el("rect", { x: 0, y: 190, width: 1080, height: 30, fill: "#7A4126" }, co);
  el("rect", { x: 0, y: 218, width: 1080, height: 6, fill: "#2A140C", opacity: 0.6 }, co);
  for (let i = 0; i < 5; i++) {
    const x0 = xs[i];
    // warm rim light on the inner edges of each arch
    el("path", { d: `M${x0} 604 L${x0} ${aTop} A${R} ${R} 0 0 1 ${x0 + W} ${aTop} L${x0 + W} 604`, fill: "none", stroke: "#FFC27A", "stroke-width": 3, opacity: 0.55 }, co);
    el("path", { d: `M${x0 - 8} 604 L${x0 - 8} ${aTop + 10}`, stroke: "#C06E36", "stroke-width": 2, opacity: 0.35 }, co);
    // capitals
    el("rect", { x: x0 - P - 2, y: aTop - 6, width: P + 4, height: 12, fill: "#8A4C2A", opacity: i ? 1 : 0 }, co);
  }
  el("rect", { x: xs[4] + W - 2, y: aTop - 6, width: P + 4, height: 12, fill: "#8A4C2A" }, co);
  // light pooling on the floor through each arch
  const sh = document.getElementById("shafts");
  for (let i = 0; i < 5; i++) { const x0 = xs[i], k = 1 - Math.abs(i - 3) * 0.22;
    el("path", { d: `M${x0 + 6} 604 L${x0 + W - 6} 604 L${x0 + W + 40} 690 L${x0 - 20} 690Z`, fill: "#FFCF85", opacity: (0.22 * k).toFixed(2), filter: "url(#b12)" }, sh); }
  // steps down into the pool
  const st = document.getElementById("steps");
  el("rect", { x: 0, y: 600, width: 1080, height: 6, fill: "#C98A52", opacity: 0.7 }, st);
  el("path", { d: "M60 664 L1020 664", stroke: "#B07040", "stroke-width": 3, opacity: 0.5 }, st);
  el("path", { d: "M120 680 L960 680", stroke: "#FFD9A0", "stroke-width": 3, opacity: 0.8 }, st);
  // pool shimmer: the sunrise reflected in jade water
  const rp = document.getElementById("ripples");
  el("ellipse", { cx: 744, cy: 748, rx: 70, ry: 76, fill: "#FFE2A0", opacity: 0.38, filter: "url(#b12)" }, rp);
  for (let i = 0; i < 46; i++) { const y = 690 + r() * 130, spread = 30 + (y - 690) * 0.9, x = 744 + (r() - 0.5) * spread * 2, l = 14 + r() * 60;
    el("line", { x1: (x - l / 2).toFixed(1), y1: y.toFixed(1), x2: (x + l / 2).toFixed(1), y2: y.toFixed(1), stroke: "#FFEBC0", "stroke-width": (1.5 + r() * 2).toFixed(1), "stroke-linecap": "round", opacity: (0.3 + r() * 0.5).toFixed(2) }, rp); }
  for (let i = 0; i < 30; i++) { const y = 694 + r() * 120, x = 140 + r() * 820, l = 20 + r() * 50;
    el("line", { x1: x.toFixed(1), y1: y.toFixed(1), x2: (x + l).toFixed(1), y2: y.toFixed(1), stroke: "#9FE6CC", "stroke-width": 1.6, "stroke-linecap": "round", opacity: (0.15 + r() * 0.3).toFixed(2) }, rp); }
  // others still waiting by the water (dim, far left and right)
  const sp = document.getElementById("spot");
  el("path", { d: "M40 640 C40 626 70 620 104 624 C130 616 160 624 172 640Z", fill: "#1F0F08", opacity: 0.85 }, sp);
  el("circle", { cx: 54, cy: 628, r: 10, fill: "#1F0F08", opacity: 0.85 }, sp);
  el("path", { d: "M968 642 C962 610 968 592 984 588 C1000 592 1004 612 1000 642Z", fill: "#1F0F08", opacity: 0.85 }, sp);
  el("circle", { cx: 984, cy: 576, r: 11, fill: "#1F0F08", opacity: 0.85 }, sp);
  // the empty worn place where he lay for thirty-eight years
  el("path", { d: "M262 630 L432 630 L446 656 L248 656Z", fill: "#241008", opacity: 0.6, filter: "url(#b3)" }, sp);
  el("path", { d: "M262 630 L432 630 L446 656 L248 656Z", fill: "none", stroke: "#FFCF8A", "stroke-width": 1.5, "stroke-dasharray": "6 6", opacity: 0.45 }, sp);
  // footsteps leading away from it
  for (let i = 0; i < 4; i++) { const x = 470 + i * 34, y = 648 + i * 3 + (i % 2 ? 6 : 0);
    el("ellipse", { cx: x, cy: y, rx: 7, ry: 3.2, fill: "#2A130A", opacity: (0.35 + i * 0.1).toFixed(2) }, sp); }
  // the man made whole: upright, mid-stride, his bed rolled on his shoulder
  const m = el("g", { transform: "translate(640 662) scale(1.12)" }, document.getElementById("man"));
  el("ellipse", { cx: 0, cy: -150, rx: 120, ry: 170, fill: "url(#rim)" }, m);
  el("ellipse", { cx: -6, cy: 4, rx: 58, ry: 7, fill: "#1A0A05", opacity: 0.55, filter: "url(#b3)" }, m);
  const ink = "#170A05";
  const limb = (d, w) => el("path", { d, stroke: ink, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" }, m);
  limb("M-12 -42 L-30 -4 L-44 0", 13);   // back leg
  limb("M12 -42 L28 -6 L44 -2", 13);     // front leg, stepping out
  el("path", { d: "M-22 -236 C-34 -196 -38 -140 -46 -70 L-52 -40 L50 -40 L44 -74 C38 -146 34 -200 22 -236 Z", fill: ink }, m); // robe
  el("path", { d: "M-40 -150 L38 -150", stroke: "#4A2414", "stroke-width": 5 }, m); // sash
  limb("M20 -224 L40 -170 L54 -126", 11); // free arm swinging
  el("rect", { x: -6, y: -258, width: 12, height: 22, fill: ink }, m); // neck
  el("circle", { cx: 0, cy: -270, r: 20, fill: ink }, m); // head
  el("path", { d: "M-19 -272 C-19 -294 17 -297 21 -274 C23 -262 22 -250 30 -236 C12 -240 -12 -240 -28 -236 C-20 -248 -20 -260 -19 -272Z", fill: ink }, m); // head covering draped to the shoulders
  // rolled mat across the shoulders
  const mat = el("g", { transform: "rotate(-9 -10 -246)" }, m);
  el("rect", { x: -88, y: -262, width: 118, height: 30, rx: 15, fill: "#B9783E" }, mat);
  for (let k = 0; k < 6; k++) el("line", { x1: -76 + k * 19, y1: -262, x2: -76 + k * 19, y2: -232, stroke: "#7E4A22", "stroke-width": 2.4, opacity: 0.7 }, mat);
  el("path", { d: "M-82 -258 L24 -258", stroke: "#FFD69A", "stroke-width": 3, "stroke-linecap": "round", opacity: 0.85 }, mat);
  el("ellipse", { cx: 30, cy: -247, rx: 7, ry: 15, fill: "#D39552" }, mat);
  el("path", { d: "M30 -255 C35 -252 35 -244 30 -242 C27 -244 27 -250 31 -250", stroke: "#7E4A22", "stroke-width": 1.8, fill: "none" }, mat);
  limb("M-18 -230 L-40 -248 L-60 -250", 11); // hand gripping the bed
  // rim light from the sunrise on his right edge
  el("path", { d: "M22 -236 C34 -200 38 -146 44 -74 L50 -40", stroke: "#FFC27A", "stroke-width": 3, fill: "none", opacity: 0.8 }, m);
  el("path", { d: "M16 -288 C24 -280 24 -262 18 -252", stroke: "#FFD69A", "stroke-width": 2.6, fill: "none", opacity: 0.85 }, m);
  // dust motes in the light
  const mo = document.getElementById("motes");
  for (let i = 0; i < 70; i++) el("circle", { cx: (420 + r() * 520).toFixed(1), cy: (300 + r() * 330).toFixed(1), r: (0.8 + r() * 2).toFixed(1), fill: "#FFF1CC", opacity: (0.2 + r() * 0.5).toFixed(2) }, mo);
</script>
</body></html>
