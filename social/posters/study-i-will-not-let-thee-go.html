<!doctype html>
<html><head><meta charset="utf-8">
<!-- WFN Bible study poster - I Will Not Let Thee Go (Genesis 32), Nov 12, 2026 -->
<style>
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'FR'; src:url(../fonts/fraunces-latin-400-italic.woff2); font-weight:400; font-style:italic;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'CG'; src:url(../fonts/cormorant-garamond-latin-500-italic.woff2); font-weight:500; font-style:italic;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-400-normal.woff2); font-weight:400;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-500-normal.woff2); font-weight:500;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-600-normal.woff2); font-weight:600;}
  @font-face{font-family:'IN'; src:url(../fonts/inter-latin-700-normal.woff2); font-weight:700;}
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1350px; overflow:hidden; background:#0A0714;}
  .poster{position:relative; width:1080px; height:1350px; overflow:hidden; background:#0A0714;}
  svg.art{position:absolute; left:0; top:0; width:1080px; height:1350px;}
  .top{position:absolute; top:62px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between;}
  .lock{display:flex; align-items:center; gap:14px;}
  .lock svg{width:50px; height:50px;}
  .lock .rule{width:1px; height:38px; background:linear-gradient(to bottom, rgba(232,199,122,0), rgba(232,199,122,0.8), rgba(232,199,122,0));}
  .abbr{display:block; font-family:'CG'; font-weight:600; font-size:29px; line-height:1; letter-spacing:0.34em; color:#E8C77E;}
  .full{display:block; margin-top:7px; font-family:'IN'; font-weight:500; font-size:10.5px; letter-spacing:0.38em; text-transform:uppercase; color:rgba(240,226,196,0.78);}
  .chip{font-family:'IN'; font-weight:600; font-size:14px; letter-spacing:0.22em; text-transform:uppercase; color:#EADCFF; padding:12px 20px 12px 18px; border-radius:100px; border:1px solid rgba(206,182,255,0.42); background:rgba(32,20,52,0.45); display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px);}
  .chip i{width:9px; height:9px; border-radius:50%; background:#D7C0FF; box-shadow:0 0 12px 3px #D7C0FF;}
  .copy{position:absolute; left:0; right:0; top:790px; text-align:center; padding:0 70px;}
  .kicker{font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.32em; text-transform:uppercase; color:rgba(232,206,232,0.88);}
  h1{margin-top:18px; font-family:'FR'; font-weight:600; font-size:112px; line-height:0.94; letter-spacing:-0.035em; color:#FBF3E4; text-shadow:0 6px 40px rgba(0,0,0,0.5);}
  h1 em{display:block; font-style:italic; font-weight:400; letter-spacing:-0.025em; background:linear-gradient(180deg,#FFF1D2 0%,#F0B568 38%,#C97A6B 72%,#6B3F6B 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 24px rgba(201,122,107,0.4)); padding:0 14px 10px;}
  .sub{margin:16px auto 0; max-width:830px; font-family:'IN'; font-size:22px; line-height:1.45; color:rgba(240,232,220,0.88);}
  .sub b{color:#F0C9A0; font-weight:600;}
  .cta{position:absolute; left:64px; right:64px; bottom:62px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 26px 22px 30px; border-radius:26px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.13); backdrop-filter:blur(10px);}
  .verse{font-family:'CG'; font-style:italic; font-weight:500; font-size:23px; line-height:1.3; color:rgba(246,236,214,0.92); max-width:560px;}
  .verse span{display:block; margin-top:6px; font-family:'IN'; font-style:normal; font-weight:600; font-size:12.5px; letter-spacing:0.24em; text-transform:uppercase; color:#E8C77E;}
  .btn{flex:none; text-align:right;}
  .btn .l1{display:inline-block; font-family:'IN'; font-weight:700; font-size:19px; color:#241433; background:linear-gradient(180deg,#F1D9FF,#D9A6E9); padding:15px 24px; border-radius:100px; box-shadow:0 10px 30px -8px rgba(201,122,170,0.55);}
  .btn .l2{display:block; margin-top:10px; font-family:'IN'; font-weight:600; font-size:17px; letter-spacing:0.02em; color:#FBF3E4;}
</style></head>
<body><div class="poster">
<svg class="art" viewBox="0 0 1080 1350">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07081A"/><stop offset="0.3" stop-color="#171A3E"/><stop offset="0.52" stop-color="#3B2C52"/><stop offset="0.7" stop-color="#8C5B58"/><stop offset="0.85" stop-color="#DB9A58"/><stop offset="1" stop-color="#F3CE94"/>
    </linearGradient>
    <linearGradient id="hills1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241F42"/><stop offset="1" stop-color="#140F26"/></linearGradient>
    <linearGradient id="hills2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2338"/><stop offset="1" stop-color="#120A1C"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B077" stop-opacity="0.85"/><stop offset="0.5" stop-color="#C98B70" stop-opacity="0.55"/><stop offset="1" stop-color="#4A2A3A" stop-opacity="0.65"/></linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F3EFE2"/><stop offset="0.3" stop-color="#E7E6D8" stop-opacity="0.55"/><stop offset="1" stop-color="#E7E6D8" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFEFC8" stop-opacity="0.85"/><stop offset="0.45" stop-color="#F0B96E" stop-opacity="0.4"/><stop offset="1" stop-color="#F0B96E" stop-opacity="0"/></radialGradient>
    <radialGradient id="campglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFC877"/><stop offset="1" stop-color="#FFC877" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0714" stop-opacity="0"/><stop offset="1" stop-color="#0A0714"/></linearGradient>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b14"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1080" height="800" fill="url(#sky)"/>
  <g id="stars"></g>
  <circle cx="130" cy="270" r="66" fill="url(#moon)"/>
  <circle cx="130" cy="270" r="19" fill="#F3EFE2" opacity="0.8"/>
  <!-- far ridge beyond the Jabbok -->
  <path d="M0 420 C140 392 230 404 340 384 C470 360 580 396 700 378 C840 358 960 388 1080 368 L1080 800 L0 800Z" fill="url(#hills1)" opacity="0.9"/>
  <!-- the far bank: Jacob's household, flocks and tents already sent across -->
  <g id="campfar"></g>
  <!-- nearer bank / rise where the two now struggle -->
  <path d="M0 800 C120 700 260 650 420 648 C560 646 640 690 700 760 C760 820 780 800 820 760 L1080 760 L1080 800Z" fill="url(#hills2)" opacity="0.92"/>
  <!-- the river Jabbok, reflecting the breaking dawn -->
  <path d="M0 686 C180 668 340 696 520 680 C700 662 880 690 1080 672 L1080 760 C880 748 700 726 520 742 C340 758 180 732 0 748Z" fill="url(#river)"/>
  <g id="shimmer"></g>
  <g id="reeds"></g>

  <!-- dawn breaking directly behind the struggle, at the Jabbok's edge -->
  <ellipse cx="620" cy="748" rx="240" ry="110" fill="url(#halo)" filter="url(#b14)" opacity="0.8"/>

  <!-- the wrestling: the Man stands braced and upright; Jacob is bent double into him, one leg low where the hip gave way -->
  <g transform="translate(614 748) scale(2.3)">
    <ellipse cx="10" cy="-62" rx="46" ry="54" fill="url(#halo)" opacity="0.55"/>
    <!-- the Man: upright, braced stance, one arm pressed down onto Jacob -->
    <path d="M2 -86 C-7 -58 -9 -24 -6 4 L4 18 L22 16 L26 4 C29 -24 25 -58 16 -86Z" fill="#0A0613"/>
    <circle cx="8" cy="-94" r="10.5" fill="#0A0613"/>
    <path d="M14 -70 C26 -62 32 -52 28 -40 L10 -28" stroke="#0A0613" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M-4 -66 L-24 -46 L-30 -34" stroke="#0A0613" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M4 18 L2 46" stroke="#0A0613" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M22 16 L30 44" stroke="#0A0613" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Jacob: body pitched forward almost horizontal, head down, gripping the Man's waist, back leg braced, front knee buckled low -->
    <g transform="translate(-6 8)">
      <path d="M-46 -22 C-34 -30 -16 -32 -2 -24 C4 -20 4 -12 -2 -8 C-18 2 -36 2 -48 -6 C-54 -11 -52 -18 -46 -22Z" fill="#06040A"/>
      <circle cx="-50" cy="-24" r="10" fill="#06040A"/>
      <path d="M-30 -24 C-20 -34 -10 -38 2 -40" stroke="#06040A" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M-14 -12 L2 -4 L8 8" stroke="#06040A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      <path d="M-30 -4 C-32 14 -30 30 -34 46" stroke="#06040A" stroke-width="7.5" stroke-linecap="round" fill="none"/>
      <path d="M-12 -2 C-6 10 2 16 1 30" stroke="#06040A" stroke-width="7.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <rect y="690" width="1080" height="112" fill="url(#fade)"/>
  <rect y="800" width="1080" height="550" fill="#0A0714"/>

</svg>
<div class="top">
  <div class="lock"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A8"/><stop offset="0.5" stop-color="#D4AE5E"/><stop offset="1" stop-color="#A9823F"/></linearGradient></defs>
      <circle cx="24" cy="24" r="22.8" fill="none" stroke="url(#lg)" stroke-width="0.7" opacity="0.5"/>
      <circle cx="24" cy="24" r="20.4" fill="rgba(0,0,0,0.35)" stroke="url(#lg)" stroke-width="1.2"/>
      <path d="M15 31.5 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 31.5" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="url(#lg)"/>
      <path d="M16.5 35.2 L31.5 35.2" stroke="url(#lg)" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/></svg><div class="rule"></div><div><span class="abbr">WFN</span><span class="full">Word &amp; Faith Network</span></div></div>
  <div class="chip"><i></i>Daily Bible Study</div>
</div>
<div class="copy">
  <div class="kicker">Genesis 32 &middot; Jacob at the Jabbok</div>
  <h1>I will not<em>let thee go.</em></h1>
  <p class="sub">One touch and his hip gave out &mdash; <b>and he held on anyway, until the blessing came.</b></p>
</div>
<div class="cta">
  <div class="verse">&ldquo;And he said, I will not let thee go, except thou bless me.&rdquo;<span>Genesis 32:26</span></div>
  <div class="btn"><span class="l1">Study it today &rarr;</span><span class="l2">wfnglobal.org/study</span></div>
</div>
</div>
<script>
  let s = 32; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || document.querySelector("svg.art")).appendChild(e); return e; }

  const stars = document.getElementById("stars");
  for (let i = 0; i < 90; i++) { const y = r() * 340; el("circle", { cx: r() * 1080, cy: y, r: (r() * 1.3 + 0.3).toFixed(2), fill: "#EDEAF5", opacity: (0.15 + r() * 0.55 * (1 - y / 420)).toFixed(2) }, stars); }

  // the far bank: tents and flocks Jacob sent ahead across the ford, lit by small banked fires
  const campfar = document.getElementById("campfar");
  for (let i = 0; i < 9; i++) {
    const x = 60 + i * 42 + r() * 10; const y = 448 + r() * 14; const sc = 0.55 + r() * 0.25;
    const w = 24 * sc, h = 17 * sc;
    el("path", { d: `M${x} ${y} L${x + w / 2} ${y - h} L${x + w} ${y}Z`, fill: "#1C1430", stroke: "#3A2E54", "stroke-width": 0.8 }, campfar);
    if (r() < 0.4) { el("circle", { cx: x + w + 4, cy: y - 1, r: 5, fill: "url(#campglow)", opacity: 0.6 }, campfar); }
  }
  // a few flocks grazing near the tents, small ovals
  for (let i = 0; i < 14; i++) { const x = 40 + r() * 340; const y = 462 + r() * 16; el("ellipse", { cx: x, cy: y, rx: 5 + r() * 2, ry: 3, fill: "#1C1430", opacity: 0.85 }, campfar); }

  // shimmer on the river: thin reflected highlight streaks
  const sh = document.getElementById("shimmer");
  for (let i = 0; i < 46; i++) {
    const y = 690 + r() * 62; const x = r() * 1040; const w = 30 + r() * 90;
    el("rect", { x: x, y: y, width: w, height: 1.6 + r() * 1.6, fill: r() < 0.5 ? "#FFD9A0" : "#E8A47E", opacity: (0.18 + r() * 0.3).toFixed(2), rx: 2 }, sh);
  }

  // reeds along the near bank, foreground silhouettes
  const reeds = document.getElementById("reeds");
  for (let i = 0; i < 26; i++) {
    const x = r() * 1080; const baseY = 772 + r() * 26; const h = 30 + r() * 46;
    el("path", { d: `M${x} ${baseY} C${x - 4} ${baseY - h * 0.6} ${x + 6} ${baseY - h} ${x + 2} ${baseY - h}`, stroke: "#06040A", "stroke-width": 2.2, "stroke-linecap": "round", fill: "none", opacity: 0.9 }, reeds);
  }
</script>
</body></html>
