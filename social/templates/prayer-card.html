<!doctype html>
<html><head><meta charset="utf-8">
<!-- Instagram Daily Prayer card v2 (approved Nov 15, 2026: this exact look; do not change colours or style). Rendered by social/generate-card.js. -->
<style>
@font-face{font-family:Fraunces;font-weight:400;src:url(../fonts/fraunces-latin-400-normal.woff2)}
@font-face{font-family:Fraunces;font-weight:600;src:url(../fonts/fraunces-latin-600-normal.woff2)}
@font-face{font-family:Fraunces;font-style:italic;font-weight:400;src:url(../fonts/fraunces-latin-400-italic.woff2)}
@font-face{font-family:Newsreader;font-style:italic;font-weight:400;src:url(../fonts/newsreader-latin-400-italic.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../fonts/inter-latin-600-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#F4EDE1;color:#1E1A16;font-family:Inter,sans-serif;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:
 radial-gradient(1200px 700px at 85% -10%,rgba(201,150,62,.16),transparent 60%),
 radial-gradient(900px 600px at -10% 110%,rgba(27,42,92,.07),transparent 60%);}
.frame{position:absolute;inset:44px;border:1.5px solid rgba(30,26,22,.14)}
.wrap{position:absolute;inset:44px;padding:76px 84px 70px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px;font-family:Fraunces;font-weight:600;font-size:24px;letter-spacing:.01em}
.brand svg{width:40px;height:40px}
.chip{font-weight:600;font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:#9A6B1E}
.kicker{margin-top:118px;font-weight:600;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:#9A6B1E}
.truth{margin-top:30px;font-family:Fraunces;font-weight:400;font-size:var(--tsize,78px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.truth em{font-style:italic;color:#9A6B1E}
.seam{margin:54px 0 46px;height:3px;width:150px;background:linear-gradient(90deg,#7A4A10,#E8B04A 45%,#FFE3A1 55%,#B67A22);border-radius:2px}
.pray{font-family:Newsreader;font-style:italic;font-size:var(--psize,38px);line-height:1.38;color:#3A322A;text-wrap:pretty}
.pray b{font-family:Inter;font-style:normal;font-weight:600;font-size:.62em;letter-spacing:.22em;text-transform:uppercase;color:#9A6B1E;display:block;margin-bottom:12px}
.spacer{flex:1}
.verse{font-family:Fraunces;font-style:italic;font-size:27px;line-height:1.4;color:#1E1A16}
.verse span{display:block;margin-top:10px;font-family:Inter;font-style:normal;font-weight:600;font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:#7A6A55}
.foot{margin-top:40px;padding-top:24px;border-top:1.5px solid rgba(30,26,22,.14);display:flex;justify-content:space-between;font-weight:600;font-size:18px;letter-spacing:.06em;color:#5A4E40}
.foot i{font-style:normal;color:#9A6B1E}
</style></head><body>
<div class="frame"></div>
<div class="wrap">
 <div class="top">
  <div class="brand"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#9A6B1E" stroke-width="1.6"/><path d="M11 27V14l4.5 7 4.5-9 4.5 9 4.5-7v13" fill="none" stroke="#9A6B1E" stroke-width="1.8" stroke-linejoin="round"/></svg>Word &amp; Faith Network</div>
  <div class="chip" id="chip">Daily Prayer</div>
 </div>
 <div class="kicker" id="kicker"></div>
 <h1 class="truth" id="truth"></h1>
 <div class="seam"></div>
 <p class="pray" id="pray"></p>
 <div class="spacer"></div>
 <p class="verse" id="verse"></p>
 <div class="foot"><span id="save">Save this · Share it with someone</span><i>wfnglobal.org</i></div>
</div>
<script>
const C=window.CONTENT||{};
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById("kicker").textContent=C.kicker||"";
let t=esc(C.truth);
if(C.accent)t=t.replace(esc(C.accent),"<em>"+esc(C.accent)+"</em>");
document.getElementById("truth").innerHTML=t;
document.getElementById("pray").innerHTML="<b>Pray</b>"+esc(C.prayer);
document.getElementById("verse").innerHTML="“"+esc(C.verse&&C.verse.text)+"”<span>"+esc(C.verse&&C.verse.ref)+" · KJV</span>";
if(C.save)document.getElementById("save").textContent=C.save;
if(C.chip)document.getElementById("chip").textContent=C.chip;
const r=document.documentElement.style,tl=(C.truth||"").length,pl=(C.prayer||"").length;
let ts=tl<45?92:tl<70?80:tl<95?70:62;
r.setProperty("--tsize",ts+"px");
r.setProperty("--psize",(pl<130?40:pl<190?36:32)+"px");
const wrap=document.querySelector(".wrap");
for(let i=0;i<20&&wrap.scrollHeight>wrap.clientHeight;i++){ts-=3;r.setProperty("--tsize",ts+"px")}
document.body.dataset.fit=wrap.scrollHeight<=wrap.clientHeight?"ok":"overflow";
</script>
</body></html>
