<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Daily Prayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --surface:#FFFDF8;
    --surface-3:#EEE5D2;
    --ink:#231F18;
    --ink-2:#564E3E;
    --ink-3:#8C8370;
    --gold:#9C7A34;
    --gold-light:#C9A968;
    --gold-wash:#E9D9AE;
    --border:rgba(35,31,24,0.12);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1080px;}
  body{
    font-family:var(--font-body);
    background:
      radial-gradient(circle at 12% 8%, rgba(156,122,52,0.14) 0%, transparent 45%),
      radial-gradient(circle at 92% 94%, rgba(156,122,52,0.12) 0%, transparent 42%),
      var(--surface);
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }
  .frame{
    position:absolute; inset:28px;
    border:1.5px solid var(--gold-wash);
    border-radius:28px;
  }
  .post{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:76px 86px 64px;
  }
  .header{display:flex; align-items:center; gap:18px; margin-bottom:46px;}
  .avatar{
    width:74px; height:74px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:3px solid var(--surface); box-shadow:0 0 0 3px var(--gold);
  }
  .who{display:flex; flex-direction:column; gap:4px;}
  .name-row{display:flex; align-items:center; gap:7px; font-family:var(--font-body); font-weight:800; font-size:24px; color:var(--ink);}
  .name-row svg{flex-shrink:0;}
  .handle{font-size:16px; font-weight:600; color:var(--ink-3); letter-spacing:0.01em;}

  .kicker{
    font-size:16px; font-weight:800; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); margin-bottom:28px;
  }

  .lines{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px;}
  .line{
    font-family:var(--font-display); font-weight:600; font-size:38px; line-height:1.32; color:var(--ink);
  }
  .line b{font-weight:700; color:#231F18; background:linear-gradient(transparent 62%, var(--gold-wash) 62%); padding:0 2px;}
  .break{height:10px;}

  .footer{
    margin-top:40px; padding-top:28px; border-top:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .ref{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:24px; color:var(--gold);}
  .brand{display:flex; align-items:center; gap:10px; font-size:16.5px; font-weight:700; color:var(--ink-2);}
  .brand .dot{width:7px; height:7px; border-radius:50%; background:var(--gold);}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="post">
    <div class="header">
      <img class="avatar" src="{{AVATAR_SRC}}" alt="">
      <div class="who">
        <div class="name-row">
          {{NAME}}
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#3897F0"></circle><path d="M8 12.3l2.6 2.6L16.2 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div class="handle">{{HANDLE}}</div>
      </div>
    </div>
    <div class="kicker">{{KICKER}}</div>
    <div class="lines">
      {{LINES_HTML}}
    </div>
    <div class="footer">
      <div class="ref">{{REF}}</div>
      <div class="brand"><span class="dot"></span>Word and Faith Network</div>
    </div>
  </div>
</body>
</html>
