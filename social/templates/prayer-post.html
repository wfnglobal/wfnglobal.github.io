<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Daily Prayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ink:#2B2420;
    --ink-2:#4A4038;
    --ink-3:#8C7A52;
    --gold:#A9824F;
    --gold-light:#C8A24A;
    --gold-dark:#8E6A2E;
    --border:rgba(43,36,32,0.14);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1080px;}
  body{
    font-family:var(--font-body);
    background:#FFFFFF;
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }
  .texture{position:absolute; inset:0; background-image:radial-gradient(#E9DFC4 1px, transparent 1px); background-size:26px 26px; opacity:0.05;}
  .post{position:relative; width:100%; height:100%; display:flex; flex-direction:column; padding:72px;}

  .head{display:flex; align-items:center; gap:18px;}
  .mark{width:58px; height:58px; flex-shrink:0;}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:29px; color:var(--ink); letter-spacing:-0.2px;}
  .brand-sub{font-size:14.5px; color:var(--ink-3); font-weight:700; margin-top:3px; letter-spacing:0.5px; text-transform:uppercase;}

  .kicker{margin-top:48px; font-size:14px; font-weight:800; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold);}

  .prayer{flex:1; display:flex; align-items:center;}
  .prayer-text{font-family:var(--font-display); font-size:40px; line-height:1.42; font-weight:500; color:var(--ink); letter-spacing:-0.2px;}
  .prayer-text .opener{display:block; font-style:italic; color:#5B4B2A; font-size:30px; margin-bottom:22px;}
  .prayer-text p{margin:0 0 22px;}
  .prayer-text p:last-child{margin-bottom:0;}
  .prayer-text b{font-weight:700; color:#7A3B36;}

  .foot{display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); padding-top:28px; margin-top:20px;}
  .foot-cta{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; color:var(--ink);}
  .foot-cta svg{width:22px; height:22px; flex-shrink:0;}
  .foot-sub{font-size:14.5px; color:var(--ink-3); font-weight:600;}
</style>
</head>
<body>
  <div class="texture"></div>
  <div class="post">
    <div class="head">
      <svg class="mark" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--gold-light)"/>
            <stop offset="1" stop-color="var(--gold-dark)"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="21.3" fill="none" stroke="var(--gold)" stroke-width="1.1"/>
        <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="url(#grad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="var(--gold-light)"/>
      </svg>
      <div>
        <div class="brand-name">Word &amp; Faith Network</div>
        <div class="brand-sub">{{BRAND_SUB}}</div>
      </div>
    </div>
    <div class="kicker">{{KICKER}}</div>
    <div class="prayer">
      <div class="prayer-text">
        <span class="opener">{{OPENER}}</span>
        {{BODY_HTML}}
      </div>
    </div>
    <div class="foot">
      <div class="foot-cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        {{FOOTER_NOTE}}
      </div>
      <div class="foot-sub">{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
