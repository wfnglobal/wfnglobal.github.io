<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Action Film</title>
<!--
  ACTION FILM template (reel-action.html, content.json "template": "action").
  Built on reel-scenes.html (same intro, watermark, captions, end card and
  generate-reel.js contract) but cut like a trailer: one shot per line,
  whip cuts, camera shake, lightning, rim-lit human figures and punch-in
  captions. Scenes: dusk setout cloudwall bolt wave deck hands face sleep
  wake rise command calm awe car carDawn sunrise. Per-scene data-shake
  (0-3), data-flash (lightning times in s after the cut), data-white
  (white-out time) - social/sfx.js mirrors these for thunder/impacts.

  The scene-template notes below are kept for reference.
  Scene-based "short film" template. Unlike reel-cinematic.html (one
  theme + small abstract motifs), every scene here is its own fully
  illustrated world with its own colour grade, atmosphere and camera
  move, so a single film changes look as its story moves:

    valley    - dusk desert valley, lone traveller, teal + amber
    habakkuk  - burnt-orange hillside, dead vines, withered fig, prophet with staff
    rejoice   - same prophet, arms raised, gold light breaking through cloud
    job       - grey ash-heap ruins, broken columns, embers, seated figure
    david     - moonlit Jerusalem rooftop, indigo + silver, lyre on the parapet
    three     - three figures on three peaks under a rose/violet dawn
    everyman  - modern man at a table by a rain-streaked city window, teal + amber
    heights   - a hind on a mountain spire above a sea of clouds at sunrise
    storm     - black-indigo sea storm at night, lightning, a small boat taking water
    command   - black storm clouds split by gold light, a figure standing in the boat, arms raised
    calm      - a calm rose-gold sea at sunrise, the same boat resting on glassy water
    quarry    - dusk stone canyon, violet-rose sky, a lone figure dragging a heavy boulder
    vigil     - vast star-filled indigo night, low peaks, a small kneeling figure beneath a moon
    daybreak  - gold sunrise burst and mist, the boulder cracking into light, a figure rising arms open
    stubble   - a burning dusk field, crimson/copper sky, dry chaff catching fire, figure watching
    gate      - indigo night, a carved stone gate with warm gold light glowing in its seam, figure approaching
    vineyard  - green-gold dawn, rows of fruited vines on a hillside, figure arms raised among them
    multitude - sun-baked dusty-ochre midday market, a pressed crowd of small silhouettes, one figure pushing through
    hem       - close warm amber-rose firelight, a robed figure mid-stride, a bright gold flare where a hand meets the hem
    whole     - wide bright gold-cream dawn burst, a lone figure standing with arms lifted in the light

  Each scene is built from layers (l-back / l-front) that get different
  Ken Burns moves for a 2.5D parallax camera, plus an HTML particle layer
  (.fx) for dust / ash / embers / stars / rain / bokeh / motes / smoke.
  Only composited transforms/opacity animate - the SVG artwork itself is
  static - so Chromium can record smoothly in real time.

  generate-reel.js drives it via content.json "template": "scenes": each
  line's "visual" is a scene key above, optional "chapter":{num,name,ref}
  shows a chapter card as that scene opens, and "scripture": true sets
  the line in the italic scripture face.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Fraunces:opsz,wght@9..144,700&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  :root{
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --serif:'Cormorant Garamond', 'Times New Roman', Georgia, serif;
    --sans:'Poppins', -apple-system, system-ui, sans-serif;
    --accent:#E8C79A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1920px; overflow:hidden; background:#000;}
  body{font-family:var(--sans); color:#F5EFE4; position:relative;}

  body[data-shot="valley"]{--accent:#F0B06A;}
  body[data-shot="habakkuk"]{--accent:#FF9F5A;}
  body[data-shot="rejoice"]{--accent:#FFE2A0;}
  body[data-shot="job"]{--accent:#FF8A4C;}
  body[data-shot="david"]{--accent:#B4C6FF;}
  body[data-shot="three"]{--accent:#FFB3C2;}
  body[data-shot="everyman"]{--accent:#7FD3DE;}
  body[data-shot="heights"]{--accent:#FFD9A0;}
  body[data-shot="storm"]{--accent:#CFE8FF;}
  body[data-shot="command"]{--accent:#FFE9B0;}
  body[data-shot="calm"]{--accent:#FFD9B8;}
  body[data-shot="quarry"]{--accent:#D79A78;}
  body[data-shot="vigil"]{--accent:#B9C0E8;}
  body[data-shot="daybreak"]{--accent:#FFD98A;}
  body[data-shot="stubble"]{--accent:#FF6A3D;}
  body[data-shot="gate"]{--accent:#E3C27A;}
  body[data-shot="vineyard"]{--accent:#BFE07A;}
  body[data-shot="multitude"]{--accent:#D9A868;}
  body[data-shot="hem"]{--accent:#FF8F6B;}
  body[data-shot="whole"]{--accent:#FFF0B0;}

  #stage{position:absolute; inset:0; overflow:hidden;}
  /* Only the live scene(s) exist in the render tree at all - keeping all
     eight scenes' full-frame layers alive at once exhausts the
     compositor in headless Chromium and the frame goes black. */
  .scene{position:absolute; inset:0; opacity:0; overflow:hidden; display:none;}
  .scene.live{display:block;}
  .layer{position:absolute; inset:0; transform-origin:var(--ox,50%) var(--oy,50%);}
  .scene.live .layer{will-change:transform;}
  .layer svg, .drift svg, .spin svg{position:absolute; left:0; top:0; width:1080px; height:1920px; display:block; overflow:visible;}
  .drift{position:absolute; inset:0; animation:drift var(--ddur,40s) ease-in-out infinite alternate;}
  .spin{position:absolute; inset:0; transform-origin:var(--rx,540px) var(--ry,960px); animation:spin var(--sdur,90s) linear infinite;}
  @keyframes drift{from{transform:translateX(0)} to{transform:translateX(var(--drift,-60px))}}
  @keyframes spin{from{transform:rotate(-4deg)} to{transform:rotate(4deg)}}

  /* Camera moves. Back layer moves less than front = parallax depth. */
  .scene.active .l-back{animation:var(--kb-back) var(--dur,20s) linear forwards;}
  .scene.active .l-front{animation:var(--kb-front) var(--dur,20s) linear forwards;}
  .scene[data-kb="push"]{--kb-back:pushB; --kb-front:pushF;}
  .scene[data-kb="pull"]{--kb-back:pullB; --kb-front:pullF;}
  .scene[data-kb="panl"]{--kb-back:panlB; --kb-front:panlF;}
  .scene[data-kb="panr"]{--kb-back:panrB; --kb-front:panrF;}
  .scene[data-kb="rise"]{--kb-back:riseB; --kb-front:riseF;}
  @keyframes pushB{from{transform:scale(1.03)} to{transform:scale(1.10)}}
  @keyframes pushF{from{transform:scale(1.04)} to{transform:scale(1.18)}}
  @keyframes pullB{from{transform:scale(1.12)} to{transform:scale(1.03)}}
  @keyframes pullF{from{transform:scale(1.22)} to{transform:scale(1.04)}}
  @keyframes panlB{from{transform:scale(1.10) translateX(26px)} to{transform:scale(1.10) translateX(-26px)}}
  @keyframes panlF{from{transform:scale(1.14) translateX(60px)} to{transform:scale(1.14) translateX(-60px)}}
  @keyframes panrB{from{transform:scale(1.10) translateX(-26px)} to{transform:scale(1.10) translateX(26px)}}
  @keyframes panrF{from{transform:scale(1.14) translateX(-60px)} to{transform:scale(1.14) translateX(60px)}}
  @keyframes riseB{from{transform:scale(1.08) translateY(30px)} to{transform:scale(1.08) translateY(-24px)}}
  @keyframes riseF{from{transform:scale(1.13) translateY(70px)} to{transform:scale(1.13) translateY(-46px)}}


  /* Particles */
  .fx{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .p{position:absolute; border-radius:50%; will-change:transform, opacity; opacity:0;
     animation:pMove var(--t,20s) linear var(--d,0s) infinite;}
  @keyframes pMove{
    0%{transform:translate(0,0); opacity:0;}
    15%{opacity:var(--o,0.8);}
    85%{opacity:var(--o,0.8);}
    100%{transform:translate(var(--dx,0px), var(--dy,0px)); opacity:0;}
  }
  .p.star{animation:twinkle var(--t,3s) ease-in-out var(--d,0s) infinite alternate;}
  @keyframes twinkle{from{opacity:0.15;} to{opacity:var(--o,1);}}
  .p.rain{border-radius:2px;}
  .p.bokeh{animation:bokeh var(--t,8s) ease-in-out var(--d,0s) infinite alternate;}
  @keyframes bokeh{from{opacity:calc(var(--o,0.5) * 0.4); transform:scale(0.9);} to{opacity:var(--o,0.5); transform:scale(1.08);}}

  /* Birds */
  .birds{position:absolute; inset:0; pointer-events:none;}
  .bird{position:absolute; will-change:transform; animation:fly var(--t,40s) linear var(--d,0s) infinite;}
  @keyframes fly{from{transform:translate(0,0);} to{transform:translate(var(--dx,-1400px), var(--dy,-120px));}}

  /* Global grade layers */
  .vignette{position:absolute; inset:0; z-index:12; pointer-events:none;
    background:radial-gradient(ellipse 75% 60% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);}
  /* Static grain texture: per-frame animated noise is almost impossible
     to compress (it pushed a 4-minute 4K render past 1 GB), while a fixed
     texture costs nothing after the first frame. */
  .grain{position:absolute; inset:0; z-index:13; pointer-events:none; opacity:0.05;}
  @keyframes grain{
    0%{transform:translate(0,0);} 20%{transform:translate(-30px,20px);} 40%{transform:translate(25px,-35px);}
    60%{transform:translate(-15px,40px);} 80%{transform:translate(35px,10px);} 100%{transform:translate(0,0);}
  }
  .cap-shade{position:absolute; left:0; right:0; bottom:0; height:760px; z-index:14; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.38) 45%, rgba(0,0,0,0) 100%);}
  .bar{position:absolute; left:0; right:0; height:118px; background:#000; z-index:20;}
  .bar.top{top:0;} .bar.bottom{bottom:0;}

  /* Chapter card */
  .chapter{position:absolute; left:0; right:0; top:210px; z-index:16; text-align:center; opacity:0; padding:0 80px;}
  .chapter .num{font-family:var(--sans); font-weight:500; font-size:20px; letter-spacing:0.55em; text-transform:uppercase; color:var(--accent);}
  .chapter .name{font-family:var(--serif); font-weight:500; font-size:88px; line-height:1.05; color:#FBF6EC; margin-top:18px;
    text-shadow:0 2px 30px rgba(0,0,0,0.55);}
  .chapter .rule{width:90px; height:1px; background:var(--accent); margin:26px auto 22px; opacity:0.9;}
  .chapter .ref{font-family:var(--sans); font-weight:400; font-size:22px; letter-spacing:0.28em; text-transform:uppercase; color:#EDE4D3; opacity:0.85;}

  /* Captions */
  .caption-wrap{position:absolute; left:0; right:0; bottom:240px; z-index:15; padding:0 96px; text-align:center;}
  .cap-line{font-family:var(--sans); font-weight:400; font-size:43px; line-height:1.45; color:#F6F0E5; opacity:0;
    text-shadow:0 2px 3px rgba(0,0,0,0.55), 0 0 32px rgba(0,0,0,0.6);}
  .cap-line b{font-weight:600; color:var(--accent);}
  .cap-line.scripture{font-family:var(--serif); font-style:italic; font-weight:500; font-size:60px; line-height:1.28; color:#FFF8EC;}
  .cap-line.scripture b{font-weight:600;}

  /* Opening: the WFN "global reach" brand intro (0-4.4s, identical to the
     daily reels), then "Word and Faith Network presents" (4.3-6.5s), then
     this film's own title (6.5-9.6s). generate-reel.js starts narration at
     9.5s for this template (SCENES_INTRO_DURATION) - keep them in sync. */
  .intro{position:absolute; inset:0; background:#000; z-index:30; display:flex; align-items:center; justify-content:center;
    animation:introOut 1.0s ease 8.6s forwards;}
  .intro .presents{position:absolute; text-align:center; font-family:var(--sans); font-weight:400; font-size:24px; letter-spacing:0.5em;
    text-transform:uppercase; color:#D8CFBE; opacity:0; animation:presents 2.2s ease 4.3s forwards; padding:0 60px;}
  .intro .presents small{display:block; margin-top:22px; font-family:var(--serif); font-style:italic; font-size:30px; letter-spacing:0.12em;
    text-transform:none; color:#B9A982;}
  @keyframes presents{0%{opacity:0;} 28%{opacity:1;} 74%{opacity:1;} 100%{opacity:0;}}
  .intro .film{position:absolute; text-align:center; font-family:var(--serif); font-weight:500; font-size:104px; line-height:1.02;
    color:#FBF4E6; padding:0 70px; opacity:0; animation:film 1.5s cubic-bezier(0.22,1,0.36,1) 6.55s forwards;}
  .intro .film-rule{position:absolute; top:calc(50% + 150px); width:0; height:1px; background:#C9A86E; animation:rule 1.2s ease 6.9s forwards;}
  @keyframes film{from{opacity:0; letter-spacing:0.16em; filter:blur(10px);} to{opacity:1; letter-spacing:0.01em; filter:blur(0);}}
  @keyframes rule{to{width:160px;}}
  @keyframes introOut{to{opacity:0;}}

  .gr{position:absolute; inset:0; z-index:32; background:radial-gradient(ellipse 1300px 1300px at 50% 42%, #2A1F14 0%, #150F0A 70%, #0E0A07 100%);
    animation:grOut 0.9s ease 3.5s forwards;}
  .gr svg.gr-net{width:1080px; height:1920px; position:absolute; top:0; left:0; overflow:visible;}
  .gr-beam{opacity:0; stroke-width:3; stroke-dasharray:440; stroke-dashoffset:440; stroke-linecap:round; animation:grBeam 0.7s var(--ease) forwards;}
  .gr-node{opacity:0; transform-box:fill-box; transform-origin:center; animation:grNode 0.5s var(--ease) forwards;}
  .g1{animation-delay:0.15s;} .g2{animation-delay:0.26s;} .g3{animation-delay:0.37s;} .g4{animation-delay:0.48s;}
  .g5{animation-delay:0.59s;} .g6{animation-delay:0.70s;} .g7{animation-delay:0.81s;} .g8{animation-delay:0.92s;}
  .g9{animation-delay:1.03s;} .g10{animation-delay:1.14s;} .g11{animation-delay:1.25s;} .g12{animation-delay:1.36s;}
  @keyframes grBeam{from{opacity:0.9; stroke-dashoffset:440;} to{opacity:0.55; stroke-dashoffset:0;}}
  @keyframes grNode{0%{opacity:0; transform:scale(0);} 60%{opacity:1; transform:scale(1.35);} 100%{opacity:1; transform:scale(1);}}
  .gr-ring{fill:none; stroke:rgba(243,217,138,0.18); stroke-width:1.5; opacity:0; transform-box:fill-box; transform-origin:center;
    animation:grRing 1s var(--ease) 1.5s forwards;}
  @keyframes grRing{from{opacity:0; transform:scale(0.85);} to{opacity:1; transform:scale(1);}}
  .gr-core{opacity:0; transform-box:fill-box; transform-origin:center; animation:grCore 0.8s var(--ease) 1.9s forwards;}
  @keyframes grCore{from{opacity:0; transform:scale(0.3);} to{opacity:1; transform:scale(1);}}
  .gr-mark{position:absolute; left:50%; top:820px; transform:translate(-50%,-50%) scale(0); width:100px; height:100px;
    animation:grMark 0.6s cubic-bezier(.2,1.4,.4,1) 2.1s forwards;}
  @keyframes grMark{from{transform:translate(-50%,-50%) scale(0); opacity:0;} to{transform:translate(-50%,-50%) scale(1); opacity:1;}}
  .gr-title{position:absolute; left:0; right:0; top:1000px; text-align:center; opacity:0; animation:grUp 0.9s var(--ease) 2.5s forwards;}
  .gr-title .name{font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:50px; color:#FBEFD2; letter-spacing:-0.3px;}
  .gr-title .tag{font-family:var(--sans); font-size:19px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#C8A24A; margin-top:14px;}
  @keyframes grUp{from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:translateY(0);}}
  @keyframes grOut{to{opacity:0; visibility:hidden;}}

  /* Ownership watermark: a small gold WFN lockup sitting inside the top-left
     letterbox bar (never over the picture), from the first scene through
     the end card. Emblem + hairline divider + "WFN" with a single gold
     sheen as it arrives + the full name in fine tracking beneath. */
  .wm{position:absolute; top:37px; left:40px; z-index:22; display:flex; align-items:center; gap:14px; opacity:0;
    animation:wmIn 1.4s cubic-bezier(0.22,1,0.36,1) 9.3s forwards;}
  .wm svg{width:44px; height:44px; flex:none; filter:drop-shadow(0 0 6px rgba(212,174,94,0.25));}
  .wm-rule{width:1px; height:36px; background:linear-gradient(to bottom, rgba(232,199,122,0), rgba(232,199,122,0.75), rgba(232,199,122,0));}
  .wm-abbr{display:block; font-family:var(--serif); font-weight:600; font-size:28px; line-height:1; letter-spacing:0.34em;
    background:linear-gradient(100deg, #B98D45 0%, #F2DDA0 42%, #FFF7DC 50%, #F2DDA0 58%, #B98D45 100%); background-size:260% 100%;
    background-position:100% 0; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:wmSheen 2.6s ease 9.8s forwards;}
  .wm-full{display:block; margin-top:7px; font-family:var(--sans); font-weight:500; font-size:10px; line-height:1; letter-spacing:0.42em;
    text-transform:uppercase; color:rgba(240,228,205,0.7);}
  @keyframes wmIn{from{opacity:0; transform:translateY(-5px);} to{opacity:0.94; transform:none;}}
  @keyframes wmSheen{to{background-position:0 0;}}

  /* End card */
  .title-card{position:absolute; inset:0; z-index:18; opacity:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; text-align:center; padding:0 90px;
    background:radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0.84) 0%, rgba(0,0,0,0.95) 100%);}
  .title-card .rule{width:80px; height:1px; background:#E8C79A;}
  .title-card .brand{font-family:var(--serif); font-weight:600; font-size:76px; line-height:1.05; color:#FBF4E6;}
  .title-card .tagline{font-family:var(--serif); font-style:italic; font-weight:500; font-size:48px; color:#F2D7AE;}
  .title-card .meta{font-family:var(--sans); font-weight:400; font-size:21px; letter-spacing:0.2em; color:#CFC6B5; margin-top:12px;}
  .blackout{position:absolute; inset:0; background:#000; z-index:40; opacity:0;}
</style>
<style>
  /* ===================== ACTION FILM LAYER =====================
     reel-action.html = reel-scenes.html's intro, watermark, captions and
     end card, plus an action engine: hard cuts with a whip-blur, camera
     shake, lightning that lights the whole frame, rocking boats, moving
     seas, punch-in captions, and close, rim-lit human figures. */
  section.scene{transition:opacity 0.14s linear !important;}
  .scene.active .l-back{animation:var(--kb-back) var(--dur,6s) cubic-bezier(.2,.7,.3,1) forwards;}
  .scene.active .l-front{animation:var(--kb-front) var(--dur,6s) cubic-bezier(.2,.7,.3,1) forwards;}
  .scene[data-kb="slam"]{--kb-back:slamB; --kb-front:slamF;}
  .scene[data-kb="crash"]{--kb-back:crashB; --kb-front:crashF;}
  .scene[data-kb="drift"]{--kb-back:driftB; --kb-front:driftF;}
  @keyframes slamB{0%{transform:scale(1.22)} 14%{transform:scale(1.06)} 100%{transform:scale(1.02)}}
  @keyframes slamF{0%{transform:scale(1.40)} 14%{transform:scale(1.10)} 100%{transform:scale(1.03)}}
  @keyframes crashB{0%{transform:scale(1.04) translateY(-30px)} 100%{transform:scale(1.14) translateY(20px)}}
  @keyframes crashF{0%{transform:scale(1.06) translateY(-90px) rotate(-2deg)} 100%{transform:scale(1.26) translateY(40px) rotate(1.5deg)}}
  @keyframes driftB{from{transform:scale(1.06) translate(10px,0)} to{transform:scale(1.10) translate(-14px,-10px)}}
  @keyframes driftF{from{transform:scale(1.08) translate(30px,0)} to{transform:scale(1.16) translate(-40px,-24px)}}

  /* camera rig: whip cut + shake live on #cam, scenes inside */
  #cam{position:absolute; inset:-40px; will-change:transform;}
  #cam.whip{animation:whip 0.26s cubic-bezier(.3,.7,.3,1);}
  @keyframes whip{0%{transform:translateX(110px) scale(1.06); filter:blur(18px) brightness(1.5);} 100%{transform:none; filter:none;}}
  body[data-shake="1"] #shake{animation:shk1 0.9s ease-in-out infinite;}
  body[data-shake="2"] #shake{animation:shk2 0.42s linear infinite;}
  body[data-shake="3"] #shake{animation:shk3 0.18s linear infinite;}
  #shake{position:absolute; inset:0; will-change:transform;}
  @keyframes shk1{0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-4px,3px) rotate(-.25deg)} 50%{transform:translate(3px,-2px) rotate(.2deg)} 75%{transform:translate(-2px,-4px) rotate(-.1deg)}}
  @keyframes shk2{0%{transform:translate(0,0) rotate(0)} 20%{transform:translate(-9px,6px) rotate(-.6deg)} 40%{transform:translate(8px,-7px) rotate(.5deg)} 60%{transform:translate(-6px,-8px) rotate(-.3deg)} 80%{transform:translate(7px,8px) rotate(.6deg)} 100%{transform:translate(0,0) rotate(0)}}
  @keyframes shk3{0%{transform:translate(0,0)} 25%{transform:translate(-16px,11px) rotate(-1deg)} 50%{transform:translate(14px,-13px) rotate(.9deg)} 75%{transform:translate(-11px,-15px) rotate(-.6deg)} 100%{transform:translate(0,0)}}
  /* lightning: white bloom over everything + the scene itself over-exposed */
  #flash{position:absolute; inset:0; z-index:11; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse 90% 70% at var(--fx,60%) var(--fy,20%), rgba(235,246,255,1) 0%, rgba(190,220,255,.55) 45%, rgba(150,190,240,.15) 100%); mix-blend-mode:screen;}
  #flash.on{animation:flash 0.55s ease-out;}
  @keyframes flash{0%{opacity:.95} 8%{opacity:.25} 14%{opacity:.85} 100%{opacity:0}}
  .scene.lit .layer{animation-play-state:running; filter:brightness(2.1) contrast(1.15) saturate(.7);}
  .scene .layer{transition:filter .45s ease-out;}
  #white{position:absolute; inset:0; z-index:19; background:#FFFDF6; opacity:0; pointer-events:none;}
  #white.on{animation:whiteout 1.6s ease-out;}
  @keyframes whiteout{0%{opacity:0} 6%{opacity:1} 30%{opacity:.9} 100%{opacity:0}}

  /* living elements inside scenes */
  .rock{transform-box:fill-box; transform-origin:50% 70%; animation:rock var(--rk,3.2s) ease-in-out infinite;}
  .rock.hard{animation:rockHard 1.5s ease-in-out infinite;}
  @keyframes rock{0%,100%{transform:rotate(-2.5deg) translateY(0)} 50%{transform:rotate(2.5deg) translateY(-10px)}}
  @keyframes rockHard{0%,100%{transform:rotate(-9deg) translateY(10px)} 50%{transform:rotate(8deg) translateY(-36px)}}
  .swell{animation:swell var(--sw,2.4s) ease-in-out infinite alternate;}
  @keyframes swell{from{transform:translate(0,0)} to{transform:translate(var(--swx,-60px), var(--swy,-26px))}}
  .roll{animation:roll var(--rl,5s) linear infinite;}
  @keyframes roll{from{transform:translateX(0)} to{transform:translateX(-540px)}}
  .flick{animation:flick 0.16s steps(2) infinite;}
  @keyframes flick{0%{opacity:1} 50%{opacity:.82}}
  .breathe{transform-box:fill-box; transform-origin:50% 100%; animation:breathe 4.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.006,1.018)}}
  .flap{transform-box:fill-box; transform-origin:0% 50%; animation:flap .5s ease-in-out infinite alternate;}
  @keyframes flap{from{transform:skewY(-4deg) scaleX(.97)} to{transform:skewY(5deg) scaleX(1.03)}}
  .hairwind{transform-box:fill-box; transform-origin:100% 50%; animation:hairwind .35s ease-in-out infinite alternate;}
  @keyframes hairwind{from{transform:skewY(-6deg)} to{transform:skewY(6deg) translateX(-8px)}}
  .glint{animation:glint 2.5s ease-in-out infinite;}
  @keyframes glint{0%,100%{opacity:.4} 50%{opacity:1}}
  .drip{animation:drip 1.1s linear infinite;}
  @keyframes drip{from{transform:translateY(-40px); opacity:0} 20%{opacity:.9} to{transform:translateY(260px); opacity:0}}

  /* streaking rain on glass (car shots) */
  .glass-rain{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .glass-rain i{position:absolute; width:5px; border-radius:4px; background:linear-gradient(to bottom, rgba(220,240,255,0), rgba(220,240,255,.55)); animation:streak var(--t,2s) linear var(--d,0s) infinite;}
  @keyframes streak{from{transform:translateY(-120px)} to{transform:translateY(900px)}}
  .p.spray{border-radius:50%; filter:blur(1px);}
  .p.rain.heavy{width:3px !important;}

  /* punch-in captions */
  .caption-wrap{bottom:250px; padding:0 70px;}
  .cap-line{font-family:var(--sans); font-weight:600; font-size:58px; line-height:1.18; letter-spacing:-0.5px; color:#FFFFFF;
    text-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 40px rgba(0,0,0,.75);}
  .cap-line .w{display:inline-block; opacity:0; transform:translateY(24px) scale(1.25); filter:blur(8px);
    animation:wpop .42s cubic-bezier(.2,1.3,.4,1) forwards; animation-delay:calc(var(--i) * 55ms);}
  @keyframes wpop{to{opacity:1; transform:none; filter:none;}}
  .cap-line .w.hot{color:var(--accent);}
  .cap-line.scripture{font-family:var(--serif); font-style:italic; font-weight:600; font-size:70px; line-height:1.14; letter-spacing:0; color:#FFF6E2;}
  .cap-line.scripture .w{animation-duration:.7s; animation-delay:calc(var(--i) * 70ms); transform:translateY(10px); filter:blur(14px);}
  .cap-line.big{font-size:96px; line-height:1.02; text-transform:uppercase; letter-spacing:1px; font-weight:700;}
  .cap-line.big .w{animation:wslam .34s cubic-bezier(.2,1.6,.4,1) forwards; animation-delay:calc(var(--i) * 90ms); transform:scale(2.6);}
  @keyframes wslam{to{opacity:1; transform:none; filter:none;}}
  .cap-shade{height:900px; background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.45) 42%, rgba(0,0,0,0) 100%);}

  body[data-shot="dusk"]{--accent:#FFB76B;} body[data-shot="setout"]{--accent:#FFC98A;}
  body[data-shot="cloudwall"]{--accent:#A8C8FF;} body[data-shot="bolt"]{--accent:#E8F4FF;}
  body[data-shot="wave"]{--accent:#8FE0F0;} body[data-shot="deck"]{--accent:#9FD8F0;}
  body[data-shot="hands"]{--accent:#B8E4F4;} body[data-shot="face"]{--accent:#DDEEFF;}
  body[data-shot="sleep"]{--accent:#FFC27A;} body[data-shot="wake"]{--accent:#FFD08A;}
  body[data-shot="rise"]{--accent:#E8F0FF;} body[data-shot="command"]{--accent:#FFE6A0;}
  body[data-shot="calm"]{--accent:#C9D8FF;} body[data-shot="awe"]{--accent:#F2E3C0;}
  body[data-shot="car"]{--accent:#FF8A6B;} body[data-shot="carDawn"]{--accent:#FFC98A;}
  body[data-shot="sunrise"]{--accent:#FFE2A0;}
</style>
</head>

<script>
(function () {
  // Film grain: one noise tile, jittered by CSS (cheap, composited).
  try {
    var c = document.createElement("canvas");
    c.width = c.height = 220;
    var x = c.getContext("2d");
    var img = x.createImageData(220, 220);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
  } catch (e) {}

  // God rays.
  var NS = "http://www.w3.org/2000/svg";
  document.querySelectorAll("g.rays-gen").forEach(function (g) {
    var cx = +g.dataset.cx, cy = +g.dataset.cy, n = +g.dataset.n, len = +g.dataset.len, w = +g.dataset.w;
    for (var k = 0; k < n; k++) {
      var a = (k / n) * Math.PI * 2 + (k % 2 ? 0.05 : 0);
      var ww = (w * (k % 3 === 0 ? 1.6 : 1)) * Math.PI / 180;
      var p1x = cx + len * Math.cos(a - ww), p1y = cy + len * Math.sin(a - ww);
      var p2x = cx + len * Math.cos(a + ww), p2y = cy + len * Math.sin(a + ww);
      var poly = document.createElementNS(NS, "polygon");
      poly.setAttribute("points", cx + "," + cy + " " + p1x.toFixed(1) + "," + p1y.toFixed(1) + " " + p2x.toFixed(1) + "," + p2y.toFixed(1));
      g.appendChild(poly);
    }
  });

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // Particles.
  document.querySelectorAll(".fx").forEach(function (fx) {
    var type = fx.dataset.type, n = +(fx.dataset.n || 30);
    var color = fx.dataset.color;
    if (fx.dataset.area) {
      var ar = fx.dataset.area.split(",").map(Number);
      fx.style.left = ar[0] + "px"; fx.style.top = ar[1] + "px";
      fx.style.width = ar[2] + "px"; fx.style.height = ar[3] + "px";
      fx.style.right = "auto"; fx.style.bottom = "auto";
    }
    var W = fx.dataset.area ? +fx.dataset.area.split(",")[2] : 1080;
    var H = fx.dataset.area ? +fx.dataset.area.split(",")[3] : 1920;
    for (var i = 0; i < n; i++) {
      var p = document.createElement("span");
      p.className = "p " + type;
      var s, t, dx, dy, o, left, top, bg;
      if (type === "dust") {
        s = rnd(2, 5); t = rnd(14, 26); dx = rnd(-160, 160); dy = rnd(-220, -40); o = rnd(0.35, 0.8);
        left = rnd(0, W); top = rnd(500, H); bg = "rgba(" + (color || "255,214,160") + ",1)";
      } else if (type === "motes") {
        s = rnd(3, 8); t = rnd(10, 20); dx = rnd(-80, 80); dy = rnd(-520, -240); o = rnd(0.45, 0.95);
        left = rnd(60, W - 60); top = rnd(800, H); bg = "radial-gradient(circle, rgba(" + (color || "255,236,180") + ",1) 0%, rgba(" + (color || "255,236,180") + ",0) 70%)";
        s *= 2.2;
      } else if (type === "ash") {
        s = rnd(3, 7); t = rnd(12, 22); dx = rnd(-140, 140); dy = rnd(700, 1100); o = rnd(0.35, 0.75);
        left = rnd(0, W); top = rnd(-200, 900); bg = "rgba(" + (color || "190,186,180") + ",1)";
      } else if (type === "ember") {
        s = rnd(2, 5); t = rnd(6, 12); dx = rnd(-120, 120); dy = rnd(-900, -500); o = rnd(0.6, 1);
        left = rnd(80, 700); top = rnd(1400, 1800); bg = "rgba(255," + Math.round(rnd(110, 170)) + ",60,1)";
        p.style.boxShadow = "0 0 8px rgba(255,120,40,0.9)";
      } else if (type === "star") {
        s = rnd(1.2, 3.4); t = rnd(1.6, 4.5); o = rnd(0.5, 1);
        left = rnd(0, W); top = rnd(0, H); bg = "#F4F6FF";
        if (Math.random() < 0.12) { s += 1.2; p.style.boxShadow = "0 0 6px rgba(200,214,255,0.9)"; }
      } else if (type === "rain") {
        s = 2; t = rnd(0.7, 1.3); dx = rnd(-30, -10); dy = H + 140; o = rnd(0.25, 0.55);
        left = rnd(0, W); top = rnd(-160, -60);
        bg = "linear-gradient(to bottom, rgba(170,230,240,0) 0%, rgba(170,230,240,1) 100%)";
        p.style.height = rnd(40, 90) + "px";
      } else if (type === "bokeh") {
        s = rnd(40, 140); t = rnd(5, 11); o = rnd(0.25, 0.6);
        left = rnd(-40, W - 40); top = rnd(H * 0.25, H - 40);
        var warm = Math.random() < 0.5;
        bg = "radial-gradient(circle, " + (warm ? "rgba(255,190,110,0.9)" : "rgba(110,215,230,0.9)") + " 0%, rgba(0,0,0,0) 68%)";
      } else if (type === "smoke") {
        s = rnd(420, 760); t = rnd(26, 40); dx = rnd(-120, 120); dy = rnd(-420, -220); o = rnd(0.25, 0.45);
        left = rnd(-200, W - 300); top = rnd(500, 1300);
        bg = "radial-gradient(circle, rgba(96,94,92,0.75) 0%, rgba(60,60,60,0) 66%)";
      }
      p.style.width = s + "px";
      if (!p.style.height) p.style.height = s + "px";
      p.style.left = left + "px"; p.style.top = top + "px";
      p.style.background = bg;
      p.style.setProperty("--t", t + "s");
      p.style.setProperty("--d", (-Math.random() * t).toFixed(2) + "s");
      p.style.setProperty("--o", o);
      if (dx !== undefined) p.style.setProperty("--dx", dx + "px");
      if (dy !== undefined) p.style.setProperty("--dy", dy + "px");
      fx.appendChild(p);
    }
  });

  // Birds crossing the sunrise.
  var birds = document.getElementById("birds");
  if (birds) {
    for (var b = 0; b < 7; b++) {
      var d = document.createElement("div");
      d.className = "bird";
      var sz = rnd(18, 34);
      d.innerHTML = '<svg width="' + sz + '" height="' + (sz * 0.5) + '" viewBox="0 0 40 20"><path d="M 0 6 C 8 0 14 2 20 12 C 26 2 32 0 40 6 C 32 4 26 8 20 16 C 14 8 8 4 0 6 Z" fill="#3A2A3A"/></svg>';
      d.style.left = rnd(900, 1400) + "px";
      d.style.top = rnd(520, 900) + "px";
      d.style.setProperty("--t", rnd(34, 52) + "s");
      d.style.setProperty("--d", (-rnd(0, 30)).toFixed(1) + "s");
      d.style.setProperty("--dx", -rnd(1300, 1700) + "px");
      d.style.setProperty("--dy", -rnd(60, 220) + "px");
      birds.appendChild(d);
    }
  }
})();
</script>
<script>
// Action engine: reacts to generate-reel.js switching scenes (body[data-shot])
// and captions (#capLine) - hard whip cuts, camera shake, lightning, white-out
// and word-by-word punch-in captions. All timing is relative to the cut, so
// social/sfx.js can place thunder and impacts on exactly the same beats.
(function () {
  var body = document.body, cam = document.getElementById("cam");
  var flash = document.getElementById("flash"), white = document.getElementById("white");
  var timers = [];
  function later(fn, s) { timers.push(setTimeout(fn, s * 1000)); }
  function bolt(scene, fx) {
    if (fx) { var p = fx.split(","); flash.style.setProperty("--fx", p[0]); flash.style.setProperty("--fy", p[1]); }
    flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
    scene.classList.add("lit"); setTimeout(function () { scene.classList.remove("lit"); }, 160);
  }
  new MutationObserver(function () {
    var key = body.dataset.shot; if (!key) return;
    var scene = document.querySelector('section[data-scene="' + key + '"]'); if (!scene) return;
    timers.forEach(clearTimeout); timers = [];
    body.dataset.shake = scene.dataset.shake || "0";
    cam.classList.remove("whip"); void cam.offsetWidth; cam.classList.add("whip");
    (scene.dataset.flash || "").split(",").filter(Boolean).forEach(function (t) { later(function () { bolt(scene, scene.dataset.fx); }, +t); });
    if (scene.dataset.white) later(function () { white.classList.remove("on"); void white.offsetWidth; white.classList.add("on"); }, +scene.dataset.white);
  }).observe(body, { attributes: true, attributeFilter: ["data-shot"] });

  var cap = document.getElementById("capLine");
  new MutationObserver(function () {
    if (cap.dataset.wrapped === cap.innerHTML) return;
    var i = 0, plain = cap.textContent.trim();
    var big = !cap.classList.contains("scripture") && plain.length <= 16;
    cap.classList.toggle("big", big);
    (function wrap(node, hot) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 3) {
          var frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(function (part) {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
            var s = document.createElement("span"); s.className = "w" + (hot ? " hot" : ""); s.style.setProperty("--i", i++); s.textContent = part; frag.appendChild(s);
          });
          node.replaceChild(frag, n);
        } else if (n.nodeType === 1 && !n.classList.contains("w")) wrap(n, hot || n.tagName === "B");
      });
    })(cap, false);
    cap.dataset.wrapped = cap.innerHTML;
  }).observe(cap, { childList: true });

  document.querySelectorAll(".glass-rain").forEach(function (g) {
    for (var k = 0; k < 46; k++) {
      var d = document.createElement("i");
      d.style.left = (Math.random() * 1080) + "px"; d.style.top = (Math.random() * 600 - 100) + "px";
      d.style.height = (30 + Math.random() * 90) + "px"; d.style.opacity = (0.3 + Math.random() * 0.6).toFixed(2);
      d.style.setProperty("--t", (1.4 + Math.random() * 2.2).toFixed(2) + "s"); d.style.setProperty("--d", (-Math.random() * 3).toFixed(2) + "s");
      g.appendChild(d);
    }
    for (var m = 0; m < 70; m++) {
      var b = document.createElement("b");
      b.style.cssText = "position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.7), rgba(180,210,240,.15) 60%, rgba(0,0,0,0) 70%);";
      var s = 6 + Math.random() * 16; b.style.width = b.style.height = s + "px";
      b.style.left = (Math.random() * 1080) + "px"; b.style.top = (Math.random() * 1100) + "px";
      g.appendChild(b);
    }
  });
})();
</script>
