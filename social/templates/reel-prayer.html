<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Daily Prayer Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Poppins:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    --ink:#2B2420;
    --ink-2:#4A4038;
    --ink-3:#8C7A52;
    --gold:#A9824F;
    --gold-light:#C8A24A;
    --gold-dark:#8E6A2E;
    --border:rgba(43,36,32,0.14);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Poppins', -apple-system, system-ui, sans-serif;
    /* "Cinematic" easing - a soft, premium deceleration (easeOutQuint)
       instead of plain linear/ease, used for every kinetic-text reveal
       below so motion feels directed rather than default-CSS. */
    --ease-cinema: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1920px; overflow:hidden;}
  body{
    font-family:var(--font-body);
    background: radial-gradient(ellipse 1400px 1000px at 50% 8%, #FFFDF8 0%, #FBF4E3 42%, #F3E7C9 100%);
    color:var(--ink);
    position:relative;
  }
  .texture{position:absolute; inset:0; background-image:radial-gradient(#E9DFC4 1.5px, transparent 1.5px); background-size:30px 30px; opacity:0.07;}

  /* Slow continuous drift on the whole scene - a cheap, classic
     "Ken Burns" move that keeps a static-content frame feeling alive
     on camera instead of looking like a still card. Independent of
     any content timing, so it just runs free the whole video. */
  .scene{position:absolute; inset:0; transform-origin:50% 42%;
    animation: kenBurns 22s var(--ease-cinema) infinite alternate;}
  @keyframes kenBurns{ from{transform:scale(1.0);} to{transform:scale(1.045);} }

  /* Soft dark vignette so the warm card reads with more depth / contrast,
     like a graded shot rather than a flat screenshot. */
  .vignette{position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse 1300px 1700px at 50% 50%, transparent 55%, rgba(30,22,12,0.16) 100%);}

  /* Soft sunburst rays radiating from behind the header mark */
  .sunburst{position:absolute; top:-120px; left:50%; width:1500px; height:1500px; margin-left:-750px;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(169,130,79,0.14) 3deg, transparent 7deg, transparent 20deg, rgba(169,130,79,0.11) 23deg, transparent 27deg, transparent 40deg, rgba(169,130,79,0.13) 43deg, transparent 47deg, transparent 60deg, rgba(169,130,79,0.1) 63deg, transparent 67deg, transparent 80deg, rgba(169,130,79,0.12) 83deg, transparent 87deg, transparent 100deg, rgba(169,130,79,0.1) 103deg, transparent 107deg, transparent 360deg);
    border-radius:50%;
    animation: rotateSlow 90s linear infinite;
    opacity:0.85;
  }
  @keyframes rotateSlow{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* Drifting light embers rising through the frame */
  .ember{position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(201,162,74,0.9) 0%, rgba(201,162,74,0) 70%); opacity:0; filter:blur(0.5px);}
  .e1{width:14px; height:14px; left:12%; bottom:-40px; animation: rise 9s ease-in infinite; animation-delay:0.4s;}
  .e2{width:9px; height:9px; left:78%; bottom:-40px; animation: rise 11s ease-in infinite; animation-delay:2.1s;}
  .e3{width:18px; height:18px; left:48%; bottom:-40px; animation: rise 10s ease-in infinite; animation-delay:4.4s;}
  .e4{width:11px; height:11px; left:28%; bottom:-40px; animation: rise 8.5s ease-in infinite; animation-delay:1.3s;}
  .e5{width:13px; height:13px; left:88%; bottom:-40px; animation: rise 9.5s ease-in infinite; animation-delay:5.8s;}
  .e6{width:8px; height:8px; left:62%; bottom:-40px; animation: rise 12s ease-in infinite; animation-delay:3.2s;}
  @keyframes rise{
    0%{opacity:0; transform:translateY(0) translateX(0);}
    12%{opacity:0.9;}
    85%{opacity:0.5;}
    100%{opacity:0; transform:translateY(-1850px) translateX(40px);}
  }

  /* Open book, radiating light — faint, large-scale, anchored low */
  .book-art{position:absolute; left:50%; bottom:-180px; width:1000px; height:620px; margin-left:-500px; opacity:0.1;}

  .stage{position:relative; width:100%; height:100%; display:flex; flex-direction:column; padding:96px 84px;}

  /* .head, .kicker, .line, .endcard intentionally have NO `animation`
     property here — generate-reel.js sets the longhand animation-*
     properties (including the real delay, computed from the actual
     voiceover length) via JS right after load. Baking a delay-less
     `animation` shorthand into the stylesheet would make these start
     fading in at page-load time, before the script gets a chance to
     set the real delay. Only their static resting state (opacity:0,
     and a transform for the slide-up ones) lives in CSS. */
  .head{display:flex; align-items:center; gap:22px; opacity:0; filter:blur(10px); transform:translateY(16px) scale(0.97);}
  .mark{width:72px; height:72px; flex-shrink:0;}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:36px; color:var(--ink); letter-spacing:-0.3px;}
  .brand-sub{font-size:16px; color:var(--ink-3); font-weight:700; margin-top:4px; letter-spacing:1.5px; text-transform:uppercase;}

  /* Kicker gets a punchier "title-card" reveal: starts wide-tracked and
     slightly blurred, snaps into its tight final letter-spacing - a
     common kinetic-type move for section headers in edited video. */
  .kicker{margin-top:56px; font-size:19px; font-weight:800; letter-spacing:0.5em; text-transform:uppercase; color:var(--gold);
    opacity:0; filter:blur(6px);}

  .prayer{flex:1; display:flex; flex-direction:column; justify-content:center; margin-top:28px;}
  .line{font-family:var(--font-body); font-size:50px; line-height:1.42; font-weight:500; color:var(--ink); margin:0 0 30px;
    opacity:0; filter:blur(14px); transform:translateY(34px) scale(0.95);}
  .line b{font-weight:800; color:#7A3B36; text-shadow:0 0 18px rgba(169,130,79,0.35);}
  .line.opener{font-family:var(--font-display); font-style:italic; font-weight:600; color:#5B4B2A; font-size:42px; line-height:1.4;}

  .endcard{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    background:radial-gradient(ellipse 1400px 1000px at 50% 8%, #FFFDF8 0%, #FBF4E3 42%, #F3E7C9 100%);
    opacity:0; transform:scale(1.04); text-align:center; padding:0 90px;}
  .endcard .mark2{width:110px; height:110px; animation: markGlow 2.4s ease-in-out infinite; animation-delay:1s;}
  .endcard h2{font-family:var(--font-display); font-weight:700; font-size:46px; color:var(--ink); margin-top:10px;}
  .endcard p.cta{font-family:var(--font-body); font-size:27px; font-weight:600; color:var(--ink-2); max-width:820px; line-height:1.5;}
  .endcard .handle{font-family:var(--font-body); font-size:30px; font-weight:800; color:var(--gold-dark); letter-spacing:0.02em;}
  .endcard .site{font-family:var(--font-body); font-size:24px; font-weight:600; color:var(--ink-3);}

  @keyframes fadeUp{
    0%{opacity:0; filter:blur(14px); transform:translateY(34px) scale(0.95);}
    60%{opacity:1; filter:blur(0px);}
    100%{opacity:1; filter:blur(0px); transform:translateY(0) scale(1);}
  }
  @keyframes kickerPop{
    0%{opacity:0; filter:blur(6px); letter-spacing:0.5em;}
    100%{opacity:1; filter:blur(0px); letter-spacing:0.24em;}
  }
  @keyframes fadeIn{ from{opacity:0; transform:scale(1.04);} to{opacity:1; transform:scale(1);} }
  @keyframes markGlow{ 0%,100%{filter:drop-shadow(0 0 0px rgba(200,162,74,0));} 50%{filter:drop-shadow(0 0 18px rgba(200,162,74,0.55));} }

  /* ---- Opening: "reaching every nation" global network ---- */
  .intro{position:absolute; inset:0; z-index:5; background:radial-gradient(ellipse 1300px 1300px at 50% 42%, #2A1F14 0%, #150F0A 70%, #0E0A07 100%);
    display:flex; align-items:center; justify-content:center;
    animation: introFadeOut 0.9s ease forwards; animation-delay:3.5s;}
  .intro svg{width:1080px; height:1920px; position:absolute; top:0; left:0; overflow:visible;}
  .beam{opacity:0; stroke-width:3; stroke-dasharray:440; stroke-dashoffset:440; stroke-linecap:round;
    animation: drawBeam 0.7s var(--ease-cinema) forwards;}
  .node{opacity:0; transform-origin:center; animation: popNode 0.5s var(--ease-cinema) forwards;}
  .n1{animation-delay:0.15s;} .n2{animation-delay:0.26s;} .n3{animation-delay:0.37s;}
  .n4{animation-delay:0.48s;} .n5{animation-delay:0.59s;} .n6{animation-delay:0.70s;}
  .n7{animation-delay:0.81s;} .n8{animation-delay:0.92s;} .n9{animation-delay:1.03s;}
  .n10{animation-delay:1.14s;} .n11{animation-delay:1.25s;} .n12{animation-delay:1.36s;}
  @keyframes drawBeam{ from{opacity:0.9; stroke-dashoffset:440;} to{opacity:0.55; stroke-dashoffset:0;} }
  @keyframes popNode{ 0%{opacity:0; transform:scale(0);} 60%{opacity:1; transform:scale(1.35);} 100%{opacity:1; transform:scale(1);} }

  .orbit-ring{fill:none; stroke:rgba(243,217,138,0.18); stroke-width:1.5; opacity:0;
    animation: ringFade 1s var(--ease-cinema) forwards; animation-delay:1.5s;}
  @keyframes ringFade{ from{opacity:0; transform:scale(0.85);} to{opacity:1; transform:scale(1);} }

  .core-glow{opacity:0; animation: coreGrow 0.8s var(--ease-cinema) forwards; animation-delay:1.9s;}
  @keyframes coreGrow{ from{opacity:0; transform:scale(0.3);} to{opacity:1; transform:scale(1);} }

  .intro-mark{position:absolute; left:50%; top:820px; transform:translate(-50%,-50%) scale(0); width:100px; height:100px;
    animation: markPop 0.6s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay:2.1s;}
  @keyframes markPop{ from{transform:translate(-50%,-50%) scale(0); opacity:0;} to{transform:translate(-50%,-50%) scale(1); opacity:1;} }

  .intro-title{position:absolute; left:0; right:0; top:1000px; text-align:center; opacity:0;
    animation: fadeUp 0.9s var(--ease-cinema) forwards; animation-delay:2.5s;}
  .intro-title .name{font-family:var(--font-display); font-weight:700; font-size:50px; color:#FBEFD2; letter-spacing:-0.3px;}
  .intro-title .tag{font-family:var(--font-body); font-size:19px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#C8A24A; margin-top:14px;}

  @keyframes introFadeOut{ from{opacity:1; visibility:visible;} to{opacity:0; visibility:hidden;} }
</style>
</head>
<body>
  <!--
    This is a RENDER-ONLY template — all variable content (kicker,
    brand sub-label, prayer lines, per-line animation timing, end-card
    CTA/handle/site) is injected by social/generate-reel.js via
    page.evaluate() after load, the same pattern generate-prayer-post.js
    uses for the static card template. Nothing here needs {{PLACEHOLDER}}
    string replacement.

    Timeline (seconds from page load), all driven by JS at render time:
      0.0 -> intro starts (12-nation network draw-in, converges to mark)
      INTRO_DURATION -> intro fades out, .head/.kicker fade in
      INTRO_DURATION + per-line offset -> each .line fades in, timed
        proportionally to how long that line takes to actually SAY in
        the generated voiceover audio (so text and voice stay in sync)
      total duration - END_CARD_DURATION -> .endcard fades in over the
        scene
  -->
  <div class="intro">
    <svg viewBox="0 0 1080 1920">
      <circle class="orbit-ring" cx="540" cy="820" r="420"/>
      <circle class="orbit-ring" cx="540" cy="820" r="300" style="animation-delay:1.65s;"/>
      <line class="beam n1" x1="540" y1="820" x2="540.0" y2="400.0" stroke="#C8A24A"/>
      <line class="beam n2" x1="540" y1="820" x2="750.0" y2="456.3" stroke="#B5603F"/>
      <line class="beam n3" x1="540" y1="820" x2="903.7" y2="610.0" stroke="#3F7D78"/>
      <line class="beam n4" x1="540" y1="820" x2="960.0" y2="820.0" stroke="#6F8C7D"/>
      <line class="beam n5" x1="540" y1="820" x2="903.7" y2="1030.0" stroke="#7A3B36"/>
      <line class="beam n6" x1="540" y1="820" x2="750.0" y2="1183.7" stroke="#3D5A80"/>
      <line class="beam n7" x1="540" y1="820" x2="540.0" y2="1240.0" stroke="#C99A3E"/>
      <line class="beam n8" x1="540" y1="820" x2="330.0" y2="1183.7" stroke="#D97B5A"/>
      <line class="beam n9" x1="540" y1="820" x2="176.3" y2="1030.0" stroke="#3F6B4A"/>
      <line class="beam n10" x1="540" y1="820" x2="120.0" y2="820.0" stroke="#6B4A7A"/>
      <line class="beam n11" x1="540" y1="820" x2="176.3" y2="610.0" stroke="#B85C7A"/>
      <line class="beam n12" x1="540" y1="820" x2="330.0" y2="456.3" stroke="#8E6A2E"/>
      <circle class="node n1" cx="540.0" cy="400.0" r="14" fill="#C8A24A"/>
      <circle class="node n2" cx="750.0" cy="456.3" r="14" fill="#B5603F"/>
      <circle class="node n3" cx="903.7" cy="610.0" r="14" fill="#3F7D78"/>
      <circle class="node n4" cx="960.0" cy="820.0" r="14" fill="#6F8C7D"/>
      <circle class="node n5" cx="903.7" cy="1030.0" r="14" fill="#7A3B36"/>
      <circle class="node n6" cx="750.0" cy="1183.7" r="14" fill="#3D5A80"/>
      <circle class="node n7" cx="540.0" cy="1240.0" r="14" fill="#C99A3E"/>
      <circle class="node n8" cx="330.0" cy="1183.7" r="14" fill="#D97B5A"/>
      <circle class="node n9" cx="176.3" cy="1030.0" r="14" fill="#3F6B4A"/>
      <circle class="node n10" cx="120.0" cy="820.0" r="14" fill="#6B4A7A"/>
      <circle class="node n11" cx="176.3" cy="610.0" r="14" fill="#B85C7A"/>
      <circle class="node n12" cx="330.0" cy="456.3" r="14" fill="#8E6A2E"/>
      <circle class="core-glow" cx="540" cy="820" r="54" fill="#F3D98A" opacity="0.18"/>
    </svg>
    <svg class="intro-mark" viewBox="0 0 48 48">
      <defs>
        <linearGradient id="introGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F3D98A"/>
          <stop offset="1" stop-color="#C8A24A"/>
        </linearGradient>
      </defs>
      <circle cx="24" cy="24" r="21.3" fill="none" stroke="#F3D98A" stroke-width="1.2"/>
      <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="url(#introGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="#F3D98A"/>
    </svg>
    <div class="intro-title">
      <div class="name">Word &amp; Faith Network</div>
      <div class="tag">Reaching Every Nation</div>
    </div>
  </div>

  <div class="scene">
  <div class="texture"></div>
  <div class="sunburst"></div>
  <div class="ember e1"></div>
  <div class="ember e2"></div>
  <div class="ember e3"></div>
  <div class="ember e4"></div>
  <div class="ember e5"></div>
  <div class="ember e6"></div>

  <svg class="book-art" viewBox="0 0 400 248" fill="none">
    <defs>
      <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8E6A2E"/>
        <stop offset="1" stop-color="#5B4B2A"/>
      </linearGradient>
      <radialGradient id="lightGrad" cx="50%" cy="0%" r="75%">
        <stop offset="0" stop-color="#F3D98A" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#F3D98A" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path d="M200 40 L200 220" stroke="url(#bookGrad)" stroke-width="3"/>
    <path d="M200 40 C150 24 90 24 40 44 L40 206 C90 186 150 186 200 206 Z" fill="none" stroke="url(#bookGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M200 40 C250 24 310 24 360 44 L360 206 C310 186 250 186 200 206 Z" fill="none" stroke="url(#bookGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M60 70 C100 58 150 58 185 72" stroke="url(#bookGrad)" stroke-width="2" opacity="0.6"/>
    <path d="M60 96 C100 84 150 84 185 98" stroke="url(#bookGrad)" stroke-width="2" opacity="0.6"/>
    <path d="M60 122 C100 110 150 110 185 124" stroke="url(#bookGrad)" stroke-width="2" opacity="0.6"/>
    <path d="M215 72 C250 58 300 58 340 70" stroke="url(#bookGrad)" stroke-width="2" opacity="0.6"/>
    <path d="M215 98 C250 84 300 84 340 96" stroke="url(#bookGrad)" stroke-width="2" opacity="0.6"/>
    <path d="M215 124 C250 110 300 110 340 122" stroke="url(#bookGrad)" stroke-width="2" opacity="0.6"/>
    <path d="M200 -40 L160 44 L240 44 Z" fill="url(#lightGrad)"/>
    <path d="M200 -60 L120 44 L280 44 Z" fill="url(#lightGrad)" opacity="0.6"/>
  </svg>

  <div class="stage">
    <div class="head">
      <svg class="mark" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#C8A24A"/>
            <stop offset="1" stop-color="#8E6A2E"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="21.3" fill="none" stroke="#A9824F" stroke-width="1.1"/>
        <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="url(#grad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="#C8A24A"/>
      </svg>
      <div>
        <div class="brand-name">Word &amp; Faith Network</div>
        <div class="brand-sub" id="brandSub">Daily Prayer</div>
      </div>
    </div>

    <div class="kicker" id="kicker">Today&rsquo;s Prayer</div>

    <div class="prayer" id="prayerLines"><!-- .line divs injected by generate-reel.js --></div>
  </div>
  </div><!-- /.scene -->

  <div class="vignette"></div>

  <div class="endcard">
    <svg class="mark2" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21.3" fill="none" stroke="#A9824F" stroke-width="1.1"/>
      <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="#A9824F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="#C8A24A"/>
    </svg>
    <h2>Word &amp; Faith Network</h2>
    <p class="cta" id="ctaLine">Save this. Share this. Someone you know is carrying the exact same weight today.</p>
    <div class="handle" id="handle">@wordfaithnetwork</div>
    <div class="site" id="site">wfnglobal.org</div>
  </div>
</body>
</html>
