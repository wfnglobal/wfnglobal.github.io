<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Scene Film</title>
<!--
  Scene-based "short film" template. Unlike reel-cinematic.html (one
  theme + small abstract motifs), every scene here is its own fully
  illustrated world with its own colour grade, atmosphere and camera
  move, so a single film changes look as its story moves:

    valley    - dusk desert valley, lone traveller, teal + amber
    habakkuk  - burnt-orange hillside, dead vines, withered fig, prophet with staff
    rejoice   - same prophet, arms raised, gold light breaking through cloud
    job       - grey ash-heap ruins, broken columns, embers, seated figure
    david     - moonlit Jerusalem rooftop, indigo + silver, lyre on the parapet
    three     - three figures on three peaks under a rose/violet dawn
    everyman  - modern man at a table by a rain-streaked city window, teal + amber
    heights   - a hind on a mountain spire above a sea of clouds at sunrise

  Each scene is built from layers (l-back / l-front) that get different
  Ken Burns moves for a 2.5D parallax camera, plus an HTML particle layer
  (.fx) for dust / ash / embers / stars / rain / bokeh / motes / smoke.
  Only composited transforms/opacity animate - the SVG artwork itself is
  static - so Chromium can record smoothly in real time.

  generate-reel.js drives it via content.json "template": "scenes": each
  line's "visual" is a scene key above, optional "chapter":{num,name,ref}
  shows a chapter card as that scene opens, and "scripture": true sets
  the line in the italic scripture face.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  :root{
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --serif:'Cormorant Garamond', 'Times New Roman', Georgia, serif;
    --sans:'Poppins', -apple-system, system-ui, sans-serif;
    --accent:#E8C79A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1920px; overflow:hidden; background:#000;}
  body{font-family:var(--sans); color:#F5EFE4; position:relative;}

  body[data-shot="valley"]{--accent:#F0B06A;}
  body[data-shot="habakkuk"]{--accent:#FF9F5A;}
  body[data-shot="rejoice"]{--accent:#FFE2A0;}
  body[data-shot="job"]{--accent:#FF8A4C;}
  body[data-shot="david"]{--accent:#B4C6FF;}
  body[data-shot="three"]{--accent:#FFB3C2;}
  body[data-shot="everyman"]{--accent:#7FD3DE;}
  body[data-shot="heights"]{--accent:#FFD9A0;}

  #stage{position:absolute; inset:0; overflow:hidden;}
  /* Only the live scene(s) exist in the render tree at all - keeping all
     eight scenes' full-frame layers alive at once exhausts the
     compositor in headless Chromium and the frame goes black. */
  .scene{position:absolute; inset:0; opacity:0; overflow:hidden; display:none;}
  .scene.live{display:block;}
  .layer{position:absolute; inset:0; transform-origin:var(--ox,50%) var(--oy,50%);}
  .scene.live .layer{will-change:transform;}
  .layer svg, .drift svg, .spin svg{position:absolute; left:0; top:0; width:1080px; height:1920px; display:block; overflow:visible;}
  .drift{position:absolute; inset:0; animation:drift var(--ddur,40s) ease-in-out infinite alternate;}
  .spin{position:absolute; inset:0; transform-origin:var(--rx,540px) var(--ry,960px); animation:spin var(--sdur,90s) linear infinite;}
  @keyframes drift{from{transform:translateX(0)} to{transform:translateX(var(--drift,-60px))}}
  @keyframes spin{from{transform:rotate(-4deg)} to{transform:rotate(4deg)}}

  /* Camera moves. Back layer moves less than front = parallax depth. */
  .scene.active .l-back{animation:var(--kb-back) var(--dur,20s) linear forwards;}
  .scene.active .l-front{animation:var(--kb-front) var(--dur,20s) linear forwards;}
  .scene[data-kb="push"]{--kb-back:pushB; --kb-front:pushF;}
  .scene[data-kb="pull"]{--kb-back:pullB; --kb-front:pullF;}
  .scene[data-kb="panl"]{--kb-back:panlB; --kb-front:panlF;}
  .scene[data-kb="panr"]{--kb-back:panrB; --kb-front:panrF;}
  .scene[data-kb="rise"]{--kb-back:riseB; --kb-front:riseF;}
  @keyframes pushB{from{transform:scale(1.03)} to{transform:scale(1.10)}}
  @keyframes pushF{from{transform:scale(1.04)} to{transform:scale(1.18)}}
  @keyframes pullB{from{transform:scale(1.12)} to{transform:scale(1.03)}}
  @keyframes pullF{from{transform:scale(1.22)} to{transform:scale(1.04)}}
  @keyframes panlB{from{transform:scale(1.10) translateX(26px)} to{transform:scale(1.10) translateX(-26px)}}
  @keyframes panlF{from{transform:scale(1.14) translateX(60px)} to{transform:scale(1.14) translateX(-60px)}}
  @keyframes panrB{from{transform:scale(1.10) translateX(-26px)} to{transform:scale(1.10) translateX(26px)}}
  @keyframes panrF{from{transform:scale(1.14) translateX(-60px)} to{transform:scale(1.14) translateX(60px)}}
  @keyframes riseB{from{transform:scale(1.08) translateY(30px)} to{transform:scale(1.08) translateY(-24px)}}
  @keyframes riseF{from{transform:scale(1.13) translateY(70px)} to{transform:scale(1.13) translateY(-46px)}}


  /* Particles */
  .fx{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .p{position:absolute; border-radius:50%; will-change:transform, opacity; opacity:0;
     animation:pMove var(--t,20s) linear var(--d,0s) infinite;}
  @keyframes pMove{
    0%{transform:translate(0,0); opacity:0;}
    15%{opacity:var(--o,0.8);}
    85%{opacity:var(--o,0.8);}
    100%{transform:translate(var(--dx,0px), var(--dy,0px)); opacity:0;}
  }
  .p.star{animation:twinkle var(--t,3s) ease-in-out var(--d,0s) infinite alternate;}
  @keyframes twinkle{from{opacity:0.15;} to{opacity:var(--o,1);}}
  .p.rain{border-radius:2px;}
  .p.bokeh{animation:bokeh var(--t,8s) ease-in-out var(--d,0s) infinite alternate;}
  @keyframes bokeh{from{opacity:calc(var(--o,0.5) * 0.4); transform:scale(0.9);} to{opacity:var(--o,0.5); transform:scale(1.08);}}

  /* Birds */
  .birds{position:absolute; inset:0; pointer-events:none;}
  .bird{position:absolute; will-change:transform; animation:fly var(--t,40s) linear var(--d,0s) infinite;}
  @keyframes fly{from{transform:translate(0,0);} to{transform:translate(var(--dx,-1400px), var(--dy,-120px));}}

  /* Global grade layers */
  .vignette{position:absolute; inset:0; z-index:12; pointer-events:none;
    background:radial-gradient(ellipse 75% 60% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);}
  .grain{position:absolute; inset:-100px; z-index:13; pointer-events:none; opacity:0.075;
    animation:grain 0.6s steps(6) infinite;}
  @keyframes grain{
    0%{transform:translate(0,0);} 20%{transform:translate(-30px,20px);} 40%{transform:translate(25px,-35px);}
    60%{transform:translate(-15px,40px);} 80%{transform:translate(35px,10px);} 100%{transform:translate(0,0);}
  }
  .cap-shade{position:absolute; left:0; right:0; bottom:0; height:760px; z-index:14; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.38) 45%, rgba(0,0,0,0) 100%);}
  .bar{position:absolute; left:0; right:0; height:118px; background:#000; z-index:20;}
  .bar.top{top:0;} .bar.bottom{bottom:0;}

  /* Chapter card */
  .chapter{position:absolute; left:0; right:0; top:210px; z-index:16; text-align:center; opacity:0; padding:0 80px;}
  .chapter .num{font-family:var(--sans); font-weight:500; font-size:20px; letter-spacing:0.55em; text-transform:uppercase; color:var(--accent);}
  .chapter .name{font-family:var(--serif); font-weight:500; font-size:88px; line-height:1.05; color:#FBF6EC; margin-top:18px;
    text-shadow:0 2px 30px rgba(0,0,0,0.55);}
  .chapter .rule{width:90px; height:1px; background:var(--accent); margin:26px auto 22px; opacity:0.9;}
  .chapter .ref{font-family:var(--sans); font-weight:400; font-size:22px; letter-spacing:0.28em; text-transform:uppercase; color:#EDE4D3; opacity:0.85;}

  /* Captions */
  .caption-wrap{position:absolute; left:0; right:0; bottom:240px; z-index:15; padding:0 96px; text-align:center;}
  .cap-line{font-family:var(--sans); font-weight:400; font-size:43px; line-height:1.45; color:#F6F0E5; opacity:0;
    text-shadow:0 2px 3px rgba(0,0,0,0.55), 0 0 32px rgba(0,0,0,0.6);}
  .cap-line b{font-weight:600; color:var(--accent);}
  .cap-line.scripture{font-family:var(--serif); font-style:italic; font-weight:500; font-size:60px; line-height:1.28; color:#FFF8EC;}
  .cap-line.scripture b{font-weight:600;}

  /* Cold open */
  .intro{position:absolute; inset:0; background:#000; z-index:30; display:flex; align-items:center; justify-content:center;
    animation:introOut 1.0s ease 3.3s forwards;}
  .intro .presents{position:absolute; text-align:center; font-family:var(--sans); font-weight:400; font-size:24px; letter-spacing:0.5em;
    text-transform:uppercase; color:#D8CFBE; opacity:0; animation:presents 2.0s ease 0.25s forwards; padding:0 60px;}
  .intro .presents small{display:block; margin-top:22px; font-size:17px; letter-spacing:0.45em; color:#9F978A;}
  .intro .film{position:absolute; text-align:center; font-family:var(--serif); font-weight:500; font-size:104px; line-height:1.02;
    color:#FBF4E6; padding:0 70px; opacity:0; animation:film 1.5s cubic-bezier(0.22,1,0.36,1) 2.15s forwards;}
  .intro .film-rule{position:absolute; top:calc(50% + 150px); width:0; height:1px; background:#C9A86E; animation:rule 1.2s ease 2.5s forwards;}
  @keyframes presents{0%{opacity:0;} 30%{opacity:1;} 72%{opacity:1;} 100%{opacity:0;}}
  @keyframes film{from{opacity:0; letter-spacing:0.16em; filter:blur(10px);} to{opacity:1; letter-spacing:0.01em; filter:blur(0);}}
  @keyframes rule{to{width:160px;}}
  @keyframes introOut{to{opacity:0;}}

  /* End card */
  .title-card{position:absolute; inset:0; z-index:18; opacity:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; text-align:center; padding:0 90px;
    background:radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0.84) 0%, rgba(0,0,0,0.95) 100%);}
  .title-card .rule{width:80px; height:1px; background:#E8C79A;}
  .title-card .brand{font-family:var(--serif); font-weight:600; font-size:76px; line-height:1.05; color:#FBF4E6;}
  .title-card .tagline{font-family:var(--serif); font-style:italic; font-weight:500; font-size:48px; color:#F2D7AE;}
  .title-card .meta{font-family:var(--sans); font-weight:400; font-size:21px; letter-spacing:0.2em; color:#CFC6B5; margin-top:12px;}
  .blackout{position:absolute; inset:0; background:#000; z-index:40; opacity:0;}
</style>
</head>

<div id="stage">

  <!-- ============ VALLEY: dusk desert valley, lone traveller ============ -->

    <div class="layer l-back">
      <svg viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">

          <linearGradient id="v-sky" x1="0" y1="0" x2="0" y2="1">

<script>
(function () {
  // Film grain: one noise tile, jittered by CSS (cheap, composited).
  try {
    var c = document.createElement("canvas");
    c.width = c.height = 220;
    var x = c.getContext("2d");
    var img = x.createImageData(220, 220);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
  } catch (e) {}

  // God rays.
  var NS = "http://www.w3.org/2000/svg";
  document.querySelectorAll("g.rays-gen").forEach(function (g) {
    var cx = +g.dataset.cx, cy = +g.dataset.cy, n = +g.dataset.n, len = +g.dataset.len, w = +g.dataset.w;
    for (var k = 0; k < n; k++) {
      var a = (k / n) * Math.PI * 2 + (k % 2 ? 0.05 : 0);
      var ww = (w * (k % 3 === 0 ? 1.6 : 1)) * Math.PI / 180;
      var p1x = cx + len * Math.cos(a - ww), p1y = cy + len * Math.sin(a - ww);
      var p2x = cx + len * Math.cos(a + ww), p2y = cy + len * Math.sin(a + ww);
      var poly = document.createElementNS(NS, "polygon");
      poly.setAttribute("points", cx + "," + cy + " " + p1x.toFixed(1) + "," + p1y.toFixed(1) + " " + p2x.toFixed(1) + "," + p2y.toFixed(1));
      g.appendChild(poly);
    }
  });

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // Particles.
  document.querySelectorAll(".fx").forEach(function (fx) {
    var type = fx.dataset.type, n = +(fx.dataset.n || 30);
    var color = fx.dataset.color;
    if (fx.dataset.area) {
      var ar = fx.dataset.area.split(",").map(Number);
      fx.style.left = ar[0] + "px"; fx.style.top = ar[1] + "px";
      fx.style.width = ar[2] + "px"; fx.style.height = ar[3] + "px";
      fx.style.right = "auto"; fx.style.bottom = "auto";
    }
    var W = fx.dataset.area ? +fx.dataset.area.split(",")[2] : 1080;
    var H = fx.dataset.area ? +fx.dataset.area.split(",")[3] : 1920;
    for (var i = 0; i < n; i++) {
      var p = document.createElement("span");
      p.className = "p " + type;
      var s, t, dx, dy, o, left, top, bg;
      if (type === "dust") {
        s = rnd(2, 5); t = rnd(14, 26); dx = rnd(-160, 160); dy = rnd(-220, -40); o = rnd(0.35, 0.8);
        left = rnd(0, W); top = rnd(500, H); bg = "rgba(" + (color || "255,214,160") + ",1)";
      } else if (type === "motes") {
        s = rnd(3, 8); t = rnd(10, 20); dx = rnd(-80, 80); dy = rnd(-520, -240); o = rnd(0.45, 0.95);
        left = rnd(60, W - 60); top = rnd(800, H); bg = "radial-gradient(circle, rgba(" + (color || "255,236,180") + ",1) 0%, rgba(" + (color || "255,236,180") + ",0) 70%)";
        s *= 2.2;
      } else if (type === "ash") {
        s = rnd(3, 7); t = rnd(12, 22); dx = rnd(-140, 140); dy = rnd(700, 1100); o = rnd(0.35, 0.75);
        left = rnd(0, W); top = rnd(-200, 900); bg = "rgba(" + (color || "190,186,180") + ",1)";
      } else if (type === "ember") {
        s = rnd(2, 5); t = rnd(6, 12); dx = rnd(-120, 120); dy = rnd(-900, -500); o = rnd(0.6, 1);
        left = rnd(80, 700); top = rnd(1400, 1800); bg = "rgba(255," + Math.round(rnd(110, 170)) + ",60,1)";
        p.style.boxShadow = "0 0 8px rgba(255,120,40,0.9)";
      } else if (type === "star") {
        s = rnd(1.2, 3.4); t = rnd(1.6, 4.5); o = rnd(0.5, 1);
        left = rnd(0, W); top = rnd(0, H); bg = "#F4F6FF";
        if (Math.random() < 0.12) { s += 1.2; p.style.boxShadow = "0 0 6px rgba(200,214,255,0.9)"; }
      } else if (type === "rain") {
        s = 2; t = rnd(0.7, 1.3); dx = rnd(-30, -10); dy = H + 140; o = rnd(0.25, 0.55);
        left = rnd(0, W); top = rnd(-160, -60);
        bg = "linear-gradient(to bottom, rgba(170,230,240,0) 0%, rgba(170,230,240,1) 100%)";
        p.style.height = rnd(40, 90) + "px";
      } else if (type === "bokeh") {
        s = rnd(40, 140); t = rnd(5, 11); o = rnd(0.25, 0.6);
        left = rnd(-40, W - 40); top = rnd(H * 0.25, H - 40);
        var warm = Math.random() < 0.5;
        bg = "radial-gradient(circle, " + (warm ? "rgba(255,190,110,0.9)" : "rgba(110,215,230,0.9)") + " 0%, rgba(0,0,0,0) 68%)";
      } else if (type === "smoke") {
        s = rnd(420, 760); t = rnd(26, 40); dx = rnd(-120, 120); dy = rnd(-420, -220); o = rnd(0.25, 0.45);
        left = rnd(-200, W - 300); top = rnd(500, 1300);
        bg = "radial-gradient(circle, rgba(96,94,92,0.75) 0%, rgba(60,60,60,0) 66%)";
      }
      p.style.width = s + "px";
      if (!p.style.height) p.style.height = s + "px";
      p.style.left = left + "px"; p.style.top = top + "px";
      p.style.background = bg;
      p.style.setProperty("--t", t + "s");
      p.style.setProperty("--d", (-Math.random() * t).toFixed(2) + "s");
      p.style.setProperty("--o", o);
      if (dx !== undefined) p.style.setProperty("--dx", dx + "px");
      if (dy !== undefined) p.style.setProperty("--dy", dy + "px");
      fx.appendChild(p);
    }
  });

  // Birds crossing the sunrise.
  var birds = document.getElementById("birds");
  if (birds) {
    for (var b = 0; b < 7; b++) {
      var d = document.createElement("div");
      d.className = "bird";
      var sz = rnd(18, 34);
      d.innerHTML = '<svg width="' + sz + '" height="' + (sz * 0.5) + '" viewBox="0 0 40 20"><path d="M 0 6 C 8 0 14 2 20 12 C 26 2 32 0 40 6 C 32 4 26 8 20 16 C 14 8 8 4 0 6 Z" fill="#3A2A3A"/></svg>';
      d.style.left = rnd(900, 1400) + "px";
      d.style.top = rnd(520, 900) + "px";
      d.style.setProperty("--t", rnd(34, 52) + "s");
      d.style.setProperty("--d", (-rnd(0, 30)).toFixed(1) + "s");
      d.style.setProperty("--dx", -rnd(1300, 1700) + "px");
      d.style.setProperty("--dy", -rnd(60, 220) + "px");
      birds.appendChild(d);
    }
  }
})();
</script>
