<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Today's Sermon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1080px;}
  body{
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    background:linear-gradient(165deg,#241B2E 0%, #171222 60%, #0E0A16 100%);
    color:#F6EAD2;
    position:relative;
    overflow:hidden;
  }
  .glow{position:absolute; top:-220px; right:-180px; width:620px; height:620px; border-radius:50%; background:radial-gradient(circle, rgba(201,169,104,0.35), transparent 70%); filter:blur(10px);}
  .frame{position:relative; width:1080px; height:1080px; padding:72px; display:flex; flex-direction:column;}
  .kicker{font-size:14px; font-weight:800; letter-spacing:0.22em; text-transform:uppercase; color:#C9A968;}
  .ref{font-size:17px; color:#A79BD0; font-weight:600; margin-top:10px;}
  .title{font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:56px; line-height:1.12; margin-top:26px; color:#FBF4E4;}
  .body{margin-top:40px; font-size:23px; line-height:1.68; color:#D9D0E8; font-weight:400;}
  .body p{margin:0 0 22px;}
  .body p:last-child{margin-bottom:0;}
  .spacer{flex:1;}
  .foot{display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(246,234,210,0.16); padding-top:28px;}
  .foot-cta{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; color:#F6EAD2;}
  .foot-cta svg{width:20px; height:20px;}
  .pill{background:#C9A968; color:#1A1430; font-weight:800; font-size:15px; padding:11px 22px; border-radius:100px;}
</style>
</head>
<body>
<div class="glow"></div>
<div class="frame">
  <div class="kicker">{{KICKER}}</div>
  <div class="ref">{{REF}}</div>
  <div class="title">{{TITLE_HTML}}</div>
  <div class="body">{{BODY_HTML}}</div>
  <div class="spacer"></div>
  <div class="foot">
    <div class="foot-cta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      Read the full teaching
    </div>
    <div class="pill">{{HANDLE}}</div>
  </div>
</div>
</body>
</html>
