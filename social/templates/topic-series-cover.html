<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Series Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FAF8F3; --surface:#FFFFFF; --ink:#262420; --ink-2:#585349; --ink-3:#8C8678;
    --gold:#A9824F; --gold-light:#D3AE75; --border:rgba(38,36,32,0.14);
    --font-display:'Newsreader', Georgia, serif; --font-body:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1350px;}
  body{font-family:var(--font-body); background:var(--bg); color:var(--ink); position:relative; overflow:hidden;}
  .grain{position:absolute; inset:0; background-image:radial-gradient(#EADFC4 1px, transparent 1px); background-size:24px 24px; opacity:0.35;}
  .frame{position:relative; width:1080px; height:1350px; padding:64px 80px 70px; display:flex; flex-direction:column;}

  .brandrow{display:flex; align-items:center; gap:10px;}
  .brandrow .mark{width:24px; height:24px; flex-shrink:0;}
  .brandrow .name{font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3);}

  .art-wrap{margin-top:14px; display:flex; align-items:center; justify-content:center;}
  .art-wrap svg{width:560px; height:560px;}

  .copy{margin-top:8px;}
  .eyebrow{font-size:13.5px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold);}
  .title{font-family:var(--font-display); font-weight:600; font-size:76px; line-height:1.06; color:var(--ink); margin-top:16px; letter-spacing:-0.5px;}
  .dek{font-size:21px; line-height:1.6; color:var(--ink-2); margin-top:20px; max-width:760px;}

  .spacer{flex:1;}
  .bottom{display:flex; align-items:center; justify-content:space-between;}
  .swipe{font-size:15px; font-weight:600; color:var(--ink-2); display:flex; align-items:center; gap:8px;}
  .swipe svg{width:18px; height:18px;}
  .dots{display:flex; gap:7px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--border);}
  .dots span.active{background:var(--gold);}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="frame">
    <div class="brandrow">
      <svg class="mark" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="21.3" fill="none" stroke="#A9824F" stroke-width="1.1"/>
        <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="#A9824F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="#D3AE75"/>
      </svg>
      <div class="name">Word &amp; Faith Network</div>
    </div>

    <div class="art-wrap">{{ART_SVG}}</div>

    <div class="copy">
      <div class="eyebrow">{{EYEBROW}}</div>
      <div class="title">{{TITLE_HTML}}</div>
      <div class="dek">{{DEK}}</div>
    </div>

    <div class="spacer"></div>

    <div class="bottom">
      <div class="swipe">Swipe for the first prayer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      <div class="dots">{{DOTS}}</div>
    </div>
  </div>
</body>
</html>
