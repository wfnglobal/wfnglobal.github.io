<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Follow Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1350px;}
  body{
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    background:
      radial-gradient(70% 50% at 50% 0%, rgba(201,169,104,0.18), transparent 70%),
      linear-gradient(170deg, #1C1A2B 0%, #131124 45%, #0A0916 100%);
    color:#F2ECDD;
    position:relative; overflow:hidden;
  }
  .frame{width:1080px; height:1350px; padding:90px 76px; display:flex; flex-direction:column; align-items:center; text-align:center;}
  .top-rule{width:44px; height:2px; background:#C9A968; margin-top:18px;}
  .progress{position:absolute; top:58px; right:76px; font-size:14px; font-weight:600; color:#8E86AE; letter-spacing:0.04em;}

  .mark-big{width:84px; height:84px; margin-top:120px;}
  .wordmark{font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:44px; color:#FBF4E4; margin-top:26px; letter-spacing:-0.3px;}
  .wordmark em{color:#C9A968; font-style:normal;}

  .closing{font-family:'Fraunces', Georgia, serif; font-style:italic; font-size:30px; line-height:1.5; color:#EADFC4; margin-top:38px; max-width:760px;}

  .cta-list{margin-top:76px; width:100%; max-width:760px; display:flex; flex-direction:column; gap:1px; border-top:1px solid rgba(242,236,221,0.16);}
  .cta-row{display:flex; align-items:center; gap:22px; padding:26px 8px; border-bottom:1px solid rgba(242,236,221,0.16); text-align:left;}
  .cta-row .icon{width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(201,169,104,0.14); color:#C9A968;}
  .cta-row .icon svg{width:20px; height:20px;}
  .cta-row .text{flex:1;}
  .cta-row .label{font-size:14px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#8E86AE;}
  .cta-row .value{font-family:'Fraunces', Georgia, serif; font-weight:600; font-size:24px; color:#FBF4E4; margin-top:2px;}

  .spacer{flex:1;}
  .foot-note{font-size:14px; color:#8E86AE; margin-top:30px;}
</style>
</head>
<body>
  <div class="progress">{{PROGRESS}}</div>
  <div class="frame">
    <svg class="mark-big" viewBox="0 0 48 48">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E4C684"/><stop offset="1" stop-color="#8E6A2E"/>
        </linearGradient>
      </defs>
      <circle cx="24" cy="24" r="21.3" fill="none" stroke="#C9A968" stroke-width="1"/>
      <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="#E4C684"/>
    </svg>
    <div class="wordmark">Word <em>&amp;</em> Faith Network</div>
    <div class="closing">{{CLOSING_LINE}}</div>

    <div class="cta-list">
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
        <div class="text"><div class="label">Follow</div><div class="value">{{HANDLE}}</div></div>
      </div>
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/></svg></div>
        <div class="text"><div class="label">Read daily</div><div class="value">{{WEBSITE}}</div></div>
      </div>
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2zm-1.2 18h1.7L7.4 4h-1.8l12.1 16z"/></svg></div>
        <div class="text"><div class="label">Follow on X</div><div class="value">{{X_HANDLE}}</div></div>
      </div>
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
        <div class="text"><div class="label">Get the app</div><div class="value">{{APP_NOTE}}</div></div>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="foot-note">{{FOOT_NOTE}}</div>
  </div>
</body>
</html>
