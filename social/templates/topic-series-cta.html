<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Follow Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FAF8F3; --surface:#FFFFFF; --ink:#262420; --ink-2:#585349; --ink-3:#8C8678;
    --gold:#A9824F; --gold-light:#D3AE75; --gold-wash:#F1E7D5; --border:rgba(38,36,32,0.14);
    --accent:{{ACCENT}};
    --font-display:'Newsreader', Georgia, serif; --font-body:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1350px;}
  body{font-family:var(--font-body); background:var(--bg); color:var(--ink); position:relative; overflow:hidden;}
  .wash{position:absolute; inset:0; background:radial-gradient(55% 40% at 50% 18%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 72%);}
  .grain{position:absolute; inset:0; background-image:radial-gradient(#EADFC4 1px, transparent 1px); background-size:24px 24px; opacity:0.35;}
  .frame{position:relative; width:1080px; height:1350px; padding:80px 90px; display:flex; flex-direction:column; align-items:center; text-align:center;}

  .dots{position:absolute; top:64px; right:90px; display:flex; gap:7px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--border);}
  .dots span.active{background:var(--gold);}

  .art-wrap{margin-top:10px;}
  .art-wrap svg{width:380px; height:380px;}

  .wordmark{font-family:var(--font-display); font-weight:700; font-size:52px; color:var(--ink); margin-top:20px; letter-spacing:-0.3px;}
  .wordmark em{color:var(--gold); font-style:normal;}

  .closing{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:37px; line-height:1.44; color:var(--ink-2); margin-top:34px; max-width:800px;}

  .cta-list{margin-top:56px; width:100%; max-width:780px; display:flex; flex-direction:column; gap:16px;}
  .cta-row{display:flex; align-items:center; gap:22px; padding:28px 32px; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:16px;}
  .cta-row .icon{width:50px; height:50px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--gold-wash); color:var(--gold);}
  .cta-row .icon svg{width:23px; height:23px;}
  .cta-row .text{flex:1;}
  .cta-row .label{font-size:18px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-2);}
  .cta-row .value{font-family:var(--font-display); font-weight:700; font-size:33px; color:var(--ink); margin-top:6px;}

  .spacer{flex:1;}
  .foot-note{font-size:19px; font-weight:700; color:var(--ink-2); margin-top:28px;}
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="grain"></div>
  <div class="frame">
    <div class="dots">{{DOTS}}</div>

    <div class="art-wrap">{{ART_SVG}}</div>
    <div class="wordmark">Word <em>&amp;</em> Faith Network</div>
    <div class="closing">{{CLOSING_LINE}}</div>

    <div class="cta-list">
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
        <div class="text"><div class="label">Follow</div><div class="value">{{HANDLE}}</div></div>
      </div>
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/></svg></div>
        <div class="text"><div class="label">Read daily</div><div class="value">{{WEBSITE}}</div></div>
      </div>
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2zm-1.2 18h1.7L7.4 4h-1.8l12.1 16z"/></svg></div>
        <div class="text"><div class="label">Follow on X</div><div class="value">{{X_HANDLE}}</div></div>
      </div>
      <div class="cta-row">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
        <div class="text"><div class="label">Get the app</div><div class="value">{{APP_NOTE}}</div></div>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="foot-note">{{FOOT_NOTE}}</div>
  </div>
</body>
</html>
