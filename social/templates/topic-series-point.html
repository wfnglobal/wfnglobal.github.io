<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Series Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FAF8F3; --surface:#FFFFFF; --ink:#262420; --ink-2:#585349; --ink-3:#8C8678;
    --gold:#A9824F; --gold-light:#D3AE75; --border:rgba(38,36,32,0.14);
    --accent:{{ACCENT}};
    --font-display:'Newsreader', Georgia, serif; --font-body:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1350px;}
  body{font-family:var(--font-body); background:var(--bg); color:var(--ink); position:relative; overflow:hidden;}
  .wash{position:absolute; inset:0; background:radial-gradient(60% 46% at 88% 6%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);}
  .grain{position:absolute; inset:0; background-image:radial-gradient(#EADFC4 1px, transparent 1px); background-size:24px 24px; opacity:0.35;}
  .corner-art{position:absolute; top:-96px; right:-96px; width:460px; height:460px;}
  .watermark{position:absolute; left:-30px; bottom:120px; font-family:var(--font-display); font-weight:700; font-size:620px; line-height:1; color:var(--accent); opacity:0.1; letter-spacing:-20px; user-select:none;}
  .frame{position:relative; width:1080px; height:1350px; padding:64px 80px 70px; display:flex; flex-direction:column;}

  .top{display:flex; align-items:center;}
  .eyebrow-row{display:flex; align-items:center; gap:10px;}
  .eyebrow-row .dot{width:12px; height:12px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  .dots{display:flex; gap:7px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--border);}
  .dots span.active{background:var(--gold);}
  .eyebrow{font-size:20px; font-weight:800; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink);}

  .center{position:relative; flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0;}

  .numeral{font-family:var(--font-display); font-weight:700; font-size:130px; line-height:0.8; color:var(--accent); opacity:0.9; margin-bottom:-14px;}
  .hook{font-family:var(--font-display); font-weight:600; font-size:56px; line-height:1.12; color:var(--ink); margin-top:8px; max-width:880px; letter-spacing:-0.4px;}

  .body{margin-top:30px; font-size:23px; line-height:1.68; color:var(--ink-2); max-width:840px;}
  .body p{margin:0 0 18px;}
  .body p:last-child{margin-bottom:0;}

  .verse-card{margin-top:46px; position:relative; background:var(--surface); border:1px solid var(--border); border-left:6px solid var(--accent); border-radius:18px; padding:32px 36px;}
  .verse-text{font-family:var(--font-display); font-style:italic; font-size:22px; line-height:1.55; color:var(--ink);}
  .verse-ref{margin-top:14px; font-size:19px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent);}

  .foot{position:relative; display:flex; align-items:center; gap:10px; margin-top:40px; justify-content:space-between;}
  .foot-brand{display:flex; align-items:center; gap:10px;}
  .foot .mark{width:22px; height:22px; flex-shrink:0;}
  .foot-name{font-size:16px; font-weight:700; color:var(--ink-2); letter-spacing:0.02em;}
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="grain"></div>
  <div class="watermark">{{NUMERAL}}</div>
  <div class="corner-art">{{CORNER_ART_SVG}}</div>
  <div class="frame">
    <div class="top">
      <div class="eyebrow-row"><span class="dot"></span><span class="eyebrow">{{EYEBROW}}</span></div>
    </div>

    <div class="center">
      <div class="numeral">{{NUMERAL}}</div>
      <div class="hook">{{HOOK_HTML}}</div>
      <div class="body">{{BODY_HTML}}</div>

      <div class="verse-card">
        <div class="verse-text">{{VERSE_TEXT}}</div>
        <div class="verse-ref">{{VERSE_REF}}</div>
      </div>
    </div>

    <div class="foot">
      <div class="foot-brand">
        <svg class="mark" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="21.3" fill="none" stroke="#A9824F" stroke-width="1.3"/>
          <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="#A9824F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="#D3AE75"/>
        </svg>
        <div class="foot-name">Word &amp; Faith Network</div>
      </div>
      <div class="dots">{{DOTS}}</div>
    </div>
  </div>
</body>
</html>
