<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WFN Series Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FAF8F3; --surface:#FFFFFF; --ink:#262420; --ink-2:#585349; --ink-3:#8C8678;
    --gold:#A9824F; --gold-light:#D3AE75; --border:rgba(38,36,32,0.14);
    --font-display:'Newsreader', Georgia, serif; --font-body:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1350px;}
  body{font-family:var(--font-body); background:var(--bg); color:var(--ink); position:relative; overflow:hidden;}
  .grain{position:absolute; inset:0; background-image:radial-gradient(#EADFC4 1px, transparent 1px); background-size:24px 24px; opacity:0.35;}
  .corner-art{position:absolute; top:-70px; right:-70px; width:340px; height:340px; opacity:0.9;}
  .frame{position:relative; width:1080px; height:1350px; padding:64px 80px 70px; display:flex; flex-direction:column;}

  .top{display:flex; align-items:center; justify-content:space-between;}
  .dots{display:flex; gap:7px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--border);}
  .dots span.active{background:var(--gold);}
  .eyebrow{font-size:16.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink-3);}

  .center{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0;}

  .numeral{font-family:var(--font-display); font-style:italic; font-size:27px; color:var(--gold); margin-top:0;}
  .hook{font-family:var(--font-display); font-weight:600; font-size:64px; line-height:1.1; color:var(--ink); margin-top:18px; max-width:900px; letter-spacing:-0.5px;}

  .body{margin-top:32px; font-size:25.5px; line-height:1.6; color:var(--ink-2); max-width:880px;}
  .body p{margin:0 0 20px;}
  .body p:last-child{margin-bottom:0;}

  .verse-card{margin-top:48px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:38px 42px;}
  .verse-text{font-family:var(--font-display); font-style:italic; font-size:25px; line-height:1.5; color:var(--ink);}
  .verse-ref{margin-top:14px; font-size:15.5px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--gold);}

  .foot{display:flex; align-items:center; gap:12px; margin-top:44px;}
  .foot .mark{width:26px; height:26px; flex-shrink:0;}
  .foot-name{font-size:16px; font-weight:600; color:var(--ink-3); letter-spacing:0.02em;}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="corner-art">{{CORNER_ART_SVG}}</div>
  <div class="frame">
    <div class="top">
      <div class="eyebrow">{{EYEBROW}}</div>
      <div class="dots">{{DOTS}}</div>
    </div>

    <div class="center">
      <div class="numeral">{{NUMERAL}}</div>
      <div class="hook">{{HOOK_HTML}}</div>
      <div class="body">{{BODY_HTML}}</div>

      <div class="verse-card">
        <div class="verse-text">{{VERSE_TEXT}}</div>
        <div class="verse-ref">{{VERSE_REF}}</div>
      </div>
    </div>

    <div class="foot">
      <svg class="mark" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="21.3" fill="none" stroke="#A9824F" stroke-width="1.3"/>
        <path d="M15 32 L18.5 16 L21.75 27 L24 18 L26.25 27 L29.5 16 L33 32" fill="none" stroke="#A9824F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 16 C21.75 12 22.25 8.5 24 5.5 C25.75 8.5 26.25 12 24 16 Z" fill="#D3AE75"/>
      </svg>
      <div class="foot-name">Word &amp; Faith Network</div>
    </div>
  </div>
</body>
</html>
