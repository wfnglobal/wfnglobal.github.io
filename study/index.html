<style>
  html,body{margin:0; height:100%; background:#120C07; color:#F6EBD6; font-family:Georgia, 'Times New Roman', serif;}
  body{display:flex; align-items:center; justify-content:center; text-align:center; padding:0 16px;}
  h1{font-weight:500; font-size:30px; margin:0 0 10px; color:#F2D493;}
  p{font-family:-apple-system, system-ui, sans-serif; font-size:15px; color:rgba(246,235,214,0.75); margin:0 0 18px;}
  a{display:inline-block; padding:12px 26px; border-radius:100px; background:#E2BC72; color:#1E140A; text-decoration:none; font-family:-apple-system, system-ui, sans-serif; font-weight:600; font-size:15px;}

<body>
  <div>
    <h1>Daily Bread for the Soul</h1>
    <p>Opening today's Bible Study…</p>
    <a id="go" href="/app/#/study">Read today's study</a>
  </div>
<script>
(function () {
  var fallback = "/app/#/study";
  function go(url) { document.getElementById("go").setAttribute("href", url); location.replace(url); }
  try {
    fetch("/app/data/today.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { go(d && d.bibleStudy && d.bibleStudy.slug ? "/app/#/study/" + d.bibleStudy.slug : fallback); })
      .catch(function () { go(fallback); });
  } catch (e) { go(fallback); }
})();
</script>
