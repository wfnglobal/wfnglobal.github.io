<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Bible Study — Word and Faith Network</title>
<!-- Permanent share link (wfnglobal.org/study) printed on the daily study
     posters: forwards to today's Bible study in the app, read from
     app/data/today.json (bibleStudy.slug). -->
<meta name="description" content="A new Bible study every morning from Word and Faith Network: sharp, warm and rooted in Scripture.">
<link rel="canonical" href="https://wfnglobal.org/study/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Word and Faith Network">
<meta property="og:title" content="Today's Bible Study — Word and Faith Network">
<meta property="og:description" content="A new Bible study every morning: sharp, warm and rooted in Scripture.">
<meta property="og:url" content="https://wfnglobal.org/study/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/app/icons/icon-192.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CWM8XH3FTC"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CWM8XH3FTC');
</script>
<style>
  html,body{margin:0; height:100%; background:#F6F5F2; color:#1F1D1B; font-family:Georgia, 'Times New Roman', serif;}
  body{display:flex; align-items:center; justify-content:center; text-align:center; padding:0 16px;}
  h1{font-weight:500; font-size:30px; margin:0 0 10px;}
  p{font-family:-apple-system, system-ui, sans-serif; font-size:15px; color:#6b655c; margin:0 0 18px;}
  a{display:inline-block; padding:12px 26px; border-radius:100px; background:#1F1D1B; color:#F6F5F2; text-decoration:none; font-family:-apple-system, system-ui, sans-serif; font-weight:600; font-size:15px;}
</style>
</head>
<body>
  <div>
    <h1 id="t">Today's Bible Study</h1>
    <p>Opening today's study…</p>
    <a id="go" href="/app/#/study">Read today's study</a>
  </div>
<script>
(function () {
  var done = false;
  function go(url) { if (done) return; done = true; location.replace(url); }
  setTimeout(function () { go("/app/#/study"); }, 2500);
  fetch("/app/data/today.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
    var s = d && d.bibleStudy;
    if (s && s.slug) { document.getElementById("t").textContent = s.title || "Today's Bible Study"; var u = "/app/#/study/" + encodeURIComponent(s.slug); document.getElementById("go").href = u; go(u); }
    else go("/app/#/study");
  }).catch(function () { go("/app/#/study"); });
})();
</script>
</body>
</html>
